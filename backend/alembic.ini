# Alembic configuration.  Run from backend/:
#
#     alembic upgrade head          # bring the database to the current schema
#     alembic current               # what revision is it on?
#     alembic revision --autogenerate -m "add x to y"
#
# sqlalchemy.url is deliberately EMPTY.  The URL belongs to
# EASYCUSTOMS_DATABASE_URL, read through app.config in alembic/env.py, so there
# is exactly one place a database is named and no chance of migrating a
# different database from the one the app serves.

[alembic]
script_location = alembic
prepend_sys_path = .
# Split prepend_sys_path on the OS separator rather than alembic's legacy
# "spaces, commas and colons" rule, which mangles a Windows path like C:\...
path_separator = os
# Revision filenames sort chronologically, so `ls alembic/versions` reads as
# the order they were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
