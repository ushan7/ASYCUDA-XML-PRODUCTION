                              if(fl && fl.length && role) stageAdd(role, fl); e.target.value=""; }} />
        <div className="grid">
          {ROLES.map(r=>{
            const rdocs = docs.filter(d=>d.role===r.id);
            // A box shows ONE document but a role may hold several (a shipment
            // can carry two invoices).  An unanswered role-mismatch outranks a
            // healthy sibling: otherwise the card keeps showing the good
            // document and the decision the backend is waiting for has no
            // button anywhere on the page.
            const doc = rdocs.find(d=>d.status==="ROLE_REVIEW_REQUIRED")
                     || rdocs.find(d=>!DEAD.includes(d.status)) || rdocs[rdocs.length-1];
            const failed = doc && doc.status==="FAILED";
            const rejected = doc && doc.status==="ROLE_REJECTED";
            const undecided = doc && doc.status==="ROLE_REVIEW_REQUIRED";
            const staged = doc && doc.status==="UPLOADED";   // stored, awaiting Continue
            const isUp = !!uploading[r.id];
            // …or a claim held by the server: this tab may have been reloaded,
            // or the extraction started in another one.
            const isEx = !!extracting[r.id] || !!(doc && doc.status==="EXTRACTING");
            const deciding = busy==="role:"+(doc&&doc.document_id);
            const removing = busy==="rm:"+(doc&&doc.document_id);
            // the same states in which the file input renders: empty box, or a
            // dead document (failed / rejected) whose slot is free again
            const canTake = !busy && !isUp && !isEx && (!doc || failed || rejected);
            return (
              <div key={r.id}
                   className={"box "+(dragRole===r.id&&canTake?"drag ":"")
                     +((doc&&!failed&&!staged&&!rejected&&!isEx)?"filled":(r.req?"req":""))}
                   onDragOver={e=>{ if(canTake){ e.preventDefault(); if(dragRole!==r.id) setDragRole(r.id); } }}
                   onDragEnter={e=>{ if(canTake){ e.preventDefault(); setDragRole(r.id); } }}
                   onDragLeave={e=>{ if(!e.currentTarget.contains(e.relatedTarget) && dragRole===r.id) setDragRole(null); }}
                   onDrop={e=>{ e.preventDefault(); setDragRole(null);
                     if(!canTake) return;
                     const fl = Array.from(e.dataTransfer.files||[]);
                     if(!fl.length) return;
                     if(fl.length===1) upload(r.id, fl[0]);
                     // several photos at once → the stage, so the reviewer sets
                     // the page order and confirms they are ONE document
                     else if(fl.every(isImageFile)) stageAdd(r.id, fl);
                     else setErr("Drop one PDF at a time — or drop only photos (JPEG/PNG), "
                                +"which combine into ONE multi-page document."); }}>
                <div className="role">
                  <span>{r.label} {r.req && <span className="muted">*</span>}</span>
                  {isUp ? <span className="pill" style={{display:"inline-flex",alignItems:"center",gap:6}}><Spin/> uploading…</span>
                   : isEx ? <span className="pill" style={{display:"inline-flex",alignItems:"center",gap:6,background:"var(--warnbg)",color:"#78350f"}}><Spin tone="w"/> extracting…</span>
                   : doc ? <span className={"pill "+((failed||rejected||doc.role_match===false)?"no":staged?"":"ok")}>{failed?"failed — retry":staged?"uploaded — pending":rejected?"rejected — not declared":undecided?"role mismatch — decide below":doc.role_match===false?"role confirmed by reviewer":"extracted"}</span>
                   : <span className="tag">{r.tag}</span>}
                </div>
                {undecided && !isUp && !isEx &&
                  <div className="msg w" style={{marginTop:8}}>
                    <div><b>{doc.file}</b> does not look like a <b>{r.label}</b>. Declaring it as
                      one would put its rows, totals and parties on the SAD. Check the document,
                      then decide:</div>
                    <div className="row" style={{marginTop:8}}>
                      <button className="btn ghost" disabled={!!busy}
                              title="open the stored upload in the evidence viewer before deciding"
                              onClick={()=>openDoc(doc.document_id)}>👁 View the document</button>
                      <button className="btn" disabled={!!busy}
                              onClick={()=>decideRole(doc.document_id, true)}>
                        {deciding ? "…" : "It is a "+r.label+" — use it"}</button>
                      <button className="btn ghost" disabled={!!busy}
                              onClick={()=>decideRole(doc.document_id, false)}>
                        {deciding ? "…" : "Wrong box — exclude it"}</button>
                    </div>
                  </div>}
                {rejected && <div className="tag" style={{marginTop:6}}>excluded from the declaration; the upload and its read text are kept — attach a replacement below or remove it</div>}
                {isUp ? <div className="tag" style={{marginTop:9,display:"flex",alignItems:"center",gap:7}}>
                          <Spin/> {uploading[r.id]} — uploading…</div>
                 : isEx ? <div className="tag" style={{marginTop:9,display:"flex",alignItems:"center",gap:7}}>
                          <Spin tone="w"/> {extracting[r.id]||(doc&&doc.file)} — {ENGINE} running…</div>
                 : (doc && !failed && !rejected)
                   ? <div className="tag" style={{marginTop:6,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                       <button type="button" className="doclink" title="open this document in the viewer"
                               onClick={()=>openDoc(doc.document_id)}>📄 {doc.file}</button>
                       <button type="button" className="xbtn" disabled={!!busy}
                               title="detach this document from the job — attach a different file afterwards"
                               onClick={()=>removeDoc(doc)}>{removing?"removing…":"✕ remove"}</button>
                     </div>
                   : <React.Fragment>
                       {doc && (failed || rejected) &&
                         <div style={{marginTop:6}}>
                           <button type="button" className="xbtn" disabled={!!busy}
                                   title={"forget "+doc.file+" entirely (its "+(failed?"failed run":"rejection")+" stops showing here)"}
                                   onClick={()=>removeDoc(doc)}>{removing?"removing…":"✕ remove "+doc.file}</button>
                         </div>}
                       {stage && stage.role===r.id
                         ? <div className="pstage">
                             <div className="phead">📷 One document from {stage.items.length} photo{stage.items.length>1?"s":""}</div>
                             <div className="phint">Pages of the SAME document, in reading order — a different
                               document gets its own upload. Confirming merges them into one multi-page PDF.</div>
                             <div className="pthumbs">
                               {stage.items.map((it,i)=>{
                                 const small = !it.w || Math.min(it.w,it.h)<MIN_PHOTO_PX;
                                 return (
                                   <div key={it.url} className={"pthumb"+(small?" bad":"")}>
                                     <img src={it.url} alt={"page "+(i+1)+" — "+it.file.name}/>
                                     <span className="pno">{i+1}</span>
                                     <div className="pops">
                                       <button type="button" title="move this page earlier" disabled={i===0}
                                               onClick={()=>stageMove(i,-1)}>←</button>
                                       <button type="button" title="remove this photo" onClick={()=>stageRemove(i)}>✕</button>
                                       <button type="button" title="move this page later" disabled={i===stage.items.length-1}
                                               onClick={()=>stageMove(i,1)}>→</button>
                                     </div>
                                     {small && <div className="pwarn">{it.w?`${it.w}×${it.h}px — too small, retake`:"unreadable"}</div>}
                                   </div>);
                               })}
                             </div>
                             <div className="row">
                               <button type="button" className="pbtn" disabled={!!busy}
                                       onClick={()=>pickPhotos(r.id,false)}>+ Add photos</button>
                               <button type="button" className="pbtn" disabled={!!busy}
                                       onClick={()=>pickPhotos(r.id,true)}>📷 Take another</button>
                               <button type="button" className="btn" disabled={!!busy||isUp}
                                       onClick={stageConfirm}>
                                 Use {stage.items.length} photo{stage.items.length>1?"s":""} → one document</button>
                               <button type="button" className="btn ghost" onClick={stageClose}>Cancel</button>
                             </div>
                           </div>
                         : <React.Fragment>
                             <input type="file" accept={ACCEPT_DOCS} disabled={!!busy}
                                    aria-label={"attach "+r.label+" PDF or photo"}
                                    onChange={e=>{ const f=e.target.files[0]; e.target.value=""; if(f) upload(r.id,f); }} />
                             <div className="pbtns">
                               <button type="button" className="pbtn" disabled={!!busy}
                                       title="combine several photos (pages of one document) into a single upload"
                                       onClick={()=>pickPhotos(r.id,false)}>🖼 Add photos</button>
                               <button type="button" className="pbtn" disabled={!!busy}
                                       title="photograph the document with this device's camera"
                                       onClick={()=>pickPhotos(r.id,true)}>📷 Take photo</button>
                             </div>
                           </React.Fragment>}
                     </React.Fragment>}
                {doc && !isUp && !isEx && doc.warnings && doc.warnings.length>0 &&
                  <details style={{marginTop:6}}><summary>{doc.warnings.length} note(s)</summary>
                    {doc.warnings.map((w,i)=><div key={i} className="tag">• {maskEngine(typeof w==="string"?w:(w.message||w.code))}</div>)}
                  </details>}
              </div>
            );
          })}
        </div>
        {job && pendingDocs.length>0 && !anyExtracting &&
          <div className="row" style={{marginTop:12}}>
            <button className="btn big" onClick={continueExtraction} disabled={anyUploading||!!busy}>
              Continue → {pendingDocs.some(d=>d.status==="FAILED")?"Extract / retry":"Extract"} {pendingDocs.length} document{pendingDocs.length>1?"s":""}</button>
            <span className="tag">runs {ENGINE}, then computes the critical review automatically</span>
          </div>}
        {anyExtracting &&
          <div className="msg w" style={{marginTop:12}}>
            <div className="runbar">
              <Spin size="lg" tone="w"/>
              <div>
                <div className="rt">{ENGINE_RUNNING}</div>
                <div>Processing {extractingCount} document(s)…</div>
              </div>
            </div>
            <div className="runtrack"><i/></div>
          </div>}
        {job && !anyExtracting && undecidedDocs.length>0 &&
          <div className="msg w" style={{marginTop:12}}>
            <b>{undecidedDocs.length} document(s) need a role decision</b> before the review can be
            computed — {undecidedDocs.map(d=>d.file).join(", ")}. Use the buttons on the affected
            box above: confirm the role (the document is used as declared) or exclude it.
          </div>}
        {job && !anyExtracting && (canReview
          ? <div className="msg ok" style={{marginTop:12}}>✔ All required documents extracted — continue to <b>step 2 · Critical Review</b>.</div>
          : REQUIRED.some(r=>!present.has(r))
            ? <div className="msg w" style={{marginTop:12}}>Upload the remaining required document(s): <b>
                {REQUIRED.filter(r=>!present.has(r)).map(r=>ROLES.find(x=>x.id===r).label).join(", ")}
              </b>{pendingDocs.length>0?" — or click Continue to extract what's uploaded so far.":""}</div>
            : null)}
      </div>

      {/* STEP 2 */}
      <div className="card critical">
        <h2><span className="htxt"><span className="step">2</span> Critical Review — confirm the declaration control values</span>
            <GuideButton onOpen={setGuide} section="critical"/></h2>
        {qReturn && <button type="button" className="qback" data-ec-goto="queue"
                onClick={()=>setQReturn(false)}>← Back to the Decision queue</button>}
        <NoteLine section="critical" onGuide={setGuide} label="Critical Review"
                  style={{margin:"0 0 12px"}}>
          The declaration-level control point: invoice, shipment, party, banking, payment, freight, insurance and document references are confirmed here before item allocation and XML. Confirming re-runs allocation only — never re-reads the documents. Values marked <span style={{color:"var(--brand)"}}>*</span> are required.
        </NoteLine>
        <button className="btn" onClick={runReview} disabled={!canReview||!!busy||anyUploading||anyExtracting}>{busy==="review"?<span style={{display:"inline-flex",alignItems:"center",gap:8}}><Spin tone="on"/> Computing…</span>:anyExtracting?<span style={{display:"inline-flex",alignItems:"center",gap:8}}><Spin tone="on"/> Waiting for extraction…</span>:review?"Recompute Critical Review":"Compute Critical Review"}</button>
        {!canReview && <span className="pill" style={{marginLeft:10}}>upload the commercial invoice first</span>}
        {review && rv && <div style={{marginTop:14}}>

          {/* Jump index over the seven sections of the form. */}
          <div className="crnav">
            <span className="crlbl">Jump to</span>
            {CR_SECTIONS.map(s=>(
                <button key={s.id} type="button" className="ichip"
                        title={"jump to "+s.label}
                        onClick={()=>jumpToSection(s.id)}>
                  {s.label}</button>))}
          </div>

          {/* 1 · declaration summary */}
          <div className="kpi">
            <div className="k"><div className="lbl">Items / forms</div><div className="val">{review.invoice_item_count} <span style={{fontSize:13,color:"var(--muted)"}}>/ {review.total_number_of_forms}</span></div><div className="src">goods lines / SAD forms</div></div>
            <div className="k"><div className="lbl">Total invoice</div><div className="val">{review.calculated_goods_total}</div><div className="src">{review.goods_currency} (invoice currency)</div></div>
            <div className="k"><div className="lbl">Gross weight</div><div className="val">{review.gross_weight||"—"}</div><div className="src">{review.gross_weight_source} · {review.weight_unit_evidence||"unit?"}
              {(()=>{ const d=sourceDocFor(review.gross_weight_source);
                return d ? <button type="button" className="doclink" style={{marginLeft:5}}
                                   title={`verify against ${d.file}`}
                                   onClick={()=>openDoc(d.document_id,null,"gross weight")}>📄</button> : null; })()}</div></div>
            <div className="k"><div className="lbl">Packages</div><div className="val">{review.total_packages||"—"}</div><div className="src">{review.packages_source}
              {(()=>{ const d=sourceDocFor(review.packages_source);
                return d ? <button type="button" className="doclink" style={{marginLeft:5}}
                                   title={`verify against ${d.file}`}
                                   onClick={()=>openDoc(d.document_id,null,"packages")}>📄</button> : null; })()}</div></div>
          </div>
          <ReviewWarnings items={review.warnings}/>

          {/* customs office & regime — declaration identity (Boxes A, 1, 29, 37, 27, 30) */}
          <div className="sect" id="cr-regime">
            <SectHead title="Customs office & regime" section="critical" onGuide={setGuide}>
              Declaration identity, validated against the NECAS reference tables
              ({officeRef.length||71} customs offices · 17 declaration models · ANNEX 1/3 procedures).
              Box 37 stays 4000 000 unless you choose otherwise. 💾 saves the picks on the job so they
              survive reloads; without saving they still apply to this finalize.
            </SectHead>
            {/* row 1 · declaration identity · row 2 · procedure + place · row 3 · cargo */}
            <div className="fgrid">
              <div className="fbox s4"><label className="f">Declaration form (Box 1) — one line, type + code</label>
                {declModelRef.length ? (
                  <select className="t" value={declLine} onChange={onDeclLine}>
                    {!declModelRef.some(m=>`${m.type} ${m.code}`===declLine) &&
                      <option value={declLine}>{declLine} — (not in reference)</option>}
                    {declModelRef.map(m=>
                      <option key={m.type+m.code} value={`${m.type} ${m.code}`}>{m.type} {m.code} — {m.description}</option>)}
                  </select>
                ) : (
                  <div style={{display:"flex",gap:8}}>
                    <input className="t" style={{maxWidth:80}} title="type (IM/EX/…)" value={rv.declaration_type} onChange={set("declaration_type")}/>
                    <input className="t" style={{maxWidth:60}} title="general procedure digit" value={rv.gen_procedure_code} onChange={set("gen_procedure_code")}/>
                  </div>
                )}
              </div>
              <div className="fbox s4"><label className="f">Customs clearance office (Box A)</label>
                {officeRef.length ? (
                  <RefCombo listId="office-list" placeholder="type office code or name…"
                    items={officeRef.map(o=>({code:o.code, label:o.name}))}
                    value={rv.customs_office_code} disabled={false}
                    onPick={o=>setRv(v=>({...v, customs_office_code:o.code, customs_office_name:o.label}))}
                    onRaw={raw=>setRv(v=>({...v, customs_office_code:raw.toUpperCase(), customs_office_name:""}))}/>
                ) : (
                  <input className="t" value={rv.customs_office_code} onChange={set("customs_office_code")}/>
                )}
                <span className="tag">{rv.customs_office_name || "not in the office reference"}</span>
              </div>
              <div className="fbox s4"><label className="f">Border office (Box 29)</label>
                <label style={{display:"flex",gap:7,alignItems:"center",fontSize:12,margin:"6px 0"}}>
                  <input type="checkbox" checked={!!rv.border_office_code}
                         onChange={e=>setRv(v=>({...v, border_office_code: e.target.checked ? (v.customs_office_code||"") : ""}))}/>
                  differs from the clearance office (Nepal-to-Nepal cargo via India/China)
                </label>
                {rv.border_office_code ? (
                  officeRef.length ? (
                    <RefCombo listId="border-office-list" placeholder="type border office code or name…"
                      items={officeRef.map(o=>({code:o.code, label:o.name}))}
                      value={rv.border_office_code} disabled={false}
                      onPick={o=>setRv(v=>({...v, border_office_code:o.code}))}
                      onRaw={raw=>setRv(v=>({...v, border_office_code:raw.toUpperCase()}))}/>
                  ) : (
                    <input className="t" value={rv.border_office_code} onChange={set("border_office_code")}/>
                  )
                ) : (
                  <span className="tag">same as clearance office — {rv.customs_office_code||"—"}</span>
                )}
              </div>
              <div className="fbox s4"><label className="f">Extended procedure (Box 37) — filtered to {declLine||"the Box-1 line"}</label>
                {extProcRef.length ? (
                  <select className="t" value={rv.extended_customs_procedure} onChange={set("extended_customs_procedure")}>
                    {rv.extended_customs_procedure && !extFiltered.some(p=>p.code===rv.extended_customs_procedure) &&
                      <option value={rv.extended_customs_procedure}>{rv.extended_customs_procedure} — (does not match Box 1 — change one of them)</option>}
                    {extFiltered.map((p,i)=>
                      <option key={p.code+"|"+i} value={p.code}>{p.code} — {p.description}</option>)}
                  </select>
                ) : (
                  <input className="t" value={rv.extended_customs_procedure} onChange={set("extended_customs_procedure")}/>
                )}
              </div>
              <div className="fbox s5"><label className="f">National procedure (Box 37) — sets the duty treatment</label>
                {natProcRef.length ? (
                  <RefCombo listId="natproc-list" placeholder="type code or search the exemption text…"
                    items={natProcRef.map(p=>({code:p.code, label:p.description}))}
                    value={rv.national_customs_procedure} disabled={false}
                    onPick={p=>setRv(v=>({...v, national_customs_procedure:p.code}))}
                    onRaw={raw=>setRv(v=>({...v, national_customs_procedure:raw}))}/>
                ) : (
                  <input className="t" value={rv.national_customs_procedure} onChange={set("national_customs_procedure")}/>
                )}
                <span className="tag">{(natProcRef.find(p=>p.code===rv.national_customs_procedure)||{}).description || "not in ANNEX 3"}</span>
              </div>
              <div className="fbox s3"><label className="f">Location of goods (Box 30)</label>
                <input className="t" placeholder="e.g. TIA...IM/GODOWN" value={rv.location_of_goods} onChange={set("location_of_goods")}/></div>
              <div className="fbox s3"><label className="f">Place of loading code (Box 27)</label>
                <input className="t" placeholder="e.g. NPKTM" value={rv.place_of_loading_code} onChange={set("place_of_loading_code")}/></div>
              <div className="fbox s3"><label className="f">Container flag</label>
                <label style={{display:"flex",gap:7,alignItems:"center",fontSize:12,marginTop:8}}>
                  <input type="checkbox" checked={!!rv.container_flag} onChange={set("container_flag")}/>
                  containerised cargo
                </label>
                {rv.border_mode==="04" && !rv.container_flag &&
                  <span className="tag">border mode 04 is a containerised truck — tick this?</span>}
              </div>
            </div>
            <div className="row" style={{marginTop:10}}>
              <button className="btn ghost" disabled={!!busy} onClick={saveRegimeDefaults}>
                💾 Save regime as job defaults — survives reloads & recomputes</button>
              <span className="tag">saving recomputes the review and invalidates any generated XML</span>
            </div>
          </div>

          {/* shipment totals & package type */}
          <div className="sect" id="cr-totals">
            <SectHead title="Shipment totals & packages" section="critical" onGuide={setGuide}>
              Item weights/packages are reconciled exactly to these totals. Chargeable/volumetric weight is never gross.
            </SectHead>
            {/* row 1 · the four authority values · row 2 · the transport numbers */}
            <div className="fgrid">
              <div className="fbox s3"><label className="f">Confirm / override gross weight</label><input className="t" value={rv.confirmed_gross_weight} onChange={set("confirmed_gross_weight")}/></div>
              <div className="fbox s3"><label className="f">Weight unit (normalized to kg)</label>
                <select className="t" value={rv.reviewed_packing_weight_unit} onChange={set("reviewed_packing_weight_unit")}>
                  <option value="KGM">KGM — kilograms</option><option value="G">G — grams</option>
                  <option value="LB">LB — pounds</option><option value="OZ">OZ — ounces</option>
                  <option value="T">T — metric tonnes</option>
                </select></div>
              <div className="fbox s3"><label className="f">Confirm / override total packages</label><input className="t" value={rv.confirmed_total_packages} onChange={set("confirmed_total_packages")}/></div>
              <div className="fbox s3"><label className="f">Package type (all items)</label>
                <select className="t" value={rv.package_type} onChange={set("package_type")}>
                  <option value="CT">CT — Carton</option><option value="PX">PX — Pallet</option>
                  <option value="PK">PK — Package</option><option value="BX">BX — Box</option>
                  <option value="BG">BG — Bag</option><option value="DR">DR — Drum</option>
                  <option value="CR">CR — Crate</option>
                </select></div>
              <div className="fbox s4"><label className="f">Transport document (Field 9)</label>
                <select className="t" value={transportDocType(rv, review)} onChange={set("transport_doc_type")}>
                  <option value="AWB">Air waybill — Field 9 prints MAWB NO / HAWB</option>
                  <option value="BL">Bill of Lading — Field 9 prints B/L NO / B/L DATE</option>
                </select></div>
              <div className="fbox s4"><label className="f">HAWB number</label><input className="t" value={rv.hawb_no} onChange={set("hawb_no")}/></div>
              <div className="fbox s4"><label className="f">MAWB number</label><input className="t" value={rv.mawb_no} onChange={set("mawb_no")}/></div>
              <div className="fbox s4"><label className="f">Bill of Lading number (sea / land)</label><input className="t" placeholder="required if no AWB" value={rv.bill_of_lading_no} onChange={set("bill_of_lading_no")}/></div>
              <div className="fbox s4"><label className="f">B/L date</label><input className="t" placeholder="24-FEB-2026" value={rv.bill_of_lading_date} onChange={set("bill_of_lading_date")}/></div>
            </div>
            {review.weight_unit_missing && <label className="cbox">
              <input type="checkbox" checked={rv.manual_shipment_authority_confirmed} onChange={set("manual_shipment_authority_confirmed")}/>
              I confirm the shipment authority and the weight unit above (source evidence had no recognizable unit) — required for XML.
            </label>}
            <div className="row" style={{marginTop:10}}>
              <button className="btn ghost" disabled={!!busy} onClick={applyShipmentTotals}>
                ⚖ Apply totals to items — make these the final authority</button>
              <span className="tag">current authority: {review.gross_weight_source}
                {review.gross_weight_source==="REVIEWER_OVERRIDE"?" ✓":""}</span>
            </div>
            {mutMsg && <div className={"msg "+(mutMsg.ok?"ok":"b")} style={{marginTop:8}}>{maskEngine(mutMsg.text)}</div>}
          </div>

          {/* manifest & transport identity */}
          <div className="sect" id="cr-manifest">
            <SectHead title="Manifest & transport references" section="critical" onGuide={setGuide}>
              Manifest is assigned by customs (warning if blank). The Box 25/26 transport modes have NO default — choose both, or finalize blocks. Field 40 is stamped on every item — {review.field_40_reason||"enter it manually"}
            </SectHead>
            {/* row 1 · the three references · row 2 · both modes + delivery ·
                row 3 · Field 40, which carries its own choices and confirmation */}
            <div className="fgrid">
              <div className="fbox s4"><label className="f">Manifest number → Manifest_reference_number</label><input className="t" placeholder="e.g. 2026/1436" value={rv.manifest_no} onChange={set("manifest_no")}/></div>
              <div className="fbox s4"><label className="f">Field 18 — transport identity (arrival)</label><input className="t" placeholder="vehicle / flight no." value={rv.field_18_transport_identity} onChange={set("field_18_transport_identity")}/></div>
              <div className="fbox s4"><label className="f">Field 21 — border transport identity</label><input className="t" placeholder="vehicle / flight no." value={rv.field_21_transport_identity} onChange={set("field_21_transport_identity")}/></div>
              <div className="fbox s3"><label className="f">Mode at border (Box 25) <span className={"pill "+(rv.border_mode?"ok":"no")}>{rv.border_mode?"selected":"required"}</span></label>
                <ModePick modeRef={modeRef} value={rv.border_mode} id="Box 25"
                          onChange={v=>setRv(s=>({...s, border_mode:v}))}/>
                {!rv.border_mode && transportDocType(rv, review)==="BL" &&
                  <button type="button" className="btn ghost" style={{fontSize:11,padding:"2px 9px",marginTop:5}}
                          title="suggestion only — a bill-of-lading shipment crosses the border by road (Nepal is landlocked)"
                          onClick={()=>setRv(v=>({...v, border_mode:"02"}))}>B/L shipment → use 02 — By Truck ★</button>}
                {!rv.border_mode && transportDocType(rv, review)!=="BL" && (rv.hawb_no||rv.mawb_no) &&
                  <button type="button" className="btn ghost" style={{fontSize:11,padding:"2px 9px",marginTop:5}}
                          title="suggestion only — an AWB number is present on this shipment"
                          onClick={()=>setRv(v=>({...v, border_mode:"01"}))}>AWB present → use 01 — By Air ★</button>}
              </div>
              <div className="fbox s3"><label className="f">Inland mode (Box 26) <span className={"pill "+(rv.inland_mode_of_transport?"ok":"no")}>{rv.inland_mode_of_transport?"selected":"required"}</span></label>
                <ModePick modeRef={modeRef} value={rv.inland_mode_of_transport} id="Box 26"
                          onChange={v=>setRv(s=>({...s, inland_mode_of_transport:v}))}/>
              </div>
              <div className="fbox s3"><label className="f">Incoterm (delivery terms) —{(incotermRef.find(t=>t.code===(rv.incoterm||"").trim())||{}).description || (rv.incoterm?"as printed on the invoice":"blank → C&F legacy fallback")}</label>
                {incotermRef.length ? (
                  <select className="t" value={rv.incoterm} onChange={set("incoterm")}>
                    <option value="">— none (XML falls back to C&F) —</option>
                    {rv.incoterm && !incotermRef.some(t=>t.code===rv.incoterm) &&
                      <option value={rv.incoterm}>{rv.incoterm} — (extracted value, not in Incoterms 2020)</option>}
                    {incotermRef.map(t=><option key={t.code} value={t.code}>{t.code} — {t.description}</option>)}
                  </select>
                ) : (
                  <input className="t" value={rv.incoterm} onChange={set("incoterm")}/>
                )}
              </div>
              <div className="fbox s3"><label className="f">Delivery place</label><input className="t" value={rv.delivery_place} onChange={set("delivery_place")}/></div>
              {/* Field 40 last and on its own row: it is not a one-line field but a
                  value plus its candidate list, a confirmation tick and the reason
                  the engine reached it — squeezed into a third of a row, all three
                  wrapped into an unreadable stack. */}
              <div className="fbox s8"><label className="f">Field 40 — previous document (Summary_declaration) <span className={"pill "+(rv.field_40_confirmed?"ok":"no")}>{rv.field_40_confirmed?"confirmed":"choose & confirm"}</span></label>
                <input className="t" value={rv.field_40_previous_document} onChange={set("field_40_previous_document")}/>
                <CandidatePick value={rv.field_40_previous_document}
                  items={(review.field_40_candidates||[]).map(c=>({
                    source:c.source, label:c.value, value:c.value, suggested:c.suggested,
                    title:c.suggested?`system suggestion — ${review.field_40_reason}`
                                     :`use the ${c.source} number`}))}
                  onPick={c=>setRv(v=>({...v, field_40_previous_document:c.value,
                                        field_40_confirmed:true}))}/>
                <label style={{display:"flex",gap:7,alignItems:"center",marginTop:6,fontSize:12}}>
                  <input type="checkbox" checked={rv.field_40_confirmed} onChange={set("field_40_confirmed")}/>
                  I confirm this Field 40 value — my choice is final (stamped on every item)
                </label>
              </div>
            </div>
          </div>

          {/* invoice roster & field 9 */}
          <div className="sect" id="cr-invoice">
            <SectHead title="Authoritative invoices & Field 9" section="critical" onGuide={setGuide}>
              The roster locks item count, order and invoice totals. Field 9 auto-composes from the reviewed values (MAWB/HAWB, invoice, LC references); edit the box below to override it verbatim — your text wins for the XML.
            </SectHead>
            {review.invoice_roster.length>0 && <table>
              <thead><tr><th>Invoice no.</th><th>Date</th><th>Currency</th><th>Items</th><th>Source</th></tr></thead>
              <tbody>{review.invoice_roster.map((r,i)=>(
                <tr key={i}><td>{r.number}</td><td>{r.date}</td><td>{r.currency}</td><td>{r.item_count}</td>
                    <td className="muted">{r.source_file}{r.pages.length?` · p.${r.pages.join(",")}`:""}</td></tr>
              ))}</tbody>
            </table>}
            <div className="fbox" style={{marginTop:10}}>
            <label className="f">Field 9 — Traders/Financial/Financial_name <span className={"pill "+(rv.field_9_override?"no":"ok")}>{rv.field_9_override?"manually edited":"auto-composed"}</span></label>
            <textarea className="t mono" style={{minHeight:66}}
                      value={rv.field_9_override ? rv.field_9_text : composeField9(rv, review)}
                      onChange={e=>setRv(v=>({...v, field_9_text:e.target.value, field_9_override:true}))}/>
            {rv.field_9_override && <div className="row" style={{marginTop:4}}>
              <button type="button" className="btn ghost" style={{fontSize:11,padding:"2px 9px"}}
                      onClick={()=>setRv(v=>({...v, field_9_override:false, field_9_text:""}))}>
                ↺ Reset to auto-composed</button>
              <span className="tag">your edited text is used verbatim in the XML</span>
            </div>}
            </div>
          </div>

          {/* parties */}
          <div className="sect" id="cr-parties">
            <SectHead title="Exporter & importer" section="critical" onGuide={setGuide}>
              Name + address are combined into the XML party name. Importer EXIM must be 13–15 alphanumeric (hard blocker). Exporter country is the controlled COO fallback.
            </SectHead>
            {/* Two parties, two blocks.  Side by side these two columns read as
                one eight-field wall in which "Exporter address" and "Importer
                address" sit at the same height and are told apart only by the
                word each label starts with — which is exactly how a consignee
                ends up in a consignor box.  Each party is now its own panel,
                with name and address on one row and the two codes beside them
                at the width a code actually needs. */}
            <div className="party">
              <h4>Exporter — consignor</h4>
              <div className="fgrid">
                <div className="fbox s4"><label className="f">Exporter name</label>
                  <textarea className="t" value={rv.exporter_name} onChange={set("exporter_name")}/></div>
                <div className="fbox s4"><label className="f">Exporter address</label>
                  <textarea className="t" value={rv.exporter_address} onChange={set("exporter_address")}/></div>
                <div className="fbox s2"><label className="f">EXIM / code</label>
                  <input className="t" value={rv.exporter_exim_code} onChange={set("exporter_exim_code")}/></div>
                <div className="fbox s2"><label className="f">Country (alpha-2) <span className={"pill "+(review.exporter.country_resolution_state==="RESOLVED"?"ok":"no")}>{review.exporter.country_resolution_state}</span></label>
                  <input className="t" value={rv.exporter_country_code} onChange={set("exporter_country_code")}/></div>
              </div>
            </div>
            <div className="party imp">
              <h4>Importer — consignee</h4>
              <div className="fgrid">
                <div className="fbox s4"><label className="f">Importer / consignee name</label>
                  <textarea className="t" value={rv.importer_name} onChange={set("importer_name")}/></div>
                <div className="fbox s4"><label className="f">Importer address</label>
                  <textarea className="t" value={rv.importer_address} onChange={set("importer_address")}/></div>
                <div className="fbox s2"><label className="f">EXIM (13–15 alnum) <span className={"pill "+(review.importer_exim_valid?"ok":"no")}>{review.importer_exim_valid?"valid":"invalid"}</span></label>
                  <input className="t" value={rv.importer_exim_code} onChange={set("importer_exim_code")}/></div>
                <div className="fbox s2"><label className="f">Country (alpha-2) <span className={"pill "+(review.importer.country_resolution_state==="RESOLVED"?"ok":"no")}>{review.importer.country_resolution_state}</span></label>
                  <input className="t" value={rv.importer_country_code} onChange={set("importer_country_code")}/></div>
              </div>
            </div>
          </div>

          {/* bank & payment */}
          <div className="sect" id="cr-bank">
            <SectHead title="Bank, payment terms & banking reference" section="critical" onGuide={setGuide}>
              Bank code/name must form an exact pair in the bank reference ({review.bank_resolution_state}). Payment code follows the terms-of-payment table (LC 200 · TT 400 · DAP 600 · CAD 700 · DA 906 · FOC 999). The reference/amount/date feed Field 9 and the first item's texts.
            </SectHead>
            {/* row 1 · the bank · row 2 · the terms · row 3 · the transaction */}
            <div className="fgrid">
              {/* the pair-resolution verdict was readable only in the prose above;
                  it belongs on the field it judges — the same pill the country and
                  EXIM fields already use. */}
              <div className="fbox s4"><label className="f">Bank code — search by code, name or SWIFT <span className={"pill "+(review.bank_resolution_state==="RESOLVED"?"ok":"no")}>{review.bank_resolution_state}</span></label>
                {bankRef.length ? (
                  <BankSelect banks={bankRef} code={rv.bank_code} disabled={false}
                    onPick={b=>setRv(v=>({...v, bank_code:b.code, bank_name:b.name,
                                          swift_code:b.swift||""}))}
                    onRawCode={raw=>setRv(v=>({...v, bank_code:raw}))}/>
                ) : (
                  <input className="t" value={rv.bank_code} onChange={set("bank_code")}/>
                )}
              </div>
              <div className="fbox s5"><label className="f">Bank name</label><input className="t" value={rv.bank_name} onChange={set("bank_name")}/></div>
              <div className="fbox s3"><label className="f">SWIFT (identification only)</label><input className="t" value={rv.swift_code} onChange={set("swift_code")}/></div>
              <div className="fbox s4"><label className="f">Payment-term code —{(payTermRef.find(t=>t.code===(rv.payment_term_code||"").trim())||{}).description || review.payment_term_description || "?"}</label>
                {payTermRef.length ? (
                  <select className="t" value={rv.payment_term_code}
                          onChange={set("payment_term_code")}>
                    <option value="">— select code —</option>
                    {rv.payment_term_code && !payTermRef.some(t=>t.code===rv.payment_term_code) &&
                      <option value={rv.payment_term_code}>{rv.payment_term_code} — (extracted value, not in reference)</option>}
                    {payTermRef.map(t=><option key={t.code} value={t.code}>{t.code} — {t.description}</option>)}
                  </select>
                ) : (
                  <input className="t" value={rv.payment_term_code} onChange={set("payment_term_code")}/>
                )}
              </div>
              <div className="fbox s3"><label className="f">Mode of payment</label><input className="t" value={rv.mode_of_payment} onChange={set("mode_of_payment")}/></div>
              <div className="fbox s5"><label className="f">Extracted terms wording</label><input className="t" value={review.payment_term_text} readOnly style={{background:"#f8fafc",color:"var(--muted)"}}/></div>
              <div className="fbox s4"><label className="f">Reference no. (LC / TT / …)</label><input className="t" value={rv.bank_reference} onChange={set("bank_reference")}/></div>
              <div className="fbox s3"><label className="f">Amount</label><input className="t" value={rv.bank_amount} onChange={set("bank_amount")}/></div>
              {/* currency and date shared one label and one cramped flex row; they
                  are two values and each is now its own box at its own width */}
              <div className="fbox s2"><label className="f">Currency</label>
                <input className="t" value={rv.bank_currency} onChange={set("bank_currency")}/></div>
              <div className="fbox s3"><label className="f">Date</label>
                <input className="t" value={rv.bank_date} onChange={set("bank_date")} placeholder="DD-MMM-YYYY"/></div>
            </div>
          </div>

          {/* freight & insurance */}
          <div className="sect" id="cr-freight">
            <SectHead title="Freight & insurance" section="critical" onGuide={setGuide}>
              The reviewed freight amount has highest authority (explicit 0.00 allowed); it is allocated across items exactly. Insurance is the actual premium, entered in the NATIONAL currency (it is added to the CIF as-is, never converted at the exchange rate the way freight is).
            </SectHead>
            {(review.freight_candidates||[]).length > 0 &&
              <div style={{margin:"6px 0 10px"}}>
                <label className="f">Document freight candidates — click to use one (default is the highest):</label>
                <CandidatePick value={rv.manual_freight_amount}
                  items={(review.freight_candidates||[]).map(c=>({
                    source:c.source, label:`${c.currency} ${c.amount}${c.comparable===false?" ⚠":""}`,
                    value:c.amount, disabled:c.comparable===false,
                    title:c.comparable===false
                      ? `Printed in ${c.currency}, not ${review.manual_freight_currency} — convert it and type the amount below. ${c.detail}`
                      : c.detail}))}
                  onPick={c=>setRv(v=>({...v, manual_freight_amount:c.value}))}/>
              </div>}
            {/* No exchange-rate box: ASYCUDA fills the NRB rate itself on upload.  The
                job still carries the configured rate (see `rate`) so valuation, the CIF
                and the XML are computed exactly as before — it is simply not editable
                or shown here. */}
            <div className="fgrid">
              <div className="fbox s4"><label className="f">Freight amount ({review.manual_freight_currency}) — source: {review.freight_source||"none"}</label>
                <input className="t" value={rv.manual_freight_amount} onChange={set("manual_freight_amount")}/></div>
              <div className="fbox s4"><label className="f">Insurance premium amount ({review.insurance_currency || "NPR"} — not converted)</label><input className="t" value={rv.manual_insurance_amount} onChange={set("manual_insurance_amount")}/></div>
            </div>
            <label className="cbox">
              <input type="checkbox" checked={rv.invoice_values_exclude_freight_insurance} onChange={set("invoice_values_exclude_freight_insurance")}/>
              Invoice item values exclude the freight & insurance entered above (prevents double counting — check under CIF/CIP).
            </label>
          </div>

          {/* evidence */}
          {review.evidence.length>0 && <details style={{marginTop:12}}>
            <summary>Extraction evidence — {review.evidence.length} value(s) with provenance</summary>
            <table>
              <thead><tr><th>Field</th><th>Value</th><th>Source</th><th>Page</th></tr></thead>
              <tbody>{review.evidence.map((ev,i)=>(
                <tr key={i}><td><code>{ev.field}</code></td><td>{ev.normalized_value}</td>
                    <td className="muted">{ev.source_role} · {ev.source_file}</td><td>{ev.page_number||""}</td></tr>
              ))}</tbody>
            </table>
          </details>}
        </div>}
      </div>

      {/* STEP 3 — Detailed Review (item rows + reviewer add/delete) */}
      {review && (review.item_details||[]).length>0 && <div className="card">
        <h2><span className="htxt"><span className="step">3</span> Detailed Review — item rows</span>
            <GuideButton onOpen={setGuide} section="detailed"/></h2>
        {qReturn && <button type="button" className="qback" data-ec-goto="queue"
                onClick={()=>setQReturn(false)}>← Back to the Decision queue</button>}
        <p className="hint">{review.item_details.length} goods rows · invoice order preserved</p>
        <div className="row" style={{margin:"2px 0 6px"}}>
          <button className="btn ghost" disabled={!!busy} onClick={()=>{setMutMsg(null);
            setAddDlg({sn:String(review.item_details.length+1), invoice:"", manual:false,
                       desc:"", qty:"", uom:"", price:"", coo:"", hs:"", err:""});}}>+ Add item</button>
          <span style={{display:"inline-flex",gap:6,alignItems:"center"}}>
            <input className="t" style={{width:150,padding:"6px 9px",fontSize:13}}
                   placeholder="COO for all items" value={cooAll}
                   onChange={e=>setCooAll(e.target.value)}
                   onKeyDown={e=>{ if(e.key==="Enter"&&!busy) applyAllCoo(); }}/>
            <button className="btn ghost" disabled={!!busy||!cooAll.trim()} onClick={applyAllCoo}>Apply COO to all</button>
          </span>
          <span style={{display:"inline-flex",gap:6,alignItems:"center"}} title="search an official HS code, then choose which SNs get it — printer-style range like 1-15, 19, 80 (or all)">
            <HsSearch itemId="bulk-range" disabled={!!busy}
                      isOpen={hsOpen==="bulk-range"}
                      onOpen={()=>setHsOpen("bulk-range")}
                      onClose={()=>setHsOpen(v=>v==="bulk-range"?null:v)}
                      onPick={code=>{ setHsOpen(null); setMutMsg(null);
                                      setHsRangeDlg({code, range:"", err:""}); }}/>
            <span className="tag">HS → item range</span>
          </span>
          <span className="tag">{review.item_details.length} rows · revision {review.item_mutation_revision||0}</span>
        </div>
        {mutMsg && <div className={"msg "+(mutMsg.ok?"ok":"b")}>{maskEngine(mutMsg.text)}</div>}
        <PinConflictBanner review={review} busy={busy} onApply={applyShipmentTotals}/>
        {/* Row queues.  Each chip is a work list the reviewer can empty; the
            count is the honest size of the job still ahead of them. */}
        <div className="ifilter" id="item-queues">
          <input className="isearch" type="search" value={itemQ}
                 aria-label="search item rows"
                 placeholder="Search rows — description, HS, COO, SN…"
                 onChange={e=>setItemQ(e.target.value)}/>
          <div className="ichips" role="group" aria-label="row filters">
            {ITEM_FILTERS.map(f=>{
              const n = itemCounts[f.id], off = f.id!=="all" && !n;
              return (
                <button key={f.id} type="button"
                        className={"ichip"+(f.tone?" "+f.tone:"")+(activeItemFilter.id===f.id?" on":"")}
                        disabled={off} aria-pressed={activeItemFilter.id===f.id}
                        title={off ? `no rows are ${f.label.toLowerCase()} — nothing to work here`
                                   : `show the ${n} row(s): ${f.label.toLowerCase()}`}
                        onClick={()=>setItemFilter(f.id)}>{f.label}<b>{n}</b></button>);
            })}
          </div>
          <span className="icount">{rowsHidden
            ? <b>{visibleRows.length} of {itemRows.length} rows</b>
            : <span>{itemRows.length} rows</span>}</span>
          {(itemQn || activeItemFilter.id!=="all") &&
            <button type="button" className="ichip clr"
                    title="show every row again"
                    onClick={()=>{setItemQ(""); setItemFilter("all");}}>✕ clear</button>}
        </div>
        <table className="dtable">
          <colgroup>{/* percentages: the table compresses to ANY window width — no side sliding; Description gets the most room */}
            <col style={{width:"3%"}}/><col style={{width:"16%"}}/><col style={{width:"4%"}}/>
            <col style={{width:"10%"}}/><col style={{width:"10%"}}/><col style={{width:"7%"}}/>
            <col style={{width:"5%"}}/><col style={{width:"4%"}}/><col style={{width:"7%"}}/>
            <col style={{width:"6%"}}/><col style={{width:"6%"}}/><col style={{width:"4%"}}/>
            <col style={{width:"4%"}}/><col style={{width:"4%"}}/><col style={{width:"10%"}}/>
          </colgroup>
          <thead><tr>
            <th>SN</th><th>Description</th><th>COO</th>
            <th>Invoice HS</th><th>Final HS</th><th>HS Search</th>
            <th className="num">QTY</th><th>UOM</th><th className="num">Total Price</th>
            <th className="num">Gross</th><th className="num">Net</th><th className="num">CTN</th>
            <th>Sup_U</th><th className="num">Sup_qty</th><th title="view source page · edit · delete">Doc·Edit·Del</th>
          </tr></thead>
          <tbody>{visibleRows.length===0 && <tr><td colSpan={15} style={{padding:"18px 8px",textAlign:"center"}}>
            <span className="muted">No row matches this search.</span>{" "}
            <button type="button" className="ichip clr"
                    onClick={()=>{setItemQ(""); setItemFilter("all");}}>show all {itemRows.length} rows</button>
          </td></tr>}
          {visibleRows.map(row=>(
            <tr key={row.item_id||row.sn} data-item-id={row.item_id}
                className={[row.final_hs?"":"nohs", row.origin==="manual"?"man":"",
                            row.item_id===newItemId?"newrow":""].filter(Boolean).join(" ")}>
              <td>{row.sn}{(()=>{ const n = itemNotes.get(String(row.sn));
                    return n ? <span className="rowwarn"
                                     title={n.map(x=>`${x.code} — ${maskEngine(x.message)}`).join("\n\n")}
                                     >{n.some(x=>x.severity==="BLOCKING")?"🛑":"⚠"}</span> : null; })()}</td>
              <td className="desc" title={row.description + (row.edited ? " · edited by reviewer" : "")}
                  style={row.edited ? {fontStyle:"italic"} : undefined}>{row.description}</td>
              <td title={row.coo}>{row.coo||"—"}</td>
              <td className="hs" title={row.invoice_hs}>{row.invoice_hs||"—"}</td>
              <td className="hs" title={row.final_hs
                    ? `${row.final_hs}${row.hs_source?` · source ${row.hs_source}`:""}${row.hs_confidence?` · confidence ${row.hs_confidence}`:""}`
                    : "no official HS yet — use HS search"}>
                {row.final_hs||"—"}
                {row.hs_low_confidence && <span className="lowchip"
                     title={`AUTO LOW CONFIDENCE — source ${row.hs_source} · confidence ${row.hs_confidence}. Confirm the exact HS or pick another via search.`}>LOW</span>}
                {row.hs_low_confidence && <button type="button" className="sbtn" disabled={!!busy}
                     style={{marginLeft:3}}
                     title={`Confirm exact HS ${row.final_hs} (source ${row.hs_source}, confidence ${row.hs_confidence})`}
                     onClick={()=>pickHs(row.item_id, row.final_hs, "detailed_review")}>✓</button>}
              </td>
              <td style={{overflow:"visible"}}>
                <HsSearch itemId={row.item_id} disabled={!!busy}
                          isOpen={hsOpen===row.item_id}
                          onOpen={()=>setHsOpen(row.item_id)}
                          onClose={()=>setHsOpen(v=>v===row.item_id?null:v)}
                          onPick={code=>pickHs(row.item_id, code, "detailed_review_hs_search")}/>
              </td>
              <td className="num" title={row.quantity}>{row.quantity}</td>
              <td title={row.uom||"the invoice printed no readable unit for this row — enter it as printed"}>
                {row.uom||"—"}</td>
              <td className="num" title={row.total_price}>{row.total_price}</td>
              <td className="num" title={row.gross_pinned?`${row.gross} kg — reviewer-entered (pinned)`:row.gross}>{row.gross||"—"}{row.gross_pinned?"📌":""}</td>
              <td className="num" title={row.net_pinned?`${row.net} kg — reviewer-entered (pinned)`:row.net}>{row.net||"—"}{row.net_pinned?"📌":""}</td>
              <td className="num" title={row.ctn_pinned?`${row.ctn} CTN — reviewer-entered (pinned)`:row.ctn}>{row.ctn||"—"}{row.ctn_pinned?"📌":""}</td>
              <td title={row.sup_unit}>{row.sup_unit||"—"}</td>
              <td className="num" title={row.sup_qty_pinned?`${row.sup_qty} — reviewer-entered (overrides the derived quantity)`:row.sup_qty}>{row.sup_qty||"—"}{row.sup_qty_pinned?"📌":""}</td>
              <td className="act">{row.src_file
                    ? <button type="button" className="sbtn"
                              title={`view source: ${row.src_file}${row.src_page?` · page ${row.src_page}`:""} — opens the document beside the table`}
                              onClick={()=>openRowSource(row)}>📄</button>
                    : null}
                  {row.src_file ? " " : null}
                  <button type="button" className="sbtn" disabled={!!busy}
                          title="edit this item's description, COO, quantity, UOM, price and gross/net weight"
                          onClick={()=>{setMutMsg(null); setEditDlg({item_id:row.item_id, sn:row.sn,
                                        desc:row.description, coo:row.coo, qty:row.quantity,
                                        uom:row.uom, price:row.total_price,
                                        gross:row.gross, net:row.net, ctn:row.ctn, sup:row.sup_qty,
                                        g0:row.gross, n0:row.net, c0:row.ctn, s0:row.sup_qty, err:""});}}>✎</button>
                  {" "}
                  <button type="button" className="sbtn" disabled={!!busy||review.item_details.length<=1}
                          title={review.item_details.length<=1?"at least one declarable goods item must remain":"delete this row"}
                          onClick={()=>{setMutMsg(null); setDelDlg({item_id:row.item_id, sn:row.sn,
                                        description:row.description, typed:"", err:""});}}>🗑</button></td>
            </tr>
          ))}</tbody>
          {(()=>{  /* totals row: display-only sums of the server-computed rows */
            const rows = review.item_details;
            const sum = k => rows.reduce((a,r)=>a+(Number(r[k])||0), 0);
            const t = (v,d)=>String(parseFloat((Math.round(v*10000)/10000).toFixed(d)));
            return (<tfoot><tr>
              <td></td>
              {/* always the whole declaration, never the filtered view — these
                  are the numbers customs reads */}
              <td title={rowsHidden ? `sums of all ${rows.length} item rows — a filter is hiding ${rowsHidden} of them`
                                    : `sums of the ${rows.length} item rows above`}>
                TOTAL ({rowsHidden ? "all "+rows.length : rows.length})</td>
              <td></td><td></td><td></td><td></td>
              <td className="num" title="total quantity">{t(sum("quantity"),4)}</td>
              <td></td>
              <td className="num" title="total value (amount)">{(Math.round(sum("total_price")*100)/100).toFixed(2)}</td>
              <td className="num" title="total gross weight">{t(sum("gross"),4)}</td>
              <td className="num" title="total net weight">{t(sum("net"),4)}</td>
              <td className="num" title="total cartons">{t(sum("ctn"),2)}</td>
              <td></td><td></td><td></td>
            </tr></tfoot>);
          })()}
        </table>

        {/* Brand · Model · Size — hidden bar (click to open): a spreadsheet-style
            editable grid. Available before AND after the XML; the download
            appears once the .xls has been built at finalize. */}
        <details style={{marginTop:14}}>
          <summary style={{cursor:"pointer",fontWeight:600,padding:"8px 10px",
                           background:"#f1f5f9",borderRadius:6,userSelect:"none"}}>
            📄 Brand · Model · Size — per item ({review.item_details.length}) · click to view, edit or download .xls
          </summary>
          <BmsGrid rows={review.item_details} jobId={job.job_id} busy={busy} onGuide={setGuide}
                   hasXls={!!(decl && (decl.ready_for_xml||decl.xml_built_with_blockers))}
                   onSaved={r=>{ if(r && r.critical_review) setReview(r.critical_review); }}/>
        </details>

        {/* FINALIZE & XML — the review's closing act, folded into this card
            below the Brand · Model · Size bar rather than a step of its own.
            Pre-flight first: everything in it is knowable before the round
            trip, so the reviewer should not have to spend a finalize to find
            it out.  It never gates the button — the server stays the
            authority on what actually blocks the XML. */}
        <h3 style={{margin:"20px 0 10px",paddingTop:16,borderTop:"1px solid var(--line)",
                    display:"flex",alignItems:"center",gap:8,fontSize:14.5,fontWeight:700}}>
          📦 Finalize & generate ASYCUDA XML
          <GuideButton onOpen={setGuide} section="finalize"/></h3>
        {rv && <div className="pflight">
          <div className={"pfrow "+(itemCounts.nohs?"no":"ok")}>
            <s>{itemCounts.nohs?"✖":"✔"}</s>
            <span>{itemCounts.nohs
              ? `${itemCounts.nohs} of ${itemRows.length} rows have no official HS code`
              : `Every one of the ${itemRows.length} rows carries an official HS code`}</span>
            {!!itemCounts.nohs && <button type="button" className="ichip"
                    onClick={()=>{setItemFilter("nohs"); jumpToSection("item-queues");}}>show the rows ↑</button>}
          </div>
          {!!itemCounts.low && <div className="pfrow w">
            <s>⚠</s><span>{itemCounts.low} row(s) carry an auto HS marked <b>LOW</b> — confirm or replace it</span>
            <button type="button" className="ichip"
                    onClick={()=>{setItemFilter("low"); jumpToSection("item-queues");}}>review the rows ↑</button>
          </div>}
          {!!itemCounts.flagged && <div className="pfrow w">
            <s>⚠</s><span>{itemCounts.flagged} row(s) carry a review note from the engine</span>
            <button type="button" className="ichip"
                    onClick={()=>{setItemFilter("flagged"); jumpToSection("item-queues");}}>review the rows ↑</button>
          </div>}
        </div>}
        <button className="btn big" onClick={finalize} disabled={!review||!rv||!!busy||anyUploading||anyExtracting}>{busy==="finalize"?<span style={{display:"inline-flex",alignItems:"center",gap:9}}><Spin size="lg" tone="on"/> Finalizing…</span>:(dqBlocking?`Finalize & Build XML · ${dqBlocking} blocking`:"Finalize & Build XML")}</button>
        {decl && <div style={{marginTop:16}}>
          {decl.ready_for_xml
            ? <div className="msg ok">✔ Declaration valid — {decl.total_number_of_items} items, {decl.total_number_of_packages} packages, {decl.valuation.total_weight} kg. XML ready.</div>
            : decl.xml_built_with_blockers
              ? <div className="msg w">⚠ XML generated with {decl.blocking_errors.length} unresolved blocking case(s).
                  {" "}<button className="btn ghost" style={{fontSize:11,padding:"2px 8px"}} onClick={()=>setXmlWarn(decl.blocking_errors)}>show cases</button></div>
              : <div className="msg b">✖ {decl.blocking_errors.length} blocking error(s) — resolve before XML.</div>}
          {!decl.ready_for_xml && decl.items.some(it=>!it.hs_code_11) && <div style={{marginTop:10}}>
            <div className="msg w">Enter the official HS code for each unresolved item, then click <b>Finalize &amp; Build XML</b> again.</div>
            <details open><summary>{decl.items.filter(it=>!it.hs_code_11).length} item(s) need an HS code</summary>
              <table>
                <thead><tr><th>#</th><th>Description</th><th>Invoice HS (raw)</th><th>Official HS (manual)</th></tr></thead>
                <tbody>{decl.items.filter(it=>!it.hs_code_11).map(it=>(
                  <tr key={it.xml_item_sequence}>
                    <td>{it.xml_item_sequence}</td>
                    <td>{it.commercial_description}</td>
                    <td className="muted">{it.hs_source||"—"}</td>
                    <td><input className="t" style={{maxWidth:170}} placeholder="e.g. 90219000"
                               value={hsFix[it.xml_item_sequence]||""}
                               onChange={e=>setHsFix(h=>({...h,[it.xml_item_sequence]:e.target.value}))}/></td>
                  </tr>
                ))}</tbody>
              </table>
            </details>
          </div>}
          <Messages items={decl.blocking_errors.slice(0,12)}/>
          {decl.blocking_errors.length>12 && <div className="tag">…and {decl.blocking_errors.length-12} more blocking messages.</div>}
          {(decl.ready_for_xml || decl.xml_built_with_blockers) && <div className="row" style={{margin:"10px 0"}}>
            <a className="btn" href={`${API}/api/jobs/${job.job_id}/xml`}>⬇ Download ASYCUDA XML{decl.xml_built_with_blockers?" (test — has warnings)":""}</a>
            <span className="pill">bank {decl.bank_code} · {decl.bank_name}</span>
            <span className="pill">terms {decl.terms_code} · {decl.terms_description}</span>
          </div>}
          <div className="kpi">
            <div className="k"><div className="lbl">Total invoice (FOB)</div><div className="val">{decl.valuation.total_invoice_foreign}</div><div className="src">{decl.valuation.currency_foreign}</div></div>
            <div className="k"><div className="lbl">External freight</div><div className="val">{decl.valuation.external_freight_foreign}</div><div className="src">{decl.valuation.currency_foreign}</div></div>
            <div className="k"><div className="lbl">Total CIF (NPR)</div><div className="val">{decl.valuation.total_cif}</div><div className="src">NPR</div></div>
            <div className="k"><div className="lbl">Gross weight</div><div className="val">{decl.valuation.total_weight}</div><div className="src">kg</div></div>
          </div>
          {decl.warnings && decl.warnings.length>0 &&
            <details style={{marginTop:6}}><summary>{decl.warnings.length} warning(s)</summary><Messages items={decl.warnings}/></details>}
          <details style={{marginTop:10}} open>
            <summary>First 12 items (order preserved from invoice)</summary>
            <table>
              <thead><tr><th>#</th><th>Description</th><th>HS (8+3)</th><th>COO</th><th>Supp.</th><th>Gross</th><th>Net</th><th>Stat. value</th></tr></thead>
              <tbody>{decl.items.slice(0,12).map(it=>(
                <tr key={it.xml_item_sequence}>
                  <td>{it.xml_item_sequence}</td>
                  <td>{it.commercial_description}</td>
                  <td><code>{it.commodity_code}</code>+{it.precision_1}</td>
                  <td>{it.coo_alpha2}</td>
                  <td>{it.supplementary_quantity} {it.supplementary_unit_code}</td>
                  <td>{it.gross_weight_kg}</td><td>{it.net_weight_kg}</td>
                  <td>{it.statistical_value}</td>
                </tr>
              ))}</tbody>
            </table>
          </details>
        </div>}

        {xmlWarn && <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setXmlWarn(null);}}>
          <div className="dlg">
            <h3>⚠ XML generated with unresolved cases</h3>
            <p className="sub">{xmlWarn.length} blocking case(s) remain unresolved — customs may reject these values.</p>
            <div style={{maxHeight:300,overflow:"auto"}}>
              <Messages items={xmlWarn.slice(0,20)}/>
              {xmlWarn.length>20 && <div className="tag">…and {xmlWarn.length-20} more case(s).</div>}
            </div>
            <div className="row" style={{justifyContent:"flex-end",marginTop:14}}>
              <a className="btn" href={`${API}/api/jobs/${job.job_id}/xml`} onClick={()=>setXmlWarn(null)}>⬇ Download test XML</a>
              <button className="btn ghost" onClick={()=>setXmlWarn(null)}>Close</button>
            </div>
          </div>
        </div>}

        {addDlg && <div className="overlay" onClick={e=>{if(e.target===e.currentTarget&&busy!=="item")setAddDlg(null);}}>
          <div className="dlg">
            <h3>Add item</h3>
            <p className="sub">The server assigns an immutable identity and recomputes allocation, supplementary units, totals and readiness — nothing is decided client-side. Bind the row to an authoritative invoice, or explicitly confirm a manual addition.</p>
            {addDlg.err && <div className="msg b">{maskEngine(addDlg.err)}</div>}
            <div className="grid3">
              <div><label className="f">Insertion SN (1–{review.item_details.length+1})</label>
                <input className="t" type="number" min="1" max={review.item_details.length+1} value={addDlg.sn}
                       onChange={e=>setAddDlg({...addDlg,sn:e.target.value,err:""})}/></div>
              <div><label className="f">Authoritative invoice</label>
                <select className="t" value={addDlg.invoice} onChange={e=>setAddDlg({...addDlg,invoice:e.target.value,err:""})}>
                  <option value="">— none —</option>
                  {review.invoice_roster.map((r,i)=><option key={i} value={r.number}>{r.number} · {r.date}</option>)}
                </select></div>
              <div style={{display:"flex",alignItems:"flex-end",paddingBottom:8}}>
                <label style={{display:"flex",gap:7,alignItems:"center",fontSize:12.5}}>
                  <input type="checkbox" checked={addDlg.manual}
                         onChange={e=>setAddDlg({...addDlg,manual:e.target.checked,err:""})}/>
                  Reviewed manual addition without source invoice
                </label></div>
            </div>
            <div className="grid3">
              <div><label className="f">Description</label><input className="t" value={addDlg.desc} onChange={e=>setAddDlg({...addDlg,desc:e.target.value})}/></div>
              <div><label className="f">Quantity</label><input className="t" value={addDlg.qty} onChange={e=>setAddDlg({...addDlg,qty:e.target.value})}/></div>
              <div><label className="f">UOM</label><input className="t" value={addDlg.uom} onChange={e=>setAddDlg({...addDlg,uom:e.target.value})}/></div>
              <div><label className="f">Total price</label><input className="t" value={addDlg.price} onChange={e=>setAddDlg({...addDlg,price:e.target.value})}/></div>
              <div><label className="f">Country of origin</label><input className="t" value={addDlg.coo} onChange={e=>setAddDlg({...addDlg,coo:e.target.value})}/></div>
              <div><label className="f">Final HS (official DB gated)</label><input className="t" value={addDlg.hs} onChange={e=>setAddDlg({...addDlg,hs:e.target.value})}/></div>
            </div>
            <div className="row" style={{justifyContent:"flex-end",marginTop:14}}>
              <button className="btn ghost" disabled={busy==="item"} onClick={()=>setAddDlg(null)}>Cancel</button>
              <button className="btn" disabled={busy==="item"} onClick={submitAdd}>{busy==="item"?"Adding…":"Add item"}</button>
            </div>
          </div>
        </div>}

        {delDlg && <div className="overlay" onClick={e=>{if(e.target===e.currentTarget&&busy!=="item")setDelDlg(null);}}>
          <div className="dlg">
            <h3>Delete item — SN {delDlg.sn}</h3>
            <p className="sub">“{delDlg.description||"(no description)"}” — source evidence is never deleted; the row is tombstoned, totals and allocation recompute, and any generated XML is invalidated.</p>
            {delDlg.err && <div className="msg b">{maskEngine(delDlg.err)}</div>}
            <label className="f">Type the exact current SN ({delDlg.sn}) to confirm</label>
            <input className="t" value={delDlg.typed} onChange={e=>setDelDlg({...delDlg,typed:e.target.value,err:""})}/>
            <div className="row" style={{justifyContent:"flex-end",marginTop:14}}>
              <button className="btn ghost" disabled={busy==="item"} onClick={()=>setDelDlg(null)}>Cancel</button>
              <button className="btn" style={{background:"var(--brand)"}}
                      disabled={busy==="item"||delDlg.typed.trim()!==String(delDlg.sn)}
                      onClick={confirmDelete}>{busy==="item"?"Deleting…":"Delete item"}</button>
            </div>
          </div>
        </div>}

        {hsRangeDlg && <div className="overlay" onClick={e=>{if(e.target===e.currentTarget&&busy!=="item")setHsRangeDlg(null);}}>
          <div className="dlg">
            <h3>Apply HS <code>{hsRangeDlg.code}</code> to an item range</h3>
            <p className="sub">Printer-style range over the SN column: <b>1-15, 19, 80</b> applies the code to items 1 to 15, 19 and 80; <b>all</b> selects every row. Each targeted row gets this official HS exactly as if picked in its own <b>HS Search</b> — a later per-row pick still overrides a single row. The server re-derives unit, supplementary and readiness from the database and invalidates any generated XML.</p>
            {hsRangeDlg.err && <div className="msg b">{maskEngine(hsRangeDlg.err)}</div>}
            <label className="f">Item range (SN 1–{review.item_details.length})</label>
            <input className="t" autoFocus placeholder="e.g. 1-15, 19, 80 — or all" value={hsRangeDlg.range}
                   onChange={e=>setHsRangeDlg({...hsRangeDlg,range:e.target.value,err:""})}
                   onKeyDown={e=>{ if(e.key==="Enter"&&busy!=="item") applyHsRange(); }}/>
            <div className="row" style={{justifyContent:"flex-end",marginTop:14}}>
              <button className="btn ghost" disabled={busy==="item"} onClick={()=>setHsRangeDlg(null)}>Cancel</button>
              <button className="btn" disabled={busy==="item"||!hsRangeDlg.range.trim()}
                      onClick={applyHsRange}>{busy==="item"?"Applying…":"Apply to range"}</button>
            </div>
          </div>
        </div>}

        {editDlg && <div className="overlay" onClick={e=>{if(e.target===e.currentTarget&&busy!=="item")setEditDlg(null);}}>
          <div className="dlg">
            <h3>Edit item — SN {editDlg.sn}</h3>
            {/* One line stays visible: pinning is destructive-feeling and happens
                the moment you type, so it cannot sit behind a click. The rest of
                the explanation moves into the ⓘ. No guide link — opening the
                guide overlay on top of this dialog would stack two modals. */}
            <p className="sub" style={{marginBottom:2}}>Leave <b>gross / net / cartons</b> as computed, or type your own to <b>pin</b> this item — the other items are adjusted to hold the authorised shipment totals. A typed <b>supplementary quantity</b> just replaces the derived one for this row; nothing else moves. <b>Clear a box to un-pin it.</b></p>
            <NoteLine label="editing an item" style={{marginBottom:10}}>
              The server re-derives COO resolution, allocation, supplementary units, totals and readiness from your values, and invalidates any generated XML. The official HS is changed via the row's <b>HS Search</b>; the supplementary <i>unit code</i> follows that HS's tariff unit, and the supplementary <i>quantity</i> is derived from it unless you type your own — then your number is what the XML carries, with nothing else recalculated around it. Your entered values are always kept exactly — pinned or not, the shipment totals still reconcile exactly. Cartons are carried at two decimals: every item is at least 0.01 CTN and a whole multiple of 0.01. When you pin cartons, the difference is taken from the <b>estimated</b> rows first (up to ten of them, so the rest of the table does not move); rows whose cartons the packing list actually prints are only rescaled — proportionally, keeping their ratios — if the estimates cannot cover it, and you are told when that happens.
            </NoteLine>
            {editDlg.err && <div className="msg b">{maskEngine(editDlg.err)}</div>}
            <label className="f">Description</label>
            <textarea className="t" value={editDlg.desc} onChange={e=>setEditDlg({...editDlg,desc:e.target.value,err:""})}/>
            <div className="grid3">
              <div><label className="f">Quantity</label><input className="t" value={editDlg.qty} onChange={e=>setEditDlg({...editDlg,qty:e.target.value,err:""})}/></div>
              <div><label className="f">UOM</label><input className="t" value={editDlg.uom} onChange={e=>setEditDlg({...editDlg,uom:e.target.value,err:""})}/></div>
              <div><label className="f">Total price</label><input className="t" value={editDlg.price} onChange={e=>setEditDlg({...editDlg,price:e.target.value,err:""})}/></div>
              <div><label className="f">Country of origin</label><input className="t" value={editDlg.coo} onChange={e=>setEditDlg({...editDlg,coo:e.target.value,err:""})}/></div>
              <div><label className="f">Gross weight (kg)</label><input className="t" value={editDlg.gross} placeholder="computed" onChange={e=>setEditDlg({...editDlg,gross:e.target.value,err:""})}/></div>
              <div><label className="f">Net weight (kg)</label><input className="t" value={editDlg.net} placeholder="computed" onChange={e=>setEditDlg({...editDlg,net:e.target.value,err:""})}/></div>
              <div><label className="f">Cartons (CTN)</label><input className="t" value={editDlg.ctn} placeholder="computed"
                     title="at least 0.01 and a whole multiple of 0.01 — clear the box to un-pin"
                     onChange={e=>setEditDlg({...editDlg,ctn:e.target.value,err:""})}/></div>
              <div><label className="f">Supplementary qty</label><input className="t" value={editDlg.sup} placeholder="computed"
                     title="overrides the derived supplementary quantity for this item — the value you type is what the XML carries. Clear the box to go back to the computed one."
                     onChange={e=>setEditDlg({...editDlg,sup:e.target.value,err:""})}/></div>
            </div>
            <div className="row" style={{justifyContent:"flex-end",marginTop:14}}>
              <button className="btn ghost" disabled={busy==="item"} onClick={()=>setEditDlg(null)}>Cancel</button>
              <button className="btn" disabled={busy==="item"} onClick={submitEdit}>{busy==="item"?"Saving…":"Save changes"}</button>
            </div>
          </div>
        </div>}
      </div>}

      {/* DECISION QUEUE — deliberately AFTER finalize: the steps are worked in
          order and the queue is the closing sweep of whatever is still open.
          Only once there is a review to gather cases from. */}
      {(dqCases.length>0 || (review && rv)) && <DecisionQueue
        cases={dqCases} blocking={dqBlocking}
        tab={qTab} onTab={t=>{setQTab(t); setQFocus(null);}}
        focus={qFocus} onFocus={setQFocus}
        onAnswer={answerCase} busy={busy} onLeave={()=>setQReturn(true)}
        resolved={dqResolved} onGuide={setGuide}
        onOpenValue={r=>openDoc(r.docId, r.page, r.k)}
        onEvidence={c=>c.ev && openDoc(c.ev.docId, c.ev.page, c.ev.label)}/>}

      {/* Audit */}
      {audit.length>0 && <div className="card">
        <h2><span className="htxt">🧭 Audit trail</span>
            <GuideButton onOpen={setGuide} section="audit"/></h2>
        {/* Collapsed, not removed: this is the record a post-clearance audit
            asks for months later, and the first thing to read when a job went
            wrong.  It costs one click and no screen space. */}
        <details className="qnotes">
          <summary>{Math.min(audit.length,12)} most recent event(s) — click to open</summary>
          <table><thead><tr><th>Event</th><th>Detail</th><th>Time</th></tr></thead>
            <tbody>{audit.slice(-12).map((e,i)=>(
              <tr key={i}><td><code>{e.code}</code></td><td>{maskEngine(e.detail)}</td><td className="muted">{new Date(e.at).toLocaleTimeString()}</td></tr>
            ))}</tbody></table>
        </details>
      </div>}
      </React.Fragment>}

      <p className="muted" style={{textAlign:"center",fontSize:12}}>
        Deterministic customs authority · {ENGINE} never finalizes HS / COO / totals / bank / XML · rule conflicts governed by ADRs (see README)
      </p>
    </main>
  </div>);
}

// ---------------------------------------------------------------------- //
// Sign in.  On a single-operator install the account is configured in
// backend/.env; on a multi-account deployment it lives with the identity
// provider.  Either way the server answers with a 24h token (returned in the
// body AND set as an HttpOnly cookie, because the evidence iframe and the
// XML/.xls download links are plain navigations that cannot carry a header).
//
// REGISTRATION IS ASKED FOR, NEVER ASSUMED.  GET /api/auth/signup says whether
// this deployment is open; the panel below is drawn only when it says yes, so a
// broker's own machine never shows a "create an account" link for something it
// cannot do.  Signing up does NOT sign you in — the server answers 202 and the
// confirmation email is what completes it.
