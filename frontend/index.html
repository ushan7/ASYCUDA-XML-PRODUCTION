// ---------------------------------------------------------------------- //
function SignupPanel({onDone}){
  const [email,setEmail] = useState("");
  const [password,setPassword] = useState("");
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState("");
  const [sent,setSent] = useState("");

  async function submit(e){
    e.preventDefault();
    if(busy) return;
    setBusy(true); setErr("");
    try{
      const r = await fetch(`${API}/api/auth/signup`, {
        method:"POST", headers:{"content-type":"application/json"},
        body:JSON.stringify({email, password})});
      const body = await r.json().catch(()=>({}));
      if(!r.ok){
        // 400 the address or the password · 429 limited · 501/403 closed ·
        // 502/503 ours. Each already carries the sentence to show.
        setErr(body.detail || `Could not create the account (${r.status}).`);
        return;
      }
      // One message for every accepted registration, including an address that
      // already has an account: this screen must not become a way to test
      // whether somebody is a customer here.
      setSent(body.detail || "Check your email to confirm the address, then sign in.");
      setPassword("");
    }catch(e){
      setErr("Could not reach the server. Check that it is running, then try again.");
    }finally{ setBusy(false); }
  }

  if(sent) return (
    <div className="msg ok" style={{marginTop:8}}>
      {sent} <a href="#" onClick={e=>{e.preventDefault(); onDone();}}>Back to sign in</a>
    </div>);

  return (
    <form onSubmit={submit} style={{marginTop:4}}>
      {err && <div className="msg b" style={{marginBottom:4}}>{maskEngine(err)}</div>}
      <label htmlFor="ec-new-email">Email</label>
      <input id="ec-new-email" name="email" type="email" autoComplete="email" autoFocus
             value={email} onChange={e=>{setEmail(e.target.value); setErr("");}}/>
      <label htmlFor="ec-new-pass">Password</label>
      <input id="ec-new-pass" name="new-password" type="password" autoComplete="new-password"
             value={password} onChange={e=>{setPassword(e.target.value); setErr("");}}/>
      <button className="btn" type="submit" disabled={busy||!email||!password}>
        {busy ? <span style={{display:"inline-flex",alignItems:"center",gap:9}}><Spin tone="on"/> Creating…</span> : "Create account"}
      </button>
      <p className="foot">
        We email you a link to confirm the address. You sign in after confirming.{" "}
        <a href="#" onClick={e=>{e.preventDefault(); onDone();}}>I already have an account</a>
      </p>
    </form>);
}

// ---------------------------------------------------------------------- //
// "I forgot my password" — the request half.
//
// ONE MESSAGE FOR EVERY OUTCOME, including an address with no account here.
// The server answers 202 either way (and collapses the provider's own
// address-keyed rate limit into it), so there is nothing for this screen to
// branch on and nothing it could accidentally reveal.
// ---------------------------------------------------------------------- //
function ForgotPasswordPanel({onDone}){
  const [email,setEmail] = useState("");
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState("");
  const [sent,setSent] = useState("");

  async function submit(e){
    e.preventDefault();
    if(busy) return;
    setBusy(true); setErr("");
    try{
      const r = await fetch(`${API}/api/auth/password-reset`, {
        method:"POST", headers:{"content-type":"application/json"},
        body:JSON.stringify({email})});
      const body = await r.json().catch(()=>({}));
      if(!r.ok){
        // 400 the address is not an address · 429 limited · 501 this deployment
        // has no such thing · 502/503 ours. Each carries the sentence to show.
        setErr(body.detail || `Could not request a reset (${r.status}).`);
        return;
      }
      setSent(body.detail || "If that address has an account here, a reset link is "
                             + "on its way.");
    }catch(e){
      setErr("Could not reach the server. Check that it is running, then try again.");
    }finally{ setBusy(false); }
  }

  if(sent) return (
    <div className="msg ok" style={{marginTop:8}}>
      {sent} <a href="#" onClick={e=>{e.preventDefault(); onDone();}}>Back to sign in</a>
    </div>);

  return (
    <form onSubmit={submit} style={{marginTop:4}}>
      {err && <div className="msg b" style={{marginBottom:4}}>{maskEngine(err)}</div>}
      <label htmlFor="ec-reset-email">Email</label>
      <input id="ec-reset-email" name="email" type="email" autoComplete="email" autoFocus
             value={email} onChange={e=>{setEmail(e.target.value); setErr("");}}/>
      <button className="btn" type="submit" disabled={busy||!email}>
        {busy ? <span style={{display:"inline-flex",alignItems:"center",gap:9}}><Spin tone="on"/> Sending…</span> : "Email me a reset link"}
      </button>
      <p className="foot">
        The link works once and expires shortly after it arrives.{" "}
        <a href="#" onClick={e=>{e.preventDefault(); onDone();}}>Back to sign in</a>
      </p>
    </form>);
}

// ---------------------------------------------------------------------- //
// ...and the confirm half: the screen the emailed link lands on.
//
// The token came out of the URL fragment and was stripped from the address bar
// before this rendered (EMAIL_LINK, near the top of this file). It is held in a
// prop for the length of one request and posted to our own server, which spends
// it against the identity provider. It never becomes this app's session — the
// server issues none here — so a successful reset ends on the sign-in form.
// ---------------------------------------------------------------------- //
function ResetPasswordScreen({token, onDone}){
  const [password,setPassword] = useState("");
  const [again,setAgain] = useState("");
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState("");
  const mismatch = !!(password && again && password !== again);

  async function submit(e){
    e.preventDefault();
    if(busy || mismatch) return;
    setBusy(true); setErr("");
    try{
      const r = await fetch(`${API}/api/auth/password-reset/confirm`, {
        method:"POST", headers:{"content-type":"application/json"},
        body:JSON.stringify({access_token:token, password})});
      const body = await r.json().catch(()=>({}));
      if(!r.ok){
        // 400 expired/spent link, or a password the policy refused · 429 · 502.
        setErr(body.detail || `Could not change the password (${r.status}).`);
        setPassword(""); setAgain("");
        return;
      }
      // Drop whatever session this browser was holding. Usually there is none —
      // the person resetting a password could not sign in — but on a shared
      // machine there may be, and a password change is the moment to prove the
      // new one rather than ride the old session.
      try{ await fetch(`${API}/api/auth/logout`, {method:"POST"}); }catch(e){}
      onDone(body.detail || "Your password has been changed. Sign in with the new one.");
    }catch(e){
      setErr("Could not reach the server. Check that it is running, then try again.");
    }finally{ setBusy(false); }
  }

  return (
    <div className="loginpage">
      <form className="logincard" onSubmit={submit}>
        <h1>Easy Customs</h1>
        <p className="sub">Choose a new password for your account.</p>
        {err && <div className="msg b" style={{marginBottom:4}}>{maskEngine(err)}</div>}
        <label htmlFor="ec-reset-pass">New password</label>
        <input id="ec-reset-pass" name="new-password" type="password"
               autoComplete="new-password" autoFocus
               value={password} onChange={e=>{setPassword(e.target.value); setErr("");}}/>
        <label htmlFor="ec-reset-pass2">New password again</label>
        <input id="ec-reset-pass2" name="confirm-password" type="password"
               autoComplete="new-password"
               value={again} onChange={e=>{setAgain(e.target.value); setErr("");}}/>
        {mismatch && <div className="msg w" style={{marginBottom:4}}>
          Those two do not match.</div>}
        <button className="btn" type="submit" disabled={busy||!password||!again||mismatch}>
          {busy ? <span style={{display:"inline-flex",alignItems:"center",gap:9}}><Spin tone="on"/> Saving…</span> : "Set new password"}
        </button>
        <p className="foot">
          You sign in with the new password afterwards — this link does not sign you in.{" "}
          <a href="#" onClick={e=>{e.preventDefault(); onDone("");}}>Cancel</a>
        </p>
      </form>
    </div>);
}

function LoginScreen({onSignedIn, notice}){
  const [username,setUsername] = useState("");
  const [password,setPassword] = useState("");
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState("");
  const [signupOpen,setSignupOpen] = useState(false);   // does this deployment offer it
  const [resetOpen,setResetOpen] = useState(false);     // ...and this one
  const [registering,setRegistering] = useState(false); // which form is showing
  const [forgot,setForgot] = useState(false);

  // TWO questions, not one. Registration is gated on EASYCUSTOMS_ALLOW_SELF_SIGNUP
  // and is off by default; password reset is gated on the identity provider
  // alone, because a deployment that creates its accounts by hand still has users
  // who forget passwords. Reusing one answer for both would hide "forgot your
  // password?" on almost every deployment.
  useEffect(()=>{
    let alive = true;
    fetch(`${API}/api/auth/signup`)
      .then(r => r.ok ? r.json() : null)
      .then(s => { if(alive) setSignupOpen(!!(s && s.enabled)); })
      .catch(()=>{});                       // no link is the safe default
    fetch(`${API}/api/auth/password-reset`)
      .then(r => r.ok ? r.json() : null)
      .then(s => { if(alive) setResetOpen(!!(s && s.enabled)); })
      .catch(()=>{});
    return ()=>{ alive = false; };
  },[]);

  async function submit(e){
    e.preventDefault();
    if(busy) return;
    setBusy(true); setErr("");
    try{
      const r = await fetch(`${API}/api/auth/login`, {
        method:"POST", headers:{"content-type":"application/json"},
        body:JSON.stringify({username, password})});
      const body = await r.json().catch(()=>({}));
      if(!r.ok){
        // 401 bad credentials · 429 throttled · 503 no account configured —
        // each already carries the sentence to show.
        setErr(body.detail || `Sign-in failed (${r.status}).`);
        setPassword("");
        return;
      }
      onSignedIn(body);
    }catch(e){
      setErr("Could not reach the server. Check that it is running, then try again.");
    }finally{ setBusy(false); }
  }

  if(registering) return (
    <div className="loginpage">
      <div className="logincard">
        <h1>Easy Customs</h1>
        <p className="sub">ASYCUDA World XML Generator · create an account.</p>
        <SignupPanel onDone={()=>setRegistering(false)}/>
      </div>
    </div>);

  if(forgot) return (
    <div className="loginpage">
      <div className="logincard">
        <h1>Easy Customs</h1>
        <p className="sub">ASYCUDA World XML Generator · reset your password.</p>
        <ForgotPasswordPanel onDone={()=>setForgot(false)}/>
      </div>
    </div>);

  return (
    <div className="loginpage">
      <form className="logincard" onSubmit={submit}>
        <h1>Easy Customs</h1>
        <p className="sub">ASYCUDA World XML Generator · sign in to open the declaration workspace.</p>
        {notice && <div className="msg w" style={{marginBottom:4}}>{notice}</div>}
        {err && <div className="msg b" style={{marginBottom:4}}>{maskEngine(err)}</div>}
        <label htmlFor="ec-user">Username</label>
        <input id="ec-user" name="username" autoComplete="username" autoFocus
               value={username} onChange={e=>{setUsername(e.target.value); setErr("");}}/>
        <label htmlFor="ec-pass">Password</label>
        <input id="ec-pass" name="password" type="password" autoComplete="current-password"
               value={password} onChange={e=>{setPassword(e.target.value); setErr("");}}/>
        <button className="btn" type="submit" disabled={busy||!username||!password}>
          {busy ? <span style={{display:"inline-flex",alignItems:"center",gap:9}}><Spin tone="on"/> Signing in…</span> : "Sign in"}
        </button>
        <p className="foot">
          Your session stays open for 24 hours, then asks for the password again.
          {resetOpen && <> · <a href="#" onClick={e=>{e.preventDefault(); setErr(""); setForgot(true);}}>Forgot your password?</a></>}
          {signupOpen && <> · <a href="#" onClick={e=>{e.preventDefault(); setErr(""); setRegistering(true);}}>Create an account</a></>}
        </p>
      </form>
    </div>);
}

// ---------------------------------------------------------------------- //
// Shell — decides between the sign-in screen and the workspace.  The App is
// never mounted without a session, so no screen inside it has to reason about
// being signed out; a 401 from anywhere lands back here (api() fires
// "ec-auth-expired") and re-mounts App clean on the next sign-in.
// ---------------------------------------------------------------------- //
function Shell(){
  const [session,setSession] = useState(undefined);   // undefined = still asking
  // An email link that arrived with something to say. Read once, at module
  // scope, and already stripped from the address bar.
  const [notice,setNotice] = useState(
    EMAIL_LINK && EMAIL_LINK.kind === "error" ? EMAIL_LINK.detail :
    EMAIL_LINK && EMAIL_LINK.kind === "confirmed"
      ? "Your email address is confirmed. Sign in to continue." : "");
  const [recovery,setRecovery] = useState(
    EMAIL_LINK && EMAIL_LINK.kind === "recovery" ? EMAIL_LINK.token : "");

  useEffect(()=>{
    let alive = true;
    // Plain fetch, not api(): a 401 here is the expected answer ("not signed
    // in"), not a session that just ended.
    fetch(`${API}/api/auth/session`)
      .then(r => r.ok ? r.json() : null)
      .then(s => { if(alive) setSession(s); })
      .catch(()=>{ if(alive) setSession(null); });
    const onExpired = () => setSession(s => {
      if(s) setNotice("Your session ended. Sign in to continue.");
      return null;
    });
    window.addEventListener("ec-auth-expired", onExpired);
    return ()=>{ alive=false; window.removeEventListener("ec-auth-expired", onExpired); };
  },[]);

  // Expire the screen at the moment the token does, rather than waiting for
  // the next request to fail — an idle tab should not still look signed in.
  useEffect(()=>{
    if(!session || !session.expires_at) return;
    const ms = session.expires_at*1000 - Date.now();
    if(ms <= 0){ setSession(null); return; }
    // setTimeout saturates past ~24.8 days; a 24h session is well inside it.
    const t = setTimeout(()=>{
      setNotice("Your 24-hour session ended. Sign in to continue.");
      setSession(null);
    }, ms);
    return ()=>clearTimeout(t);
  },[session]);

  async function signOut(){
    try{ await fetch(`${API}/api/auth/logout`, {method:"POST"}); }catch(e){}
    setNotice(""); setSession(null);
  }

  // BEFORE the session decision, deliberately. Somebody resetting a password
  // usually has no session — but on a shared machine they may, and answering
  // that case with the workspace would leave a live recovery token in a browser
  // that just navigated away from the only screen that could spend it.
  if(recovery) return <ResetPasswordScreen token={recovery} onDone={msg=>{
    setRecovery(""); setNotice(msg); setSession(null);
  }}/>;
  if(session === undefined) return (
    <main><div className="card"><div className="row" style={{gap:10}}>
      <Spin size="lg"/><span className="muted">Checking your session…</span></div></div></main>);
  if(!session) return <LoginScreen notice={notice} onSignedIn={s=>{ setNotice(""); setSession(s); }}/>;
  return <App session={session} onSignOut={signOut}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Shell/>);
</script>
<script>
/* ---------------------------------------------------------------------------
   Easy Customs workspace shell — ADDITIVE, presentation only.

   Reads the already-rendered DOM and mirrors it into (a) a fixed step rail and
   (b) a facts strip, then shows one step card at a time by toggling a class on
   <main>'s children. It never mutates a node inside #root, never touches React
   state/props/handlers, and issues no requests. The original header, cards,
   fields and buttons all remain in the document exactly as React rendered them.
   Delete this block -> the app is the original single scrolling page.
--------------------------------------------------------------------------- */
(function(){
  var rail, facts, nextbar, nav, active = null, cards = [], seen = {}, raf = 0, pending = 0;
  var pendingGoto = null;   // an ec:goto that arrived before the first card scan
  var KEY = "ec.ui.step";
  try { active = window.sessionStorage.getItem(KEY) || null; } catch(e){}

  function txt(el){ return el ? el.textContent.replace(/\s+/g," ").trim() : ""; }

  function ensure(){
    if (rail) return;
    rail = document.createElement("aside");
    rail.className = "ec-rail";
    rail.innerHTML =
      '<div class="ec-brand"><b>EASY CUSTOMS</b><i>ASYCUDA World · Nepal SAD</i>' +
        '<span class="ec-live"><s></s>AINDA engine · live</span></div>' +
      '<div class="ec-card ec-jobcard"><div class="ec-job">—</div><div class="ec-sub"></div></div>' +
      '<div class="ec-card ec-open"><div class="ec-lbl">Open cases</div><div class="ec-num">0</div>' +
        '<div class="ec-bar"><span></span></div><div class="ec-note"></div></div>' +
      '<nav></nav>' +
      '<div class="ec-foot"><div class="ec-keys"><b>Alt+1…3</b> jump between steps<br />' +
        '<b>Alt+←/→</b> previous · next step<br />' +
        'Headings stay pinned · totals stay in view</div>' +
        '<div class="ec-who"><s>AD</s><em><b class="ec-user">signed in</b><i>24-hour session</i></em>' +
        '<button type="button" class="ec-out">Out</button></div></div>';
    document.body.appendChild(rail);
    nav = rail.querySelector("nav");

    facts = document.createElement("div");
    facts.className = "ec-facts";
    document.body.appendChild(facts);

    // Back / Next for the step the page is on.  Like the rail it lives OUTSIDE
    // #root: React owns every node it rendered, and the promise of this block
    // is that it only ever reads them.
    nextbar = document.createElement("div");
    nextbar.className = "ec-next";
    nextbar.innerHTML =
      '<button type="button" class="ec-back">← Back</button>' +
      '<div class="ec-pos"><b></b><i><span></span><u></u></i></div>' +
      '<button type="button" class="ec-fwd">Next →</button>';
    document.body.appendChild(nextbar);
    nextbar.querySelector(".ec-back").addEventListener("click", function(){ step(-1); });
    nextbar.querySelector(".ec-fwd").addEventListener("click", function(){ step(1); });

    rail.querySelector(".ec-out").addEventListener("click", function(){
      var real = findHeaderBtn(/sign\s*out/i);
      if (real) real.click();
    });
  }

  function findHeaderBtn(re){
    var bs = document.querySelectorAll("header button");
    for (var i = 0; i < bs.length; i++) if (re.test(bs[i].textContent)) return bs[i];
    return null;
  }

  function build(){
    var main = document.querySelector("main");
    var found = main ? main.querySelectorAll(":scope > .card") : [];
    if (!main || !found.length || !document.querySelector("header")){
      document.documentElement.classList.remove("ec-on","ec-step","ec-view");
      if (rail) { rail.style.display = "none"; facts.style.display = "none";
                  nextbar.style.display = "none"; }
      cards = []; return;
    }
    ensure();
    rail.style.display = ""; facts.style.display = "";
    document.documentElement.classList.add("ec-on");
    // the document viewer is a fixed right-hand panel — keep the footer clear of it
    document.documentElement.classList.toggle("ec-view", !!main.classList.contains("with-viewer"));

    cards = [];
    for (var i = 0; i < found.length; i++){
      var card = found[i], h2 = card.querySelector(":scope > h2");
      if (!h2) continue;
      var stepEl = h2.querySelector(".step");
      var label = txt(h2.querySelector(".htxt")) || txt(h2);
      if (stepEl) label = label.replace(stepEl.textContent, "").trim();
      label = label.replace(/^[^A-Za-z0-9]+/, "").trim();
      var short = label.split(/\s+[—·-]\s+/)[0];
      cards.push({
        el: card,
        id: (stepEl ? "s" + stepEl.textContent.trim() : "x" + i),
        badge: stepEl ? stepEl.textContent.trim() : "·",
        label: short.length > 22 ? short.slice(0,21) + "…" : short,
        blockers: card.querySelectorAll(".msg.b").length,
        warnings: card.querySelectorAll(".msg.w").length,
        oks: card.querySelectorAll(".msg.ok").length
      });
    }
    if (!cards.length){
      document.documentElement.classList.remove("ec-step");
      nextbar.style.display = "none";
      return;
    }
    document.documentElement.classList.add("ec-step");

    // an app jump that arrived before this first scan lands now — the app
    // dispatches ec:goto the moment it decides (boot), which can precede the
    // workspace commit; honouring it here keeps the channel timing-proof
    if (pendingGoto !== null){
      var pg = pendingGoto; pendingGoto = null;
      if (pg === "first") active = cards[0].id;
      else if (pg === "queue"){
        active = cards[cards.length-1].id;
        for (var pq = 0; pq < cards.length; pq++)
          if (/decision queue/i.test(cards[pq].label)) active = cards[pq].id;
      }
      else { for (var ps = 0; ps < cards.length; ps++) if (cards[ps].id === "s"+pg) active = "s"+pg; }
      try { window.sessionStorage.setItem(KEY, active); } catch(e){}
    }
    // the chosen step must still exist; otherwise fall back to the first card
    var has = false;
    for (var k = 0; k < cards.length; k++) if (cards[k].id === active) has = true;
    if (!has) active = cards[0].id;

    var html = "";
    for (var j = 0; j < cards.length; j++){
      var c = cards[j], on = c.id === active;
      // a step that reported success and blocks nothing has been got through:
      // saying so is the only progress signal the rail can honestly give
      var done = !!c.oks && !c.blockers;
      var sub = c.blockers ? c.blockers + " blocking"
              : (c.warnings ? c.warnings + " warning" + (c.warnings>1?"s":"")
                            : (done ? "done" : "clear"));
      var fresh = seen[c.id] === undefined && Object.keys(seen).length ? " fresh" : "";
      seen[c.id] = 1;
      c.el.classList.toggle("ec-show", on);
      html += '<a data-id="' + c.id + '" role="button" tabindex="0"' +
              ' aria-current="' + (on ? "step" : "false") + '"' +
              ' class="' + (on ? "on " : "") + (done ? "done " : "") + fresh + '">' +
              '<s>' + c.badge + '</s><em><b>' + c.label + '</b><i>' + sub + '</i></em></a>';
    }
    nav.innerHTML = html;

    paintJob();
    paintOpen();
    paintFacts();
    paintNext();
  }

  function indexOfActive(){
    for (var i = 0; i < cards.length; i++) if (cards[i].id === active) return i;
    return 0;
  }

  // The footer names where "next" actually goes: step 3 only exists once the
  // review has rows, and the audit card only once there are events, so the
  // labels are read off the cards that are really on the page.
  function paintNext(){
    if (cards.length < 2){ nextbar.style.display = "none"; return; }
    nextbar.style.display = "";
    var i = indexOfActive(), cur = cards[i], prev = cards[i-1], next = cards[i+1];
    var back = nextbar.querySelector(".ec-back"), fwd = nextbar.querySelector(".ec-fwd");
    back.disabled = !prev;
    back.textContent = prev ? "← Back: " + prev.label : "← Back";
    back.title = prev ? "go back to step " + prev.badge + " · " + prev.label : "this is the first step";
    fwd.disabled = !next;
    fwd.textContent = next ? "Next: " + next.label + " →" : "Last step";
    fwd.title = next ? "continue to step " + next.badge + " · " + next.label : "this is the last step";
    nextbar.querySelector(".ec-pos b").textContent = "Step " + (i+1) + " of " + cards.length;
    nextbar.querySelector(".ec-pos i span").textContent = cur.label;
    // Navigation is never blocked — the count is a heads-up, not a gate.
    nextbar.querySelector(".ec-pos u").textContent =
      cur.blockers ? " · " + cur.blockers + " blocking here" : "";
  }

  function step(d){
    var i = indexOfActive() + d;
    if (i < 0 || i >= cards.length) return;
    go(cards[i].id);
  }

  function paintJob(){
    var badges = document.querySelectorAll("header .badge");
    var who = "", job = "", bits = [];
    for (var i = 0; i < badges.length; i++){
      var t = txt(badges[i]);
      if (/^👤/.test(t)) who = t.replace(/^👤\s*/, "");
      else if (t) bits.push(t);
    }
    var h1 = document.querySelector("header h1");
    job = txt(document.querySelector("main .card.jobs tbody tr b")) || txt(h1) || "Easy Customs";
    rail.querySelector(".ec-job").textContent = job.length > 26 ? job.slice(0,25) + "…" : job;
    rail.querySelector(".ec-jobcard .ec-sub").textContent = bits.slice(0,2).join(" · ");
    rail.querySelector(".ec-user").textContent = who || "signed in";
    var av = rail.querySelector(".ec-who s");
    av.textContent = (who || "AD").slice(0,2).toUpperCase();
  }

  function paintOpen(){
    var b = document.querySelectorAll("main .msg.b").length;
    var w = document.querySelectorAll("main .msg.w").length;
    var box = rail.querySelector(".ec-open");
    var num = box.querySelector(".ec-num"), bar = box.querySelector(".ec-bar span");
    var note = box.querySelector(".ec-note");
    var total = b + w;
    num.textContent = String(total);
    var col = b ? "#f87171" : (w ? "#fbbf24" : "#34d399");
    num.style.color = col; bar.style.background = col;
    bar.style.width = total ? Math.min(100, total * 12) + "%" : "100%";
    note.textContent = b ? b + " block the XML · " + w + " warnings"
                         : (w ? w + " warnings · nothing blocking" : "nothing blocking");
  }

  // Built node by node, never as an HTML string.
  //
  // Everything this paints is read back out of the DOM with textContent, and
  // some of it starts life in an uploaded PDF: the invoice's currency and the
  // air waybill's weight unit reach `.src` verbatim, neither validated against
  // a code list.  React escapes those on the way in; concatenating them into
  // innerHTML on the way out undid that and handed a third-party document a
  // way to put markup on this origin.  Truncation and an upper() upstream
  // happened to make a working script payload hard to fit — neither was put
  // there for that, and neither is a control worth resting on.
  function mk(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function paintFacts(){
    var ks = document.querySelectorAll("main .kpi .k");
    var frag = document.createDocumentFragment();
    for (var i = 0; i < ks.length && i < 8; i++){
      var lbl = txt(ks[i].querySelector(".lbl"));
      var val = txt(ks[i].querySelector(".val"));
      var srcv = txt(ks[i].querySelector(".src")).replace(/📄/g,"").trim();
      if (!lbl || !val) continue;
      var row = mk("div", "ec-f");
      row.appendChild(mk("i", null, lbl));
      var strong = mk("b", null, val);
      if (srcv){
        strong.appendChild(document.createTextNode(" "));
        strong.appendChild(mk("span", null, srcv.slice(0,26)));
      }
      row.appendChild(strong);
      frag.appendChild(row);
    }
    var nb = document.querySelectorAll("main .msg.b").length;
    var nw = document.querySelectorAll("main .msg.w").length;
    var state = mk("div", "ec-state");
    state.style.color = nb ? "#b91c1c" : (nw ? "#b45309" : "#047857");
    state.appendChild(mk("s"));
    state.appendChild(document.createTextNode(
      nb ? nb + " blocking" : (nw ? nw + " warnings" : "nothing blocking")));
    frag.appendChild(state);
    facts.textContent = "";
    facts.appendChild(frag);
  }

  function go(id){
    active = id;
    try { window.sessionStorage.setItem(KEY, id); } catch(e){}
    for (var i = 0; i < cards.length; i++) cards[i].el.classList.toggle("ec-show", cards[i].id === id);
    var links = nav.children;
    for (var j = 0; j < links.length; j++){
      links[j].classList.toggle("on", links[j].getAttribute("data-id") === id);
      if (links[j].getAttribute("data-id") === id) links[j].classList.remove("fresh");
    }
    paintNext();
    // Under the shell breakpoint every card is on screen at once, so swapping
    // the pane shows nothing new: carry the eye to the step instead.
    if (window.matchMedia && window.matchMedia("(max-width:1180px)").matches){
      for (var m = 0; m < cards.length; m++){
        if (cards[m].id === id && cards[m].el.scrollIntoView){
          cards[m].el.scrollIntoView({block:"start"});
          return;
        }
      }
    }
    window.scrollTo({top:0, behavior:"auto"});
  }

  // One resolver for every way the app names a step: "first" = whatever card
  // leads the workspace; "queue" = the decision queue wherever it sits (it
  // closes the workspace now); "2" = the card whose step badge says 2 — the
  // app must not have to know the shell's card ids.
  function jumpTo(raw){
    if (raw === "first"){ if (cards.length) go(cards[0].id); return; }
    if (raw === "queue"){
      for (var z = 0; z < cards.length; z++){
        if (/decision queue/i.test(cards[z].label)){ go(cards[z].id); return; }
      }
      if (cards.length) go(cards[cards.length-1].id);
      return;
    }
    var want = "s" + raw;
    for (var q = 0; q < cards.length; q++){
      if (cards[q].id === want){ go(want); break; }
    }
  }

  // The app announces its own arrivals (extraction finished → review computed)
  // by dispatching this event.  The shell only listens — the promise that it
  // never touches React's nodes holds — and without the shell it is a no-op.
  document.addEventListener("ec:goto", function(e){
    if (e == null || e.detail == null) return;
    // before the first scan there is nothing to jump within — queue it for
    // render(), which consumes it as soon as the cards exist
    if (!cards.length){ pendingGoto = String(e.detail); return; }
    jumpTo(String(e.detail));
  });

  document.addEventListener("click", function(e){
    if (!e.target.closest) return;
    // "fix in step N" links rendered by the app.  Delegation only — the node
    // is React's and is never touched, just listened to.
    var jump = e.target.closest("[data-ec-goto]");
    if (jump){
      jumpTo(jump.getAttribute("data-ec-goto"));
      return;                       // the app's own onClick still runs
    }
    var a = e.target.closest(".ec-rail nav a");
    if (!a) return;
    e.preventDefault();
    go(a.getAttribute("data-id"));
  });

  // the rail is navigation: it has to be reachable and operable from the
  // keyboard, not only from a mouse
  document.addEventListener("keydown", function(e){
    if (e.key !== "Enter" && e.key !== " ") return;
    var a = e.target.closest ? e.target.closest(".ec-rail nav a") : null;
    if (!a) return;
    e.preventDefault();
    go(a.getAttribute("data-id"));
  });

  document.addEventListener("keydown", function(e){
    if (!e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key >= "1" && e.key <= "3"){
      for (var i = 0; i < cards.length; i++){
        if (cards[i].id === "s" + e.key){ e.preventDefault(); go(cards[i].id); return; }
      }
      return;
    }
    if (cards.length > 1 && (e.key === "ArrowRight" || e.key === "ArrowLeft")){
      e.preventDefault();
      step(e.key === "ArrowRight" ? 1 : -1);
    }
  });

  function schedule(){ clearTimeout(pending); pending = setTimeout(build, 140); }
  function start(){
    var root = document.getElementById("root");
    if (!root) return setTimeout(start, 120);
    build();
    new MutationObserver(schedule).observe(root, {childList:true, subtree:true});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
</body>
</html>
