<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Easy Customs — ASYCUDA XML Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
/* =========================================================================
   Easy Customs — workspace shell (05 Aug 2026).
   PRESENTATION ONLY + one additive script at the end of <body>.
   No React component, handler, request, rule, field or box is changed,
   removed or reordered. Every selector here is one the SPA already emits.
   The step rail, facts strip and one-step-at-a-time view are produced by
   CSS and by a script that READS the rendered DOM and appends siblings to
   <body>; nothing inside #root is ever mutated. Delete the script block and
   the app returns to a single scrolling page with identical behaviour.
   ========================================================================= */
  :root{
    --bg:#eef0f4; --panel:#ffffff; --ink:#14181f; --muted:#8890a0; --line:#e4e7ec;
    --brand:#b91c1c; --brand2:#1d4ed8; --ok:#047857; --warn:#b45309; --warnbg:#fffbeb;
    --block:#b91c1c; --blockbg:#fef2f2; --okbg:#ecfdf5; --chip:#f4f6f9;
    --ink2:#3d4553; --ink3:#5b6371; --line2:#d5dae2; --shadow:0 1px 2px rgba(20,24,31,.05);
    --rail:216px; --facts:46px; --nextbar:54px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Helvetica Neue',Helvetica,Arial,-apple-system,BlinkMacSystemFont,sans-serif;
       background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#c9cfd9;border-radius:6px;border:3px solid transparent;background-clip:content-box}

  /* ===================== workspace shell ================================ */
  html.ec-on body{padding-left:var(--rail)}
  html.ec-on header{display:none}                 /* its content moves to the rail + facts strip */

  .ec-rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:44;background:#14181f;
       color:#e8eaee;display:flex;flex-direction:column;overflow:hidden}
  .ec-rail::before{content:"";position:absolute;left:-60px;top:-90px;width:230px;height:230px;
       border-radius:50%;background:radial-gradient(circle,rgba(185,28,28,.36),transparent 66%)}
  .ec-rail .ec-brand{position:relative;padding:15px 14px 10px}
  .ec-rail .ec-brand b{display:block;font-size:10px;letter-spacing:.17em;color:#fff}
  .ec-rail .ec-brand i{display:block;font-style:normal;font-size:9.5px;color:#8b93a1;margin-top:3px}
  .ec-rail .ec-live{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:9.5px;
       color:#c9cfd9;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
       border-radius:999px;padding:2px 8px}
  .ec-rail .ec-live s{width:5px;height:5px;border-radius:50%;background:#34d399;text-decoration:none;
       animation:ec-pulse 1.8s ease-in-out infinite}
  .ec-card{position:relative;margin:2px 12px 10px;padding:9px 11px;border-radius:9px;
       background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
  .ec-card .ec-job{font-size:11.5px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ec-card .ec-sub{font-size:9.5px;color:#8b93a1;margin-top:2px;line-height:1.45}
  .ec-card .ec-lbl{font-size:8px;letter-spacing:.09em;text-transform:uppercase;color:#8b93a1;font-weight:700}
  .ec-card .ec-num{font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-top:2px;
       font-variant-numeric:tabular-nums}
  .ec-card .ec-bar{height:3px;border-radius:999px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
  .ec-card .ec-bar span{display:block;height:3px;border-radius:999px;background:currentColor}
  .ec-card .ec-note{font-size:9px;color:#8b93a1;margin-top:6px;line-height:1.4}

  .ec-rail nav{display:flex;flex-direction:column;gap:1px;padding:0 9px;overflow:auto}
  .ec-rail nav a{display:flex;gap:9px;align-items:center;border-radius:8px;padding:8px 10px;
       text-decoration:none;color:#c9cfd9;line-height:1.3;cursor:pointer}
  .ec-rail nav a s{flex:none;width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,.09);
       color:#98a0ae;font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;
       justify-content:center;text-decoration:none}
  .ec-rail nav a em{min-width:0;flex:1;font-style:normal}
  .ec-rail nav a em b{display:block;font-size:11.5px;font-weight:600;overflow:hidden;
       text-overflow:ellipsis;white-space:nowrap}
  .ec-rail nav a em i{display:block;font-style:normal;font-size:9.5px;color:#767e8d;margin-top:1px;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ec-rail nav a:hover{background:rgba(255,255,255,.09);color:#fff}
  .ec-rail nav a.on{background:rgba(255,255,255,.12);color:#fff}
  .ec-rail nav a.on s{background:var(--brand);color:#fff}
  .ec-rail nav a.on em i{color:#a7aebb}
  .ec-rail nav a.fresh em b::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
       background:#34d399;margin-left:6px;vertical-align:2px}
  .ec-rail nav a.done s{background:rgba(52,211,153,.16);color:#34d399;box-shadow:inset 0 0 0 1px rgba(52,211,153,.4)}
  .ec-rail nav a.done em i{color:#34d399}
  .ec-rail nav a.on.done s{background:var(--brand);color:#fff;box-shadow:none}
  .ec-rail nav a:focus-visible,.ec-next button:focus-visible,.ichip:focus-visible{outline:2px solid var(--brand2);
       outline-offset:2px}
  .ec-rail nav a:focus-visible{outline-color:#93c5fd}
  .ec-rail .ec-foot{margin-top:auto;padding:11px 13px;border-top:1px solid rgba(255,255,255,.09)}
  .ec-rail .ec-foot .ec-keys{font-size:8.5px;color:#767e8d;line-height:1.6;margin-bottom:9px}
  .ec-rail .ec-foot .ec-keys b{color:#c9cfd9}
  .ec-rail .ec-who{display:flex;align-items:center;gap:8px}
  .ec-rail .ec-who s{width:24px;height:24px;border-radius:50%;background:#2c313b;color:#c9cfd9;
       font-size:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;
       text-decoration:none;flex:none}
  .ec-rail .ec-who em{flex:1;min-width:0;font-style:normal}
  .ec-rail .ec-who em b{display:block;font-size:11px;font-weight:600;color:#e8eaee}
  .ec-rail .ec-who em i{display:block;font-style:normal;font-size:9px;color:#8b93a1}
  .ec-rail .ec-who button{border:1px solid rgba(255,255,255,.16);background:transparent;color:#c9cfd9;
       border-radius:6px;padding:2px 7px;font-size:9.5px;cursor:pointer;font-family:inherit;flex:none}
  .ec-rail .ec-who button:hover{background:rgba(255,255,255,.1);color:#fff}

  /* facts strip: the review KPIs, always in view */
  .ec-facts{position:fixed;top:0;left:var(--rail);right:0;height:var(--facts);z-index:42;background:#fff;
       border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 18px;
       overflow-x:auto;overflow-y:hidden}
  .ec-facts .ec-f{flex:none}
  .ec-facts .ec-f i{display:block;font-style:normal;font-size:9px;letter-spacing:.1em;
       text-transform:uppercase;color:var(--muted);font-weight:700}
  .ec-facts .ec-f b{display:block;font-size:13px;font-weight:600;margin-top:2px;
       font-variant-numeric:tabular-nums;white-space:nowrap}
  .ec-facts .ec-f b span{font-size:9.5px;color:var(--muted);font-weight:400}
  .ec-facts .ec-state{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;
       font-size:10.5px;font-weight:600;white-space:nowrap}
  .ec-facts .ec-state s{width:7px;height:7px;border-radius:50%;text-decoration:none;background:currentColor}
  html.ec-on main{padding-top:calc(var(--facts) + 14px)}
  html.ec-on .docpanel{top:0}

  /* step footer: the forward path out of every step, always within reach so
     the rail is never the only way onwards */
  .ec-next{position:fixed;left:var(--rail);right:0;bottom:0;height:var(--nextbar);z-index:43;
       background:rgba(255,255,255,.96);backdrop-filter:blur(7px);border-top:1px solid var(--line);
       display:flex;align-items:center;gap:12px;padding:0 18px}
  html.ec-view .ec-next{right:calc(min(38vw,600px))}          /* clear of the document viewer */
  .ec-next .ec-pos{margin:0 auto;min-width:0;text-align:center}
  .ec-next .ec-pos b{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
       color:var(--muted);font-weight:700}
  .ec-next .ec-pos i{display:block;font-style:normal;font-size:12px;font-weight:600;margin-top:1px;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ec-next .ec-pos u{text-decoration:none;color:var(--block);font-weight:600}
  .ec-next button{flex:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
       border-radius:7px;padding:8px 14px;max-width:38%;overflow:hidden;text-overflow:ellipsis;
       white-space:nowrap;border:1px solid var(--line2);background:#fff;color:var(--ink2)}
  .ec-next button.ec-fwd{background:var(--brand2);border-color:var(--brand2);color:#fff}
  .ec-next button:disabled{opacity:.4;cursor:not-allowed}
  .ec-next button:not(:disabled):hover{filter:brightness(1.07)}
  html.ec-on main{padding-bottom:calc(var(--nextbar) + 18px)}

  /* one step at a time — cards stay mounted, only presentation changes */
  html.ec-step main > .card{display:none}
  html.ec-step main > .card.ec-show{display:block}

  @media(max-width:1180px){
    html.ec-on body{padding-left:0}
    html.ec-on header{display:block}
    .ec-rail{display:none}
    .ec-facts{display:none}
    html.ec-on main{padding-top:0}
    html.ec-step main > .card{display:block}
    /* every card is on screen at once here: the bar still moves the eye
       from one step to the next, it just scrolls instead of swapping panes */
    .ec-next{left:0}
  }

  /* ===================== page + cards =================================== */
  main{max-width:1400px;margin:12px auto;padding:0 16px 44px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:0 14px 13px;
        margin-bottom:10px;box-shadow:var(--shadow)}
  .card h2{margin:0 -14px 8px;padding:11px 14px 9px;font-size:13.5px;font-weight:600;letter-spacing:-.01em;
        display:flex;align-items:center;justify-content:space-between;gap:8px;
        position:sticky;top:var(--facts);z-index:12;background:rgba(255,255,255,.94);
        backdrop-filter:blur(7px);border-bottom:1px solid var(--line);border-radius:11px 11px 0 0}
  .card h2 .htxt{display:inline-flex;align-items:center;gap:8px;min-width:0}
  .step{width:19px;height:19px;border-radius:6px;background:#b91c1c;color:#fff;font-size:10.5px;
        display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  .hint{color:var(--ink3);font-size:11.5px;line-height:1.45;margin:2px 0 9px}
  .muted{color:var(--muted)}
  .flowline{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.5}
  code{background:var(--chip);padding:1px 4px;border-radius:4px;font-size:11px;
        font-family:ui-monospace,Menlo,Consolas,monospace}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;white-space:pre-wrap;
        background:#fff;border:1px solid var(--line2);border-radius:7px;padding:7px 9px;line-height:1.5}
  details summary{cursor:pointer;font-size:11.5px;color:var(--ink2);font-weight:600}
  details summary:hover{color:var(--brand2)}

  /* ===================== layout ========================================= */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:8px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:8px}
  .row{display:flex;gap:7px;row-gap:7px;flex-wrap:wrap;align-items:center;min-width:0}

  /* ===================== upload boxes =================================== */
  .box{border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:9px;
       padding:9px 10px;background:#fff;transition:.16s;box-shadow:var(--shadow)}
  .box.req{border-left-color:#fca5a5}
  .box.filled{border-left-color:var(--ok)}
  .box:hover{border-color:var(--line2)}
  .box.drag{border-color:var(--brand2);border-left-color:var(--brand2);background:#f5f8ff;
       box-shadow:0 0 0 3px rgba(29,78,216,.14)}
  .box .role{font-weight:600;font-size:12px;display:flex;justify-content:space-between;
       align-items:center;gap:7px}
  .box .tag{font-size:10.5px;color:var(--muted);line-height:1.4}
  .box input[type=file]{font-size:10.5px;margin-top:7px;width:100%}
  .xbtn{border:1px solid var(--line2);background:#fff;color:var(--ink3);border-radius:6px;
       padding:1px 7px;font-size:10.5px;cursor:pointer;font-family:inherit;flex:none}
  .xbtn:hover{border-color:#fca5a5;color:#b91c1c;background:#fef2f2}
  .xbtn:disabled{opacity:.5;cursor:not-allowed}
  .doclink{background:none;border:0;padding:0;font:inherit;color:var(--brand2);
       cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .doclink:hover{color:#16309c}

  .pbtns{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .pbtn{border:1px dashed var(--brand2);background:#fff;color:var(--brand2);border-radius:6px;
        padding:4px 9px;font-size:10.5px;cursor:pointer;font-weight:600;font-family:inherit}
  .pbtn:hover{background:#f5f8ff}
  .pbtn:disabled{opacity:.5;cursor:not-allowed}
  .pstage{margin-top:8px;border:1px solid #c7d2fe;border-radius:9px;padding:9px;background:#f7f9ff}
  .pstage .phead{font-size:11.5px;font-weight:700}
  .pstage .phint{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4}
  .pthumbs{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
  .pthumb{position:relative;width:58px}
  .pthumb img{width:58px;height:76px;object-fit:cover;border-radius:6px;border:1px solid var(--line2);display:block}
  .pthumb.bad img{border-color:#fca5a5}
  .pno{position:absolute;top:2px;left:2px;background:#14181fe6;color:#fff;border-radius:5px;
       font-size:9.5px;padding:0 5px;font-weight:700}
  .pops{display:flex;gap:2px;justify-content:center;margin-top:2px}
  .pops button{border:1px solid var(--line2);background:#fff;border-radius:4px;font-size:10px;
               padding:0 4px;cursor:pointer;color:var(--ink3);font-family:inherit}
  .pops button:hover{color:var(--ink);border-color:#94a3b8}
  .pwarn{font-size:9.5px;color:#b91c1c;margin-top:2px;line-height:1.25}

  /* ===================== buttons ======================================== */
  .btn{background:var(--brand2);color:#fff;border:0;border-radius:7px;padding:7px 12px;font-size:12px;
       cursor:pointer;font-weight:600;font-family:inherit;transition:.15s}
  .btn:not(:disabled):hover{filter:brightness(1.07)}
  .btn:not(:disabled):active{transform:translateY(1px)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn.alt{background:#14181f}
  .btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line2)}
  .btn.ghost:not(:disabled):hover{border-color:var(--brand2);color:var(--brand2);filter:none}
  .btn.big{padding:9px 16px;font-size:12.5px;background:#14181f}
  .gbtn{display:inline-flex;align-items:center;gap:5px;background:#fff;color:var(--ink2);
        border:1px solid var(--line2);border-radius:7px;padding:3px 9px;font-size:10.5px;
        font-weight:600;cursor:pointer;line-height:1.5;font-family:inherit;transition:.15s}
  .gbtn:hover{border-color:var(--brand2);color:var(--brand2)}
  .gbtn.hdr{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#c9cfd9}
  .gbtn.hdr:hover{background:rgba(255,255,255,.14);color:#fff}

  /* ===================== tables ========================================= */
  table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:7px}
  th,td{text-align:left;padding:5px 7px;border-bottom:1px solid #f2f4f7}
  th{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:.08em;
     background:#fafbfc;border-bottom:1px solid var(--line)}
  td{font-variant-numeric:tabular-nums}
  .jobs tbody tr{cursor:pointer}
  .jobs tbody tr:hover td{background:#f6f8fc}

  /* ===================== KPI blocks ===================================== */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:8px;margin:6px 0 3px}
  .kpi .k{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .kpi .k .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
  .kpi .k .val{font-size:17px;font-weight:600;margin-top:3px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .k .src{font-size:9.5px;color:var(--muted);margin-top:2px;line-height:1.35}

  /* ===================== fields ========================================= */
  label.f{display:block;font-size:9px;color:var(--muted);margin:6px 0 3px;font-weight:700;
       letter-spacing:.07em;text-transform:uppercase;line-height:1.35}
  input.t,textarea.t,select.t{border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:12px;
       width:100%;font-family:inherit;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
  textarea.t{resize:vertical;min-height:38px;line-height:1.4}
  input.t:focus,textarea.t:focus,select.t:focus,.hsq:focus{outline:none;border-color:var(--brand2);
       box-shadow:0 0 0 3px rgba(29,78,216,.13)}
  .sect{border-top:1px solid var(--line);margin-top:12px;padding-top:9px}
  .sect h3{margin:0 0 2px;font-size:12px;font-weight:700}
  .sect .sub{font-size:10.5px;color:var(--muted);margin:0 0 7px;line-height:1.45}
  .req label.f::after{content:" *";color:var(--brand)}
  .critical .fbox{border:1px solid var(--line);border-radius:9px;padding:7px 9px 9px;background:#fff}
  .critical .fbox:hover{border-color:var(--line2)}
  .critical .fbox:focus-within{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(29,78,216,.11)}
  .critical .fbox > label.f:first-child{margin-top:0}
  .critical input.t,.critical textarea.t,.critical select.t{font-weight:600}
  .critical input.t::placeholder,.critical textarea.t::placeholder{font-weight:400;color:#a8b0bd}
  .critical .cbox{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:11px;
        font-weight:600;border:1px solid #f0d78a;background:#fffbeb;border-radius:9px;
        padding:7px 9px;color:var(--ink2);line-height:1.4}
  .critical .sect h3{display:flex;align-items:center;gap:7px}
  .critical .sect h3::before{content:"";width:3px;height:12px;border-radius:2px;background:#b91c1c}

  /* ===================== decision queue ================================= */
  .dq{display:flex;flex-direction:column;gap:6px;margin-top:9px}
  .dqcase{background:#fff;border:1px solid var(--line);border-left:3px solid var(--line2);
       border-radius:10px;padding:8px 11px;cursor:pointer;transition:.15s}
  .dqcase.blk{border-left-color:var(--block)}
  .dqcase.wrn{border-left-color:var(--warn)}
  .dqcase:hover{border-color:var(--line2)}
  .dqcase.on{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(29,78,216,.13);padding:10px 12px}
  .dqhead{display:flex;align-items:center;gap:9px;min-width:0}
  .dqnum{flex:none;width:17px;height:17px;border-radius:5px;background:var(--chip);color:var(--muted);
       font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
       font-variant-numeric:tabular-nums}
  .dqcase.on .dqnum{background:var(--brand2);color:#fff}
  .dqtitle{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
       white-space:nowrap}
  .dqcode{flex:none;font-size:9.5px;color:var(--muted);background:var(--chip)}
  .dqbody{padding-left:26px;margin-top:8px}
  .dqbody p{margin:0;font-size:11.5px;color:var(--ink3);line-height:1.6;max-width:660px}
  .dqacts{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .dqacts .btn{padding:6px 12px}
  .dqhint{font-size:10px;color:var(--muted)}
  .dqnote{font-size:10px;color:var(--muted);font-style:italic}

  /* answering in place: the choice row, the typed answer, the affected rows */
  .dqchoice{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .dqanswer{margin-top:9px}
  .cbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:#fff;
       color:var(--ink2);border-radius:7px;padding:6px 11px;font-size:11.5px;font-weight:600;
       font-family:inherit;cursor:pointer;font-variant-numeric:tabular-nums;transition:.15s}
  .cbtn:not(:disabled):hover{border-color:var(--brand2);color:var(--brand2)}
  .cbtn:disabled{opacity:.45;cursor:not-allowed}
  .cbtn.star{border-color:var(--brand2);background:#eff6ff;color:var(--brand2)}
  .cbtn .ckey{font-size:8.5px;font-weight:700;opacity:.6;border:1px solid currentColor;
       border-radius:4px;padding:0 4px;line-height:1.5}
  .cands{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
  .cand{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;
       color:var(--ink2);border-radius:7px;padding:3px 9px;font-size:11px;font-weight:600;
       font-family:inherit;cursor:pointer;font-variant-numeric:tabular-nums}
  .cand:not(:disabled):hover{border-color:var(--brand2);color:var(--brand2)}
  .cand:disabled{opacity:.5;cursor:not-allowed}
  .cand.on{border-color:var(--ok);background:var(--okbg);color:#065f46}
  .cand .csrc{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
       font-weight:700}
  .cand.on .csrc{color:#047857}

  .qrows{display:flex;flex-direction:column;gap:4px;margin-top:4px;max-width:760px}
  .qrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;
       padding:4px 8px;background:#fff;min-width:0}
  .qrow .qsn{flex:none;font-size:9.5px;font-weight:700;color:var(--muted);
       font-variant-numeric:tabular-nums;width:44px}
  .qrow .qdesc{flex:1;min-width:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qrow .qhs{flex:none;font-size:10px;background:var(--chip)}
  .qrow .qhs.bad{background:var(--blockbg);color:#7f1d1d}
  .qrow .qsearch{flex:none;width:190px}
  .qmore{font-size:10px;color:var(--muted);padding:2px 4px}
  .qnotelist{display:flex;flex-direction:column;gap:3px;max-width:760px}
  .qnoteline{font-size:11px;color:var(--ink3);line-height:1.5;border-left:2px solid #f0d78a;
       padding-left:8px}
  .qnoteline b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* the way back from the cases that still need their own screen */
  .qback{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--brand2);
       background:#f5f8ff;color:var(--brand2);border-radius:7px;padding:4px 10px;font-size:11px;
       font-weight:600;font-family:inherit;cursor:pointer;margin:0 0 9px}
  .qback:hover{background:#e8f0ff}

  /* what the engine already decided — quiet, but one click from its evidence */
  .rbox{margin-top:13px;background:#fff;border:1px solid var(--line);border-radius:10px;
       padding:11px 13px;box-shadow:var(--shadow)}
  .rhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;font-weight:600}
  .rvals{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:6px;margin-top:9px}
  .rval{display:block;text-align:left;border:1px solid var(--line);border-radius:8px;padding:6px 9px;
       background:#fff;font-family:inherit;cursor:pointer;min-width:0;transition:.15s}
  .rval:not(:disabled):hover{border-color:var(--brand2)}
  .rval:disabled{cursor:default;opacity:.75}
  .rval span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rval .rk{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .rval .rv{font-size:12px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .rval .rs{font-size:9.5px;color:var(--muted);margin-top:1px}

  /* ===================== finalize pre-flight ============================ */
  .pflight{border:1px solid var(--line);border-radius:9px;background:#fafbfc;padding:4px 10px;
       margin:0 0 11px}
  .pfrow{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:11.5px;line-height:1.45;
       border-bottom:1px solid var(--line)}
  .pfrow:last-child{border-bottom:0}
  .pfrow > span{min-width:0;flex:1}
  .pfrow s{flex:none;width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;
       justify-content:center;font-size:9.5px;text-decoration:none;font-weight:700}
  .pfrow.ok s{background:#dcfce7;color:#065f46}
  .pfrow.ok{color:var(--ink2)}
  .pfrow.no s{background:#fee2e2;color:#7f1d1d}
  .pfrow.no{color:#7f1d1d;font-weight:600}
  .pfrow.w s{background:#fef3c7;color:#78350f}
  .pfrow.w{color:#78350f}
  .pfrow .ichip{flex:none}

  /* ===================== messages, pills ================================ */
  .msg{padding:7px 10px;border-radius:8px;font-size:11.5px;margin:5px 0;border:1px solid;line-height:1.45}
  .msg.b{background:var(--blockbg);border-color:#fca5a5;color:#7f1d1d;border-left-width:3px}
  .msg.w{background:var(--warnbg);border-color:#f0d78a;color:#78350f;border-left-width:3px}
  .msg.ok{background:var(--okbg);border-color:#a7f3d0;color:#065f46;border-left-width:3px}
  /* a warning shows its code; the full engine text is one click away */
  details.msg summary{color:inherit;font-size:inherit;font-weight:600}
  details.msg[open] summary{margin-bottom:4px}
  .pill{display:inline-block;font-size:9.5px;padding:2px 7px;border-radius:999px;background:var(--chip);
        color:var(--ink3);font-weight:700;letter-spacing:.04em}
  .pill.ok{background:#dcfce7;color:#065f46}
  .pill.no{background:#fee2e2;color:#7f1d1d}
  .lowchip{background:#fef3c7;color:#78350f;border-radius:999px;font-size:8px;
       padding:0 4px;margin-left:3px;font-weight:700;vertical-align:middle}
  .qnotes{margin:5px 0}
  .qnotes > summary{cursor:pointer;font-size:11px;color:var(--ink3);padding:3px 2px;
        user-select:none;font-weight:600}
  .qnotes > summary:hover{color:var(--brand2)}
  .rowwarn{margin-left:2px;cursor:help}
  .idot{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
        border-radius:50%;border:1px solid var(--brand2);background:#fff;color:var(--brand2);
        font-size:9.5px;font-weight:700;font-family:inherit;line-height:1;padding:0;flex:none;
        cursor:pointer;vertical-align:middle}
  .idot:hover,.idot[aria-expanded="true"]{background:var(--brand2);color:#fff}
  .inote{border:1px solid var(--line);border-left:3px solid var(--brand2);border-radius:8px;
        background:#f8f9fb;padding:7px 10px;margin:5px 0 8px;font-size:11px;line-height:1.55;color:var(--ink3)}
  .inote b{color:var(--ink)}
  .inote .ilink{display:block;margin-top:6px;background:none;border:0;padding:0;color:var(--brand2);
        font-size:10.5px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:underline}

  /* ============= detailed review: row queues (search + buckets) ========== */
  .ifilter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 2px;
       padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fafbfc}
  .isearch{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:11.5px;
       font-family:inherit;background:#fff;color:var(--ink);width:236px;flex:none}
  .isearch:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(29,78,216,.13)}
  .ichips{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
  .ichip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:#fff;
       color:var(--ink2);border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:600;
       font-family:inherit;cursor:pointer;line-height:1.6;transition:.15s}
  .ichip b{font-variant-numeric:tabular-nums;font-size:9.5px;background:var(--chip);color:var(--ink3);
       border-radius:999px;padding:0 5px;font-weight:700}
  .ichip:not(:disabled):hover{border-color:var(--brand2);color:var(--brand2)}
  .ichip:disabled{opacity:.45;cursor:not-allowed}
  .ichip.w:not(:disabled) b{background:#fef3c7;color:#78350f}
  .ichip.no:not(:disabled) b{background:#fee2e2;color:#7f1d1d}
  .ichip.on{background:#14181f;border-color:#14181f;color:#fff}
  .ichip.on b{background:rgba(255,255,255,.18);color:#fff}
  .ichip.clr{border-style:dashed}
  .icount{margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;
       white-space:nowrap}
  .icount b{color:var(--brand2)}
  .ichip.need{border-color:#fca5a5;background:var(--blockbg);color:#7f1d1d}
  .ichip.need b{background:#fee2e2;color:#7f1d1d;text-transform:uppercase;letter-spacing:.05em;font-size:8.5px}
  .ichip.need:not(:disabled):hover{border-color:var(--block);color:var(--block)}

  /* ============= critical review: field grid ============================= */
  /* One 12-column grid for every section of the form.  Each box declares the
     width its CONTENT needs, so an alpha-2 country code no longer occupies the
     same third of the screen as a multi-line address and rows pack instead of
     stretching.  align-items:start keeps a one-line field from being stretched
     to the height of the textarea beside it, and grid placement makes two
     boxes overlapping impossible by construction. */
  .fgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:9px;align-items:start}
  .fgrid > .fbox{grid-column:span 4}                 /* default: a third */
  .fgrid > .s2{grid-column:span 2}                   /* alpha-2, currency, digit codes */
  .fgrid > .s3{grid-column:span 3}                   /* short codes, units, dates, amounts */
  .fgrid > .s4{grid-column:span 4}
  .fgrid > .s5{grid-column:span 5}
  .fgrid > .s6{grid-column:span 6}                   /* half: long reference text */
  .fgrid > .s8{grid-column:span 8}                   /* composite: field + choices + confirm */
  .fgrid > .s9{grid-column:span 9}
  .fgrid > .s12{grid-column:span 12}                 /* full: multi-line text */
  @media(max-width:1180px){
    .fgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
    .fgrid > .fbox{grid-column:span 3}
    .fgrid > .s2{grid-column:span 2}
    .fgrid > .s3{grid-column:span 2}
    .fgrid > .s4,.fgrid > .s5,.fgrid > .s6{grid-column:span 3}
    .fgrid > .s8,.fgrid > .s9,.fgrid > .s12{grid-column:span 6}
  }
  @media(max-width:700px){
    .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .fgrid > .fbox,.fgrid > .s2,.fgrid > .s3,.fgrid > .s4,
    .fgrid > .s5,.fgrid > .s6{grid-column:span 1}
    .fgrid > .s8,.fgrid > .s9,.fgrid > .s12{grid-column:span 2}
  }
  /* two inputs that belong to one label (currency + date, type + code) */
  .fpair{display:flex;gap:7px;align-items:center}
  .fpair input.t{min-width:0}

  /* exporter and importer are two parties, not one block of eight fields */
  .party{border:1px solid var(--line);border-radius:10px;padding:9px 11px 11px;
       background:#fcfdfe;margin-top:9px}
  .party > h4{margin:0 0 8px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
       font-weight:800;color:var(--ink2);display:flex;align-items:center;gap:7px}
  .party > h4::before{content:"";width:3px;height:11px;border-radius:2px;background:var(--brand2)}
  .party.imp > h4::before{background:var(--brand)}
  .party > h4 .pnote{font-weight:600;letter-spacing:0;text-transform:none;font-size:10px;
       color:var(--muted)}

  /* ============= critical review: section index + jump flash ============= */
  .crnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px;padding:7px 9px;
       border:1px solid var(--line);border-radius:9px;background:#fafbfc}
  .crlbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
       font-weight:700;margin-right:2px}
  @keyframes ec-flash{0%{background:#fffbeb;box-shadow:0 0 0 3px rgba(240,215,138,.55)}
                      100%{background:transparent;box-shadow:0 0 0 3px rgba(240,215,138,0)}}
  .sect.jumped{border-radius:9px;animation:ec-flash 1.4s ease-out}
  @media(prefers-reduced-motion:reduce){.sect.jumped{animation:none}}

  /* ============= detailed review: frozen SN + Description =============== */
  .dtable{table-layout:fixed;width:100%;font-size:10.5px;margin-top:7px}
  .dtable th,.dtable td{padding:3px 4px;border-bottom:1px solid #f2f4f7;text-align:left;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dtable td{font-variant-numeric:tabular-nums}
  /* Description is the one column that must never be cut: a long item name
     wraps onto as many lines as it needs, and the row grows to fit it. */
  .dtable td.desc{white-space:normal;overflow:visible;text-overflow:clip;
       overflow-wrap:anywhere;word-break:break-word;line-height:1.35;font-weight:500}
  .dtable td.act{white-space:nowrap;overflow:visible;text-overflow:clip;line-height:1.7}
  .dtable th{color:var(--muted);font-weight:700;font-size:8.5px;text-transform:uppercase;
       letter-spacing:.07em;position:sticky;top:calc(var(--facts) + 40px);background:#fafbfc;z-index:6;
       border-bottom:1px solid var(--line)}
  .dtable .num{text-align:right}
  .dtable td.hs{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px}
  .dtable tbody tr:hover td{background:#f6f8fc}
  .dtable tr.nohs td{background:#fffaf3}
  .dtable tr.newrow td{background:#ecfdf5}
  .dtable tr.man td:first-child{box-shadow:inset 3px 0 0 var(--brand2)}
  .dtable .sbtn{border:1px solid var(--line2);background:var(--chip);border-radius:5px;
       padding:0 5px;font-size:10px;cursor:pointer;color:var(--ink3);font-family:inherit}
  .dtable .sbtn:hover{border-color:var(--brand2);color:var(--brand2)}
  .dtable .sbtn:disabled{cursor:not-allowed;opacity:.55}
  .dtable tfoot td{font-weight:700;background:#f4f6f9;border-top:1px solid var(--line2);
       border-bottom:0;color:var(--ink)}
  /* scoped to the 15-column item grid (the only .dtable carrying a td.act) */
  .dtable:has(td.act){border-collapse:separate;border-spacing:0}
  /* a wrapped description makes the row taller — everything else on the row
     stays aligned with its first line instead of drifting to the middle */
  .dtable:has(td.act) td{vertical-align:top}
  .dtable:has(td.act) colgroup col:nth-child(1){width:32px}
  .dtable:has(td.act) colgroup col:nth-child(2){width:180px}
  .dtable:has(td.act) th:nth-child(1),.dtable:has(td.act) td:nth-child(1){position:sticky;left:0;z-index:7;background:#fff}
  .dtable:has(td.act) th:nth-child(2),.dtable:has(td.act) td:nth-child(2){position:sticky;left:32px;z-index:7;
       background:#fff;box-shadow:1px 0 0 var(--line)}
  .dtable:has(td.act) th:nth-child(1),.dtable:has(td.act) th:nth-child(2){z-index:9;background:#fafbfc}
  .dtable:has(td.act) tfoot td{position:sticky;bottom:0;z-index:8}

  .hsq{font-size:10px;padding:2px 5px;border:1px solid var(--line2);border-radius:5px;
       width:100%;font-family:inherit;background:#fff;color:var(--ink)}
  .hsq:disabled{opacity:.55}
  .hspanel{z-index:60;background:var(--panel);border:1px solid var(--line2);border-radius:10px;
       box-shadow:0 12px 34px rgba(20,24,31,.22);overflow:hidden;white-space:normal}
  .hsstatus{font-size:10px;color:var(--muted);padding:5px 9px;border-bottom:1px solid var(--line)}
  .hslist{list-style:none;margin:0;padding:0;max-height:280px;overflow:auto}
  .hsopt{padding:5px 9px;border-bottom:1px solid var(--line);cursor:pointer}
  .hsopt.act{background:#f5f8ff}
  .hstop{display:flex;gap:7px;align-items:center;font-size:10.5px}
  .hsunit{color:var(--brand2);font-weight:700;font-size:9.5px}
  .hsscore{margin-left:auto;color:var(--muted);font-size:9px}
  .hsdesc{font-size:10px;margin-top:1px;line-height:1.4}
  .hsexp{font-size:9px;color:var(--muted);margin-top:1px}

  /* ===================== dialogs ======================================== */
  .overlay{position:fixed;inset:0;background:rgba(20,24,31,.5);display:flex;
       align-items:center;justify-content:center;z-index:60;padding:16px}
  .dlg{background:var(--panel);border-radius:12px;padding:16px 18px;width:min(680px,95vw);
       max-height:90vh;overflow:auto;box-shadow:0 18px 46px rgba(20,24,31,.34)}
  .dlg h3{margin:0 0 4px;font-size:14px;font-weight:600}
  .dlg .sub{font-size:11px;color:var(--ink3);margin:0 0 9px;line-height:1.5}
  .dlg .grid3{gap:7px}

  /* ===================== live activity ================================== */
  @keyframes ec-spin{to{transform:rotate(360deg)}}
  @keyframes ec-pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes ec-sweep{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
  .spin{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;
        border:2px solid rgba(29,78,216,.2);border-top-color:var(--brand2);
        animation:ec-spin .75s linear infinite;vertical-align:-2px}
  .spin.lg{width:17px;height:17px;border-width:3px}
  .spin.w{border-color:rgba(180,83,9,.2);border-top-color:var(--warn)}
  .spin.on{border-color:rgba(255,255,255,.3);border-top-color:#fff}
  .runbar{display:flex;align-items:center;gap:9px}
  .runbar .rt{font-weight:800;letter-spacing:.06em;font-size:10.5px}
  .runtrack{height:3px;border-radius:999px;background:rgba(180,83,9,.15);overflow:hidden;margin-top:6px}
  .runtrack i{display:block;width:26%;height:100%;border-radius:999px;
        background:linear-gradient(90deg,#f59e0b,#b45309);animation:ec-sweep 1.5s ease-in-out infinite}
  .livedot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#34d399;
        box-shadow:0 0 0 3px rgba(52,211,153,.2);animation:ec-pulse 1.8s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){.spin,.runtrack i,.livedot,.ec-rail .ec-live s{animation:none}}

  /* ===================== guide ========================================== */
  .gitem{border:1px solid var(--line);border-radius:9px;margin-bottom:7px;overflow:hidden;background:#fff}
  .gitem.open{border-color:var(--brand2);box-shadow:0 3px 14px rgba(29,78,216,.09)}
  .gitem > button{width:100%;display:flex;align-items:center;gap:9px;text-align:left;
        background:#fafbfc;border:0;padding:9px 11px;font-size:12px;font-weight:700;
        cursor:pointer;color:var(--ink);font-family:inherit}
  .gitem > button:hover{background:#f2f6ff}
  .gitem .gcar{margin-left:auto;color:var(--muted);font-size:11px;font-weight:600}
  .gbody{padding:10px 12px 12px;font-size:11.5px;line-height:1.6;color:var(--ink3);
        border-top:1px solid var(--line)}
  .gbody b{color:var(--ink)}
  .gbody p{margin:0 0 4px}
  .gbody h4{margin:11px 0 4px;font-size:9.5px;font-weight:800;color:var(--brand2);
        text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:7px}
  .gbody h4::after{content:"";flex:1;height:1px;background:var(--line)}
  .gbody ul{margin:0;padding-left:16px}
  .gbody li{margin:3px 0}
  .gbody li::marker{color:var(--brand2)}

  /* ===================== evidence viewer ================================ */
  .docpanel{position:fixed;top:0;right:0;bottom:0;width:min(38vw,600px);z-index:46;
       background:var(--panel);border-left:1px solid var(--line);display:flex;
       flex-direction:column;box-shadow:-12px 0 34px rgba(20,24,31,.16)}
  .dochead{display:flex;align-items:center;gap:7px;padding:7px 11px;
       border-bottom:1px solid var(--line);background:#fff;flex:none;flex-wrap:wrap}
  .dochead .dtitle{font-size:11.5px;font-weight:600;min-width:0;overflow:hidden;
       text-overflow:ellipsis;white-space:nowrap;flex:1}
  .dochead .dwhere{font-size:10px;color:var(--brand2);font-weight:700;flex:none}
  .docchips{display:flex;gap:5px;padding:6px 11px;border-bottom:1px solid var(--line);
       flex-wrap:wrap;flex:none;background:#fff}
  .docchip{border:1px solid var(--line2);background:var(--chip);border-radius:999px;
       padding:2px 9px;font-size:10px;cursor:pointer;color:var(--ink2);font-family:inherit;font-weight:600}
  .docchip.act{background:var(--brand2);border-color:var(--brand2);color:#fff}
  .docchip:hover:not(.act){border-color:var(--brand2);color:var(--brand2)}
  /* Demo marking. Amber rather than red: a demo job is not an error, it just
     must never be read as a shipment. */
  .demopill{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:999px;
       background:#fef3c7;color:#78350f;border:1px solid #fcd34d;
       font-size:9.5px;font-weight:800;letter-spacing:.6px;vertical-align:middle}
  .demobanner{margin:0 0 14px;padding:10px 13px;border-radius:10px;font-size:12.5px;
       line-height:1.5;background:#fffbeb;border:1px solid #fcd34d;color:#78350f}
  .demobanner b{letter-spacing:.3px}
  .docframe{flex:1;border:0;width:100%;background:#4a4e57}
  /* Shown INSTEAD of the frame when the stored file cannot be served — a blank
     panel is indistinguishable from a slow one, so the reason goes on screen. */
  .docerr{flex:1;display:flex;flex-direction:column;justify-content:center;gap:9px;
       padding:22px 20px;background:#4a4e57;color:#f2f4f7;font-size:12px;line-height:1.5}
  .docerr .dehead{font-weight:700;font-size:12.5px}
  .docerr .decode{font-size:10px;opacity:.72;font-family:ui-monospace,Menlo,Consolas,monospace}
  .docnote{font-size:10px;color:var(--muted);padding:6px 11px;border-top:1px solid var(--line);
       background:#fff;flex:none;line-height:1.45}
  main.with-viewer{max-width:none;margin-left:14px;margin-right:calc(min(38vw,600px) + 14px)}
  html.ec-on main.with-viewer{margin-left:0}
  html.ec-on .ec-facts{right:0}
  @media(max-width:1000px){
    .docpanel{width:100vw}
    main.with-viewer{margin-left:auto;margin-right:auto}
  }

  /* ===================== sign in ======================================== */
  .loginpage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
       background:#14181f;position:relative;overflow:hidden}
  .loginpage::before{content:"";position:absolute;left:50%;top:-160px;width:620px;height:620px;
       transform:translateX(-50%);border-radius:50%;
       background:radial-gradient(circle,rgba(185,28,28,.34),transparent 62%)}
  .logincard{background:var(--panel);border-radius:12px;padding:22px 22px;width:100%;max-width:360px;
       box-shadow:0 20px 50px rgba(0,0,0,.4);position:relative;z-index:1}
  .logincard h1{margin:0;font-size:16px;font-weight:700}
  .logincard .sub{color:var(--ink3);font-size:11.5px;margin:6px 0 14px;line-height:1.45}
  .logincard label{display:block;font-size:9px;font-weight:700;color:var(--muted);margin:10px 0 4px;
       letter-spacing:.07em;text-transform:uppercase}
  .logincard input{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:7px;
       font-size:13px;font-family:inherit;color:var(--ink)}
  .logincard input:focus{outline:0;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(29,78,216,.13)}
  .logincard .btn{width:100%;margin-top:14px;padding:9px;background:#14181f}

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useCallback} = React;
const API = ""; // same origin (served by FastAPI)

async function api(path, opts){
  // A path segment that is literally "undefined"/"null" means the caller lost
  // its job id.  Sent as-is the URL reads /api/jobs/undefined and comes back a
  // server 404 ("job not found") — an answer that blames the server for a hole
  // on this side and reads, to a reviewer, as lost work.  Fail here instead,
  // where the cause is still legible.
  if(/\/(undefined|null)(\/|$)/.test(path))
    throw new Error(`the page lost its job reference (${path}) — reload and attach the file again`);
  // A traversal segment can only get here from a value that was never a job id
  // (readJobFromLocation now refuses those at the door).  Refusing it a second
  // time costs nothing and means no future caller can reintroduce the hole by
  // interpolating something unvalidated: the browser resolves `..` BEFORE it
  // sends, so the request would leave for a path no caller ever named.
  if(/(^|\/)\.\.(\/|$)/.test(path))
    throw new Error(`refusing a request for an unexpected path (${path})`);
  const r = await fetch(API + path, opts);
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  // The session ended (24h token expired, or the server was restarted without
  // a fixed EASYCUSTOMS_AUTH_SECRET).  Every caller would otherwise render its
  // own private "failed" state for the same one cause; tell the shell instead,
  // which swaps the whole page for the sign-in screen.
  if(r.status === 401){
    window.dispatchEvent(new CustomEvent("ec-auth-expired"));
    const e = new Error((body && body.detail) || "Your session has ended. Sign in to continue.");
    e.status = 401; e.body = body; throw e;
  }
  if(!r.ok && !(body && (body.blocking_errors || body.status))){
    // Carry the status and parsed body so callers can branch on WHAT failed —
    // a vanished job is recoverable, a 500 is not — instead of matching on the
    // message text.
    const e = new Error(typeof body==="string"?body:JSON.stringify(body));
    e.status = r.status; e.body = body; throw e;
  }
  return body;
}
// The reviewer gets the sentence, not the JSON envelope it travelled in.
function errText(e){
  const d = e && e.body && e.body.detail;
  return typeof d === "string" ? d : String((e && e.message) || e);
}
// The server has no such job: the id we hold is unusable and every retry that
// keeps it can only fail the same way.
function jobGone(e){ return !!e && e.status === 404 && /job not found/i.test(e.message || ""); }

// ---------------------------------------------------------------------- //
// Job persistence — the id lives in the URL (?job=…) only, so a reload or a
// copied link reopens the work the user deliberately had open.  The bare
// landing page NEVER auto-opens an existing job: no localStorage restore, no
// demo — it lands on a fresh empty workspace, and existing jobs open only
// when the user picks one (ALL JOBS dashboard click or explicit link).
// ---------------------------------------------------------------------- //
// Every job id the server issues is a UUID (models._uuid), and this value is
// spliced straight into request paths — `/api/jobs/${id}/critical-review` and
// friends.  searchParams.get() percent-DECODES, so `?job=..%2F..%2Fapi%2Fconfig`
// arrived here as a traversal segment that the browser then normalised away,
// pointing an authenticated request at a path nobody chose.  Validating the
// shape at the one place the value enters is worth more than encoding it at
// each of the call sites, which is a step someone eventually forgets.
const JOB_ID_RE = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;
function readJobFromLocation(){
  try{
    const q = new URL(window.location.href).searchParams.get("job");
    if(q && JOB_ID_RE.test(q)) return q;
  }catch(e){}
  return null;
}
function writeJobUrl(id){
  try{
    const u = new URL(window.location.href);
    if(id) u.searchParams.set("job", id); else u.searchParams.delete("job");
    history.replaceState(null, "", u);
  }catch(e){}
  // one-time cleanup of the retired last-session restore key
  try{ localStorage.removeItem("ec_last_job"); }catch(e){}
}

// ---------------------------------------------------------------------- //
// Links from the identity provider's emails land here as a URL FRAGMENT, and
// this reads it exactly ONCE, at module scope, before React mounts.
//
// WHY A FRAGMENT AT ALL.  A reset link arrives in an email, so the recovery
// token transits the user's browser whatever we do — the only way out of that
// is this app minting its own reset tokens, which means owning reset instead of
// letting the provider own it.  The provider's implicit flow puts the token
// after the '#', which is the least-bad place: a fragment is never sent to a
// server, so it appears in no access log and no Referer header.
//
// The trade, stated plainly: for the few milliseconds before the line below
// runs, the token is somewhere page scripts can read — the thing this app
// deliberately avoids for its OWN session, which lives in an HttpOnly cookie.
// It is acceptable here and not there because this token's entire power is "set
// this one account's password, once, within the hour". It cannot read a
// declaration, it is spent immediately, and it is never stored.
//
// AT MODULE SCOPE, not in a component, for three reasons.  It runs before the
// first render, so nothing can paint a URL still carrying a token.  It runs
// before Shell asks /api/auth/session, so a user who is ALREADY SIGNED IN gets
// the reset screen rather than the workspace with a live token in the address
// bar.  And it runs before writeJobUrl() can replaceState the fragment away
// without having read it.
// ---------------------------------------------------------------------- //
const EMAIL_LINK = (function(){
  let raw = "";
  try{ raw = (window.location.hash || "").replace(/^#/, ""); }catch(e){ return null; }
  if(!raw || raw.indexOf("=") < 0) return null;
  let p;
  try{ p = new URLSearchParams(raw); }catch(e){ return null; }
  const token = p.get("access_token") || "";
  const error = p.get("error") || p.get("error_code") || "";
  if(!token && !error) return null;              // somebody else's fragment
  // Stripped FIRST, and unconditionally — including for the kinds handled below
  // with no screen of their own. An expired confirmation link still carries a
  // real token, and the address bar is where URLs get copied into chat messages
  // and bug reports.
  try{ history.replaceState(null, "", window.location.pathname + window.location.search); }
  catch(e){}
  if(error) return {kind:"error",
                    detail:(p.get("error_description") || "").trim()
                           || "That link is no longer valid. Request a new one."};
  const type = p.get("type") || "";
  if(type === "recovery") return {kind:"recovery", token:token};
  // A confirmed signup redirects here the same way. There is nothing to do with
  // its token — this app's session comes from the password grant — so it is
  // discarded, and the only thing left to do is tell them they can sign in.
  if(type === "signup") return {kind:"confirmed"};
  return null;                                   // stripped, and nothing to say
})();

// ---------------------------------------------------------------------- //
// Engine identity — DISPLAY ONLY.
// The product never names the underlying vendors/models anywhere a user can
// see; it presents one engine. maskEngine() is a render-time filter applied
// to every server-sourced string shown on the page (warnings, errors, audit
// details) so a provider name inside an upstream message never leaks into the
// UI.  Nothing here touches extraction, rules or XML — the backend keeps its
// real provider configuration untouched.
// ---------------------------------------------------------------------- //
const ENGINE = "AINDA Customs Clearing Intelligence";
const ENGINE_SHORT = "AINDA Intelligence";
const ENGINE_RUNNING = "AINDA CUSTOMS CLEARING INTELLIGENCE RUNNING";
// Deliberately narrow: only the vendors/models this backend can actually be
// configured with, plus their model-id shapes.  Broad brand words (a country,
// a trader name, a street) must never be rewritten — these strings can quote
// item descriptions and party addresses back to the reviewer.
const _VENDOR_RE = new RegExp(
  "\\b(?:mistral(?:[-\\s]?ocr)?(?:[-\\w.]+)?"
  + "|(?:azure[-\\s]?)?open\\s?ai"
  + "|gpt[\\w.]*(?:-[\\w.]+)*"
  + "|o[1-9]-(?:mini|preview)(?:-[\\w.]+)*"
  + "|langroid|anthropic)\\b", "gi");
function maskEngine(v){
  if(v === null || v === undefined) return v;
  const s = String(v);
  if(!_VENDOR_RE.test(s)){ _VENDOR_RE.lastIndex = 0; return s; }
  _VENDOR_RE.lastIndex = 0;
  return s.replace(_VENDOR_RE, ENGINE_SHORT)
          // "Mistral+Langroid" / "Mistral OCR + OpenAI" collapse to one name
          .replace(new RegExp(`${ENGINE_SHORT}(?:\\s*[+/&,·-]\\s*|\\s+)${ENGINE_SHORT}`, "g"), ENGINE_SHORT);
}
// Rotating ring — the user-visible proof that the system is working.
function Spin({size, tone}){
  return <span className={"spin"+(size==="lg"?" lg":"")+(tone?" "+tone:"")} role="status" aria-label="working"/>;
}

const ROLES = [
  {id:"INVOICE", label:"Commercial Invoice", req:true, tag:"final goods invoice"},
  {id:"PACKING_LIST", label:"Packing List", req:false, tag:"optional — absent: weights split by quantity share"},
  {id:"AIR_WAYBILL", label:"Air Waybill / BL", req:false, tag:"optional — absent: enter weight/ctn/AWB/BL manually"},
  {id:"BANKING", label:"Banking / LC", req:false, tag:"optional — absent: enter bank fields manually"},
  {id:"INSURANCE", label:"Insurance", req:false, tag:"optional"},
  {id:"CERTIFICATE_OF_ORIGIN", label:"Certificate of Origin", req:false, tag:"optional"},
];
// Only the invoice is compulsory (user rule 2026-07-17): absent packing/AWB/
// banking degrade to deterministic fallbacks + manual review entries.
const REQUIRED = ["INVOICE"];


function Messages({items}){
  if(!items || !items.length) return null;
  // The code IS the message on this surface — the engine's full sentence stays
  // one click away rather than on screen (per-job facts are kept, not shown).
  return items.map((m,i)=>{
    const cls = "msg "+(m.severity==="BLOCKING"?"b":"w");
    const head = <React.Fragment><b>{m.code}</b>{m.item_sequence?` (item ${m.item_sequence})`:""}</React.Fragment>;
    return m.message
      ? <details key={i} className={cls}><summary>{head}</summary>{maskEngine(m.message)}</details>
      : <div key={i} className={cls}>{head}</div>;
  });
}

// ---------------------------------------------------------------------- //
// Critical-review warnings, ranked instead of stacked.  A trained reviewer
// does not need the wall of notes the engine emits on every job — but the
// notes are per-job FACTS, not prose, so none of them is dropped:
//
//   loud     blockers and anything the reviewer must still act on
//   anchored notes that name specific SNs — collapsed here, and the rows
//            themselves carry ⚠ in Detailed Review, where they are actionable
//   quiet    the engine telling you it filled a gap itself (an inferred
//            weight column, a fallback AWB, a litre proxy).  Collapsed, never
//            removed: a silent assumption is exactly what puts wrong numbers
//            on a declaration, so it stays one click away.
//
// The set below is an explicit allowlist on purpose — a warning code that is
// not listed stays loud, so a new backend code can never be hidden by accident.
// ---------------------------------------------------------------------- //
const ASSUMPTION_CODES = new Set([
  "AWB_FALLBACK", "AWB_HOUSE_INFERRED",
  "PACKING_WEIGHT_TYPE_INFERRED", "PACKING_FALLBACK", "PACKING_PARTIAL_FALLBACK",
  "PACKING_TIMEOUT_FALLBACK", "PACKING_DOC_MISSING",
  "BANKING_DOC_MISSING", "TRANSPORT_DOC_MISSING",
  "SUPPLEMENTARY_ASSUMPTION", "COO_EXPORTER_FALLBACK", "PAYMENT_TERMS_DEFAULTED",
]);
// The server groups a repeated item message into one line naming every SN
// ("6 item(s) — SN 3, 20, 25. …" — see _grouped_item_messages).  Reading the
// SNs back out is what lets the row carry its own marker; if the shape ever
// changes the row simply shows no ⚠ and the note stays in the list below.
const _SN_GROUP_RE = /item\(s\)\s*—\s*SN\s*([\d,\s]+)/;

function itemNotesBySn(msgs){
  const map = new Map();
  const add = (sn, m)=>{ const k = String(sn||"").trim(); if(!k) return;
                         if(!map.has(k)) map.set(k, []); map.get(k).push(m); };
  for(const m of msgs||[]){
    if(m.item_sequence){ add(m.item_sequence, m); continue; }
    const hit = _SN_GROUP_RE.exec(m.message||"");
    if(hit) hit[1].split(",").forEach(s=>add(s, m));
  }
  return map;
}

function ReviewWarnings({items}){
  if(!items || !items.length) return null;
  const loud = [], anchored = [], quiet = [];
  for(const m of items){
    if(m.severity==="BLOCKING"){ loud.push(m); continue; }          // never hidden
    if(ASSUMPTION_CODES.has(m.code)){ quiet.push(m); continue; }
    if(m.item_sequence || _SN_GROUP_RE.test(m.message||"")){ anchored.push(m); continue; }
    loud.push(m);
  }
  return (<React.Fragment>
    <Messages items={loud}/>
    {anchored.length>0 && <details className="qnotes">
      <summary>⚠ {anchored.length} item note(s) — the rows are marked ⚠ in Detailed Review below</summary>
      <Messages items={anchored}/></details>}
    {quiet.length>0 && <details className="qnotes">
      <summary>ⓘ {quiet.length} assumption note(s) — values the engine filled in itself because the documents did not carry them</summary>
      <Messages items={quiet}/></details>}
  </React.Fragment>);
}

// A reviewer's entered item values are ALWAYS accepted (user rule 2026-08-03).
// When their pins cannot fit the authorised shipment totals, the thing that has
// to give way is the AUTHORITY, not the numbers a person typed after reading the
// document.  The engine already computed what the total would have to become and
// puts it in `remediation`, so offer it here as one decision instead of sending
// the reviewer back to Step 2 to work it out again.
//
// Nothing is applied automatically.  A declaration's total gross weight and
// package count must never move as a side effect of editing one row — this is a
// prefilled, editable proposal that goes through the same audited
// shipment-totals endpoint as the Step 2 form.
// GROSS_ALLOCATION_IMPOSSIBLE belongs here too: by the time it fires, every
// surviving net is a STATED value — an invoice weight, a mass unit of sale, a
// packing net or a reviewer pin — because a description-parsed net was already
// dropped upstream.  Same principle, one step further out than a pin.
const _PIN_CONFLICT_CTN = new Set(["REVIEWED_CTN_EXCEEDS_AUTHORITY", "REVIEWED_CTN_TOTAL_MISMATCH"]);
const _PIN_CONFLICT_GROSS = new Set(["REVIEWED_GROSS_EXCEEDS_AUTHORITY", "REVIEWED_GROSS_TOTAL_MISMATCH",
                                     "GROSS_ALLOCATION_IMPOSSIBLE"]);
const _REVIEWER_CONFLICT = /^REVIEWED_/;
const _REMEDIATION_NUM = /([\d]+(?:\.[\d]+)?)/;

function PinConflictBanner({review, busy, onApply}){
  const blocking = (review.warnings||[]).filter(m=>m.severity==="BLOCKING");
  const hit = code => blocking.find(m=>code.has(m.code));
  const ctnMsg = hit(_PIN_CONFLICT_CTN), grossMsg = hit(_PIN_CONFLICT_GROSS);
  // the engine's own figure first; the item column sum is the fallback
  const rows = review.item_details||[];
  const sum = k => rows.reduce((a,r)=>a+(Number(r[k])||0), 0);
  const suggest = (msg, col, dp) => {
    if(!msg) return null;
    const m = _REMEDIATION_NUM.exec(msg.remediation||"");
    const v = m ? Number(m[1]) : sum(col);
    // an infeasible allocation blanks the column, so the fallback sum is 0 —
    // never propose a total the endpoint will reject as not-greater-than-zero
    if(!isFinite(v) || v<=0) return null;
    return String(Math.round(v*Math.pow(10,dp))/Math.pow(10,dp));
  };
  const wantG = suggest(grossMsg, "gross", 3), wantP = suggest(ctnMsg, "ctn", 2);
  const [g,setG] = React.useState("");
  const [p,setP] = React.useState("");
  React.useEffect(()=>{
    setG(wantG!==null?wantG:String(review.gross_weight||""));
    setP(wantP!==null?wantP:String(review.total_packages||""));
  }, [wantG, wantP, review.gross_weight, review.total_packages]);
  if(!ctnMsg && !grossMsg) return null;
  const what = [grossMsg?"gross weight":null, ctnMsg?"cartons":null].filter(Boolean).join(" and ");
  // "your entered values" is only true when EVERY conflict came from a
  // REVIEWED_ code.  An infeasible allocation is the documents' own figures
  // overrunning, and a MIXED case (a carton pin beside a document weight
  // overrun) is both — telling someone they typed a gross weight they never
  // touched sends them hunting for an edit that does not exist.
  const live = [ctnMsg, grossMsg].filter(Boolean);
  const mine = live.filter(m=>_REVIEWER_CONFLICT.test(m.code)).length;
  return (<div className="msg b" style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
    <span style={{flex:"1 1 100%"}}>
      {mine === live.length
        ? <React.Fragment><b>Your entered item {what} are kept exactly.</b> They do not fit the
            current shipment totals, so the totals are what has to change. Check these figures and
            apply them as the final shipment authority — or lower the pinned rows instead.
          </React.Fragment>
        : mine === 0
        ? <React.Fragment><b>The item {what} stated on your documents do not fit the shipment
            totals.</b> Nothing was assigned, which is why those columns are blank. The stated
            figures are not the thing to change — check the total below and apply it as the final
            shipment authority, or correct the item weights that are wrong.
          </React.Fragment>
        : <React.Fragment><b>The item {what} do not fit the shipment totals.</b> Both the values
            you entered and the figures stated on your documents are kept exactly, so the totals
            are what has to change. Check them below and apply them as the final shipment
            authority — or correct the individual rows instead.
          </React.Fragment>}
    </span>
    {/* kg, always: the engine's remediation and the item Gross column are both
        kilograms, so the value is POSTED as KGM rather than under the
        shipment's own unit — see applyShipmentTotals. */}
    <label className="f" style={{margin:0}}>Total gross weight (kg)</label>
    <input className="t" style={{width:130}} value={g} disabled={!!busy}
           onChange={e=>setG(e.target.value)}/>
    <label className="f" style={{margin:0}}>Total packages</label>
    <input className="t" style={{width:110}} value={p} disabled={!!busy}
           onChange={e=>setP(e.target.value)}/>
    <button className="btn" disabled={!!busy} onClick={()=>onApply(g, p, "KGM")}>
      {busy==="item"?"Applying…":"Apply as shipment totals"}</button>
  </div>);
}

// Deterministic Field 9 preview — mirrors the server's compose_field9 so the
// editable box (when NOT overridden) shows EXACTLY what finalize will emit,
// including the Bill of Lading line and any in-form MAWB/HAWB/bank edits.
const _BANK9_PREFIX = {"200":"LC NO","400":"TT REF","700":"CAD REF","906":"DA REF","600":"DAP REF","999":"FOC"};
// "AWB" or "BL" — mirrors the server's transport_doc_type(). A bill of lading
// uploaded INSTEAD OF an air waybill makes Field 9 print B/L NO / B/L DATE.
function transportDocType(rv, review){
  const explicit = (rv.transport_doc_type||"").toUpperCase();
  if(explicit === "AWB" || explicit === "BL") return explicit;
  if((review||{}).shipment_authority_type === "BILL_OF_LADING") return "BL";
  return (rv.bill_of_lading_no||"").trim() && !((rv.mawb_no||"").trim() || (rv.hawb_no||"").trim())
    ? "BL" : "AWB";
}
// Mirrors dates.fmt_dd_mmm_yyyy for the formats a reviewer types by hand; an
// unrecognised string passes through unchanged, exactly as the server does.
const _MONTHS9 = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function ddMmmYyyy(raw){
  const s = (raw||"").trim();
  let m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);          // DD/MM/YYYY
  if(m) return `${m[1].padStart(2,"0")}-${_MONTHS9[+m[2]-1]||m[2]}-${m[3]}`;
  m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);              // YYYY-MM-DD
  if(m) return `${m[3].padStart(2,"0")}-${_MONTHS9[+m[2]-1]||m[2]}-${m[1]}`;
  m = s.match(/^(\d{1,2})[-/.\s]*([A-Za-z]{3,9})[-/.,\s]*(\d{4})$/); // 24 FEB 2026
  if(m) return `${m[1].padStart(2,"0")}-${m[2].slice(0,3).toUpperCase()}-${m[3]}`;
  return s;
}
function composeField9(rv, review){
  const lines = [];
  const mawb = rv.mawb_no||"", hawb = rv.hawb_no||"";
  let bl = "";
  if(rv.bill_of_lading_no){
    bl = `B/L NO:${rv.bill_of_lading_no}`;
    if(rv.bill_of_lading_date) bl += ` B/L DATE:${ddMmmYyyy(rv.bill_of_lading_date)}`;
  }
  if(transportDocType(rv, review) === "BL" && (bl || !(mawb || hawb))){
    if(bl) lines.push(bl);                       // replaces the AWB line
  }else{
    if(mawb || hawb) lines.push(`MAWB NO:${mawb} HAWB:${hawb}`.trim());
    if(bl) lines.push(bl);
  }
  const nums = review.invoice_numbers||[], dates = review.invoice_dates||[];
  nums.forEach((n,i)=> lines.push(`INVOICE NO:${n} DT: ${dates[i]||""}`));
  if(rv.bank_reference){
    const pfx = _BANK9_PREFIX[(rv.payment_term_code||"").trim()] || "BANK REF";
    lines.push(`${pfx}:${rv.bank_reference}, DT:${rv.bank_date||""}`);
  }
  return lines.join("\n");
}

// HS-search query gate (shared with the server's rule): >=2 chars after trim,
// and a purely numeric query needs at least 2 digits.
function hsQueryError(raw){
  const t = (raw||"").trim();
  if(t.length < 2) return "type at least 2 characters";
  if(/^[\d\s.,\-/]+$/.test(t) && (t.match(/\d/g)||[]).length < 2) return "numeric search needs 2+ digits";
  return null;
}

// Detailed-Review HS search combobox. One instance per row, keyed by the
// row's immutable item_id; the parent keeps at most one dropdown open.
// Stale-response safety: AbortController on every pending request PLUS a
// monotonically increasing sequence checked before results are applied.
function HsSearch({itemId, isOpen, onOpen, onClose, onPick, disabled}){
  const [q,setQ] = useState("");
  const [state,setState] = useState("idle");   // idle|waiting|searching|results|empty|error
  const [results,setResults] = useState([]);
  const [active,setActive] = useState(-1);
  const [pos,setPos] = useState(null);
  const seqRef = React.useRef(0);
  const abortRef = React.useRef(null);
  const timerRef = React.useRef(null);
  const inputRef = React.useRef(null);
  const panelRef = React.useRef(null);
  const listId = "hsl-"+String(itemId).replace(/[^a-zA-Z0-9_-]/g,"");

  const cancelPending = useCallback(()=>{
    if(timerRef.current){ clearTimeout(timerRef.current); timerRef.current=null; }
    if(abortRef.current){ abortRef.current.abort(); abortRef.current=null; }
  },[]);
  // row removed / unmount -> abort in-flight work and drop controller state
  useEffect(()=>()=>cancelPending(),[cancelPending]);
  // another item's search opened (or this one closed) -> cancel + reset
  useEffect(()=>{ if(!isOpen){ cancelPending(); setResults([]); setActive(-1); setState("idle"); } },[isOpen,cancelPending]);
  // close on outside click, outside scroll, or window resize
  useEffect(()=>{
    if(!isOpen) return;
    const onDown = e=>{ if((inputRef.current&&inputRef.current.contains(e.target))
                        || (panelRef.current&&panelRef.current.contains(e.target))) return; onClose(); };
    const onScroll = e=>{ if(panelRef.current&&panelRef.current.contains(e.target)) return; onClose(); };
    const onResize = ()=>onClose();
    document.addEventListener("mousedown", onDown);
    window.addEventListener("scroll", onScroll, true);
    window.addEventListener("resize", onResize);
    return ()=>{ document.removeEventListener("mousedown", onDown);
                 window.removeEventListener("scroll", onScroll, true);
                 window.removeEventListener("resize", onResize); };
  },[isOpen,onClose]);

  function positionPanel(){
    const el = inputRef.current; if(!el) return;
    const r = el.getBoundingClientRect();
    const width = Math.min(430, window.innerWidth-24);
    const left = Math.max(8, Math.min(r.left, window.innerWidth-width-12));
    const below = window.innerHeight - r.bottom;
    const openUp = below < 260 && r.top > below;     // flip above when cramped
    setPos(openUp ? {left, width, bottom: window.innerHeight-r.top+4}
                  : {left, width, top: r.bottom+4});
  }
  function onInput(v){
    setQ(v); onOpen(); positionPanel();
    cancelPending();                                  // query changed -> cancel previous
    setActive(-1);
    if(hsQueryError(v)){ setResults([]); setState("idle"); return; }
    setState("waiting");
    timerRef.current = setTimeout(()=>runSearch(v.trim()), 250);   // debounce
  }
  async function runSearch(query){
    const seq = ++seqRef.current;
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    setState("searching");
    try{
      const resp = await fetch(`/api/reference/hs?q=${encodeURIComponent(query)}&limit=30`,{signal:ctrl.signal});
      const body = await resp.json();
      if(seq !== seqRef.current) return;              // stale response — never applied
      if(!resp.ok){ setState("error"); setResults([]); return; }
      setResults(body); setActive(body.length?0:-1);
      setState(body.length?"results":"empty");
      positionPanel();
    }catch(e){
      if(e.name==="AbortError" || seq !== seqRef.current) return;
      setState("error"); setResults([]);
    }
  }
  function choose(res){
    if(!res || !/^\d{11}$/.test(res.code)) return;    // only exact HS11 is selectable
    onPick(res.code);
  }
  function onKeyDown(e){
    const open = isOpen && state==="results" && results.length>0;
    if(e.key==="ArrowDown"){ e.preventDefault(); if(open) setActive(a=>Math.min(a+1,results.length-1)); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); if(open) setActive(a=>Math.max(a-1,0)); }
    else if(e.key==="Enter"){ if(open&&active>=0){ e.preventDefault(); choose(results[active]); } }
    else if(e.key==="Escape"){ e.preventDefault(); onClose(); }
    else if(e.key==="Tab"){ onClose(); }              // close but keep normal focus flow
  }
  const showPanel = isOpen && state!=="idle";
  const statusText = {waiting:"Waiting to search…", searching:"Searching official HS database…",
    results:`${results.length} official DB match${results.length===1?"":"es"}`,
    empty:"No official DB matches", error:"Search error — try again"}[state]||"";
  return (
    <div>
      <input ref={inputRef} className="hsq" role="combobox" placeholder="search HS…"
             aria-expanded={showPanel&&state==="results"} aria-controls={listId}
             aria-autocomplete="list" aria-haspopup="listbox"
             aria-activedescendant={active>=0?`${listId}-${active}`:undefined}
             value={q} disabled={disabled}
             onFocus={()=>{ onOpen(); positionPanel(); }}
             onChange={e=>onInput(e.target.value)} onKeyDown={onKeyDown}/>
      {showPanel && <div ref={panelRef} className="hspanel"
            style={{position:"fixed", left:pos&&pos.left, width:pos&&pos.width,
                    top:pos&&pos.top, bottom:pos&&pos.bottom}}>
        <div className="hsstatus" aria-live="polite">{statusText}</div>
        {state==="results" && <ul id={listId} role="listbox" className="hslist">
          {results.map((r,i)=>(
            <li key={r.code} id={`${listId}-${i}`} role="option" aria-selected={i===active}
                className={"hsopt"+(i===active?" act":"")}
                onMouseDown={e=>{e.preventDefault(); choose(r);}}
                onMouseEnter={()=>setActive(i)}>
              <div className="hstop"><code>{r.code}</code><span className="hsunit">{r.unit}</span>
                <span className="hsscore">{r.score}</span></div>
              <div className="hsdesc">{r.description}</div>
              {r.explanation && <div className="hsexp">{r.explanation}</div>}
            </li>))}
        </ul>}
      </div>}
    </div>);
}

// Bank combobox for the Critical Review: type a CODE, any part of the bank
// NAME, or a SWIFT fragment — the official 279-bank reference is filtered
// client-side (it is already loaded whole; no server round-trips). Picking a
// bank fills code + name + SWIFT as an exact reference pair; a query with no
// match can still be used verbatim as a raw code (validator flags it).
function BankSelect({banks, code, onPick, onRawCode, disabled}){
  const [open,setOpen] = useState(false);
  const [q,setQ] = useState(null);              // null = not typing -> show current code
  const [active,setActive] = useState(0);
  const inputRef = React.useRef(null);
  const panelRef = React.useRef(null);
  const listId = "bank-list";

  useEffect(()=>{
    if(!open) return;
    const onDown = e=>{ if((inputRef.current&&inputRef.current.contains(e.target))
                        || (panelRef.current&&panelRef.current.contains(e.target))) return; close(); };
    document.addEventListener("mousedown", onDown);
    return ()=>document.removeEventListener("mousedown", onDown);
  },[open]);

  function close(){ setOpen(false); setQ(null); setActive(0); }
  const norm = s=>(s||"").toLowerCase();
  const query = q===null ? "" : q.trim();
  const tokens = norm(query).split(/\s+/).filter(Boolean);
  const matches = !tokens.length ? banks
    : banks.filter(b=>tokens.every(t=>norm(b.name).includes(t)
                                      || b.code.startsWith(t)
                                      || norm(b.swift).includes(t)));
  const shown = matches.slice(0,40);

  function choose(b){ onPick(b); close(); }
  function useRaw(){ if(query && onRawCode){ onRawCode(query); close(); } }
  function onKeyDown(e){
    if(e.key==="ArrowDown"){ e.preventDefault(); setOpen(true); setActive(a=>Math.min(a+1, Math.max(shown.length-1,0))); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); setActive(a=>Math.max(a-1,0)); }
    else if(e.key==="Enter"){ e.preventDefault();
      if(open && shown[active]) choose(shown[active]);
      else if(open && !shown.length) useRaw(); }
    else if(e.key==="Escape"){ e.preventDefault(); close(); }
    else if(e.key==="Tab"){ close(); }
  }
  const display = q===null ? (code||"") : q;
  const status = !shown.length ? "No bank matches — Enter uses the typed value as a raw code"
    : matches.length>shown.length ? `showing first ${shown.length} of ${matches.length} banks — keep typing`
    : `${matches.length} of ${banks.length} banks`;
  return (
    <div style={{position:"relative"}}>
      <input ref={inputRef} className="t" role="combobox" placeholder="type code or bank name…"
             aria-expanded={open} aria-controls={listId} aria-autocomplete="list"
             aria-haspopup="listbox"
             aria-activedescendant={open&&shown[active]?`${listId}-${active}`:undefined}
             value={display} disabled={disabled}
             title="type a bank code, name or SWIFT to search the official reference; picking fills code, name and SWIFT"
             onFocus={()=>{ setOpen(true); setActive(0); }}
             onChange={e=>{ setQ(e.target.value); setOpen(true); setActive(0); }}
             onKeyDown={onKeyDown}/>
      {open && <div ref={panelRef} className="hspanel"
                    style={{position:"absolute", left:0, right:0, top:"100%", marginTop:4}}>
        <div className="hsstatus" aria-live="polite">{status}</div>
        <ul id={listId} role="listbox" className="hslist">
          {shown.map((b,i)=>(
            <li key={b.code+"|"+i} id={`${listId}-${i}`} role="option" aria-selected={i===active}
                className={"hsopt"+(i===active?" act":"")}
                onMouseDown={e=>{e.preventDefault(); choose(b);}}
                onMouseEnter={()=>setActive(i)}>
              <div className="hstop"><code>{b.code}</code><span className="hsunit">{b.swift}</span></div>
              <div className="hsdesc">{b.name}</div>
            </li>))}
          {!shown.length && query &&
            <li className="hsopt" role="option" aria-selected={false}
                onMouseDown={e=>{e.preventDefault(); useRaw();}}>
              <div className="hsdesc">Use “{query}” as bank code (not in the reference)</div>
            </li>}
        </ul>
      </div>}
    </div>);
}
