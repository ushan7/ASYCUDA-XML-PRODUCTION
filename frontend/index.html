// --------------------------------------------------------------------------- //
// Document viewer — the evidence panel.  Pinned to the right so the extracted
// values and the printed page are visible AT THE SAME TIME (verification is a
// comparison task; a modal would force the reviewer to memorize values).  The
// panel is sticky: 📄 icons elsewhere re-target the document/page while it
// stays open.  Read-only in every job state — a finalized job's documents
// remain viewable as evidence (post-clearance audits arrive months later).
// The browser's native PDF renderer honours #page=N, so deep-linking a row's
// source page needs no PDF library.
// --------------------------------------------------------------------------- //
const ROLE_SHORT = {INVOICE:"Invoice", PACKING_LIST:"Packing", AIR_WAYBILL:"AWB/BL",
                    BANKING:"Banking", INSURANCE:"Insurance", CERTIFICATE_OF_ORIGIN:"COO cert"};
// What to say when the server refused the file but sent no sentence of its own.
const DOC_ERR_FALLBACK = {
  403: "This server refused to serve the stored file.",
  404: "The server has no record of this document on this job.",
  410: "The stored file is no longer on this server.",
};

function DocViewer({job, docs, viewer, onSwitch, onClose}){
  const doc = docs.find(d=>d.document_id===viewer.docId);
  const page = viewer.page || 1;
  const fileUrl = doc ? `${API}/api/jobs/${job.job_id}/documents/${doc.document_id}/file` : "";
  // ASK BEFORE FRAMING.  The iframe below fetches by navigation, where no
  // JavaScript runs and nothing reports back: its load event fires for an
  // error response exactly as it does for a PDF, so a refusal renders as an
  // empty grey panel and nothing else.  That one silent failure mode made two
  // unrelated causes — a response header the browser would not frame, and a
  // stored file missing off disk — look identical from the reviewer's chair,
  // and identical to a slow load.  One HEAD first, then either the document or
  // the server's own reason on screen.
  const [avail, setAvail] = useState({state:"checking"});
  useEffect(()=>{
    if(!fileUrl) return;
    let live = true;
    setAvail({state:"checking"});
    (async()=>{
      try{
        const r = await fetch(fileUrl, {method:"HEAD"});
        if(!live) return;
        if(r.ok){ setAvail({state:"ok"}); return; }
        if(r.status === 401){
          // One cause, one answer: the shell swaps in the sign-in screen rather
          // than this panel inventing its own dead end (see api()).
          window.dispatchEvent(new CustomEvent("ec-auth-expired"));
          setAvail({state:"error", status:401,
                    detail:"Your session has ended. Sign in to continue."});
          return;
        }
        // HEAD carries no body — re-ask with GET purely to read the reason the
        // server gave, which is written for the reviewer and names the file.
        let detail = "";
        try{
          const g = await fetch(fileUrl);
          if((g.headers.get("content-type")||"").includes("json")){
            const b = await g.json();
            detail = (b && b.detail) || "";
          }
        }catch(e){}
        if(live) setAvail({state:"error", status:r.status, detail});
      }catch(e){
        if(live) setAvail({state:"error", status:0,
                           detail:"The server could not be reached. Check that it is still running."});
      }
    })();
    return ()=>{ live = false; };
  },[fileUrl]);
  // Esc closes — the same reflex every other panel on the page answers to
  useEffect(()=>{
    const onKey = e=>{ if(e.key==="Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    return ()=>document.removeEventListener("keydown", onKey);
  },[onClose]);
  if(!doc) return null;
  // key forces the iframe to re-navigate when the target page changes — PDF
  // viewers ignore a pure fragment change on an already-loaded document
  return (
    <div className="docpanel" role="complementary" aria-label="document viewer">
      <div className="dochead">
        <span className="dtitle" title={doc.file}>📄 {doc.file}</span>
        {viewer.label && <span className="dwhere">{viewer.label}</span>}
        {viewer.page ? <span className="dwhere">p.{page}</span> : null}
        <a className="gbtn" href={fileUrl} target="_blank" rel="noopener"
           title="open this document in its own browser tab">⧉ new tab</a>
        <button type="button" className="gbtn" onClick={onClose} title="close the viewer (Esc)">✕ close</button>
      </div>
      <div className="docchips" role="tablist" aria-label="documents on this job">
        {docs.map(d=>(
          <button key={d.document_id} type="button" role="tab"
                  aria-selected={d.document_id===doc.document_id}
                  className={"docchip"+(d.document_id===doc.document_id?" act":"")}
                  title={d.file+(d.status==="ROLE_REJECTED"?" — rejected (kept as evidence)":"")}
                  onClick={()=>onSwitch(d.document_id)}>
            {ROLE_SHORT[d.role]||d.role}{d.status==="ROLE_REJECTED"?" ⛔":""}
          </button>))}
      </div>
      {avail.state === "error"
        ? <div className="docerr" role="alert">
            <div className="dehead">This document cannot be shown.</div>
            <div>{avail.detail || DOC_ERR_FALLBACK[avail.status] ||
                  "The server refused to serve the stored file."}</div>
            <div className="decode">{doc.file}{avail.status ? ` — HTTP ${avail.status}` : ""}</div>
            <div>The extracted values on the left are unaffected: they were read when the document
              was uploaded and are stored with the job, not with the file.</div>
          </div>
        : <iframe key={doc.document_id+"@"+page} className="docframe"
                  src={`${fileUrl}#page=${page}`}
                  title={`document ${doc.file}, page ${page}`}/>}
      <div className="docnote">Evidence view — the stored upload, exactly as received. Values on the
        declaration come only from the extracted, reviewed data on the left.</div>
    </div>);
}

// --------------------------------------------------------------------------- //
// Brand · Model · Size — spreadsheet-style editable grid.
// Edits are staged locally and committed in ONE bulk save. Supports inline cell
// editing, keyboard navigation, Excel block paste, and fill-down / range apply.
// These three columns are export-only (never in the customs XML), so saving
// rebuilds only the .xls — the generated XML and finalize state are untouched.
// --------------------------------------------------------------------------- //
const BMS_COLS = ["brand","model","size"];
const BMS_HEAD = {brand:"BRAND", model:"MODEL", size:"SIZE"};

function parseSnRange(spec, max){
  const raw = String(spec||"").trim();
  if(!raw) return [];
  if(raw.toLowerCase()==="all") return Array.from({length:max},(_,i)=>i+1);
  const out = new Set();
  for(const tok of raw.split(",")){
    const t = tok.trim(); if(!t) continue;
    const m = t.match(/^(\d+)(?:\s*[-–]\s*(\d+))?$/);
    if(!m) return null;
    const lo = parseInt(m[1],10), hi = parseInt(m[2]||m[1],10);
    if(lo>hi || lo<1 || hi>max) return null;
    for(let i=lo;i<=hi;i++) out.add(i);
  }
  return [...out].sort((a,b)=>a-b);
}

function BmsGrid({rows, jobId, hasXls, busy, onSaved, onGuide}){
  const [draft,setDraft]   = useState({});          // {item_id:{brand?,model?,size?}}
  const [sel,setSel]       = useState({r:0,c:0});
  const [editing,setEditing]= useState(false);
  const [buf,setBuf]       = useState("");
  const [msg,setMsg]       = useState(null);
  const [saving,setSaving] = useState(false);
  const [fill,setFill]     = useState({field:"brand", value:"", range:""});
  const inputRef = React.useRef(null);
  const nRows = rows.length, nCols = BMS_COLS.length;

  useEffect(()=>{ setDraft({}); setMsg(null); }, [jobId, nRows]);
  useEffect(()=>{ if(editing && inputRef.current) inputRef.current.focus(); }, [editing]);

  const shown = (row,col) => {
    const d = draft[row.item_id];
    return (d && d[col]!==undefined) ? d[col] : (row[col] ?? "");
  };
  const isDirty = (row,col) => { const d=draft[row.item_id]; return !!(d && d[col]!==undefined); };
  const dirtyCount = Object.values(draft).reduce((a,d)=>a+Object.keys(d).length,0);

  // stage one cell; writing back the original value clears the dirty mark
  function stage(next, row, col, text){
    const cur = {...(next[row.item_id]||{})};
    if(String(text) === String(row[col] ?? "")) delete cur[col];
    else cur[col] = String(text);
    if(Object.keys(cur).length) next[row.item_id]=cur; else delete next[row.item_id];
    return next;
  }
  function writeCell(rIdx, cIdx, text){
    const row = rows[rIdx]; if(!row) return;
    setDraft(prev=>stage({...prev}, row, BMS_COLS[cIdx], text));
  }
  function move(dr,dc){
    setEditing(false);
    setSel(s=>({r:Math.max(0,Math.min(nRows-1,s.r+dr)), c:Math.max(0,Math.min(nCols-1,s.c+dc))}));
  }
  function beginEdit(seed){
    const row = rows[sel.r]; if(!row) return;
    setBuf(seed!==undefined ? seed : String(shown(row, BMS_COLS[sel.c])));
    setEditing(true);
  }
  function commitThen(fn){
    if(editing){ writeCell(sel.r, sel.c, buf); setEditing(false); }
    if(fn) fn();
  }

  function onKeyDown(e){
    if(e.key==="Escape"){ e.preventDefault(); setEditing(false); return; }
    if(editing){
      if(e.key==="Enter"){ e.preventDefault(); commitThen(()=>move(1,0)); }
      else if(e.key==="Tab"){ e.preventDefault(); commitThen(()=>move(0, e.shiftKey?-1:1)); }
      return;                                    // the input handles typing
    }
    const k = e.key;
    if(k==="Enter"||k==="F2"){ e.preventDefault(); beginEdit(); return; }
    if(k==="Tab"){ e.preventDefault(); move(0, e.shiftKey?-1:1); return; }
    if(k==="ArrowDown"){ e.preventDefault(); move(1,0); return; }
    if(k==="ArrowUp"){ e.preventDefault(); move(-1,0); return; }
    if(k==="ArrowRight"){ e.preventDefault(); move(0,1); return; }
    if(k==="ArrowLeft"){ e.preventDefault(); move(0,-1); return; }
    if(k==="Delete"||k==="Backspace"){ e.preventDefault(); writeCell(sel.r,sel.c,""); return; }
    if((e.ctrlKey||e.metaKey) && k.toLowerCase()==="d"){        // Excel fill-down
      e.preventDefault();
      if(sel.r>0) writeCell(sel.r, sel.c, shown(rows[sel.r-1], BMS_COLS[sel.c]));
      return;
    }
    if(!e.ctrlKey && !e.metaKey && !e.altKey && k.length===1){  // type replaces
      e.preventDefault(); beginEdit(k);
    }
  }

  function onPaste(e){
    const text = (e.clipboardData || window.clipboardData).getData("text");
    if(!text) return;
    e.preventDefault();
    const block = text.replace(/\r\n?/g,"\n").replace(/\n+$/,"").split("\n").map(l=>l.split("\t"));
    // count synchronously — the setDraft updater must stay pure (React may run
    // it later, or twice, so a counter incremented inside it reads back as 0)
    let cells = 0, clipped = 0;
    block.forEach((line,i)=>{
      if(!rows[sel.r+i]){ clipped += line.length; return; }
      line.forEach((_,j)=>{ if(sel.c+j < nCols) cells++; else clipped++; });
    });
    setDraft(prev=>{
      const next = {...prev};
      block.forEach((line,i)=>{
        const row = rows[sel.r+i]; if(!row) return;
        line.forEach((cell,j)=>{
          const c = sel.c+j; if(c>=nCols) return;
          stage(next, row, BMS_COLS[c], cell.trim());
        });
      });
      return next;
    });
    setEditing(false);
    setMsg({ok:true, text:`Pasted ${cells} cell(s) across ${Math.min(block.length, nRows-sel.r)} row(s)`+
           (clipped?` — ${clipped} cell(s) fell outside the grid and were ignored`:"")+
           " — review, then Save."});
  }

  function copyAll(){
    const tsv = [["#",...BMS_COLS.map(c=>BMS_HEAD[c])].join("\t")]
      .concat(rows.map(r=>[r.sn, ...BMS_COLS.map(c=>shown(r,c))].join("\t"))).join("\n");
    (navigator.clipboard ? navigator.clipboard.writeText(tsv) : Promise.reject())
      .then(()=>setMsg({ok:true,text:`Copied ${rows.length} row(s) as TSV — paste straight into Excel.`}))
      .catch(()=>setMsg({ok:false,text:"Clipboard blocked by the browser; select the table and copy manually."}));
  }

  function applyFill(){
    const sns = parseSnRange(fill.range, nRows);
    if(sns===null || !sns.length)
      return setMsg({ok:false, text:'Enter a row range like "1-40, 55" or "all".'});
    const bySn = {}; rows.forEach((r,i)=>{ bySn[r.sn]=i; });
    setDraft(prev=>{
      const next = {...prev};
      sns.forEach(sn=>{ const i=bySn[sn]; if(i!==undefined) stage(next, rows[i], fill.field, fill.value); });
      return next;
    });
    setMsg({ok:true, text:`${BMS_HEAD[fill.field]} set on ${sns.length} row(s) — review, then Save.`});
  }

  async function save(){
    const edits = Object.entries(draft).map(([item_id,d])=>({item_id, ...d}));
    if(!edits.length) return;
    setSaving(true); setMsg(null);
    try{
      const r = await api(`/api/jobs/${jobId}/items/brand-model-size`, {method:"POST",
        headers:{"content-type":"application/json"}, body:JSON.stringify({edits})});
      setDraft({});
      setMsg({ok:true, text:`Saved ${r.edited_items} row(s).`+
             (r.xls_rebuilt ? " The .xls was rebuilt — your XML is untouched." : "")});
      onSaved && onSaved(r);
    }catch(e){ setMsg({ok:false, text:""+e}); }
    finally{ setSaving(false); }
  }

  const disabled = !!busy || saving;
  return (<div style={{marginTop:8}}>
    <div className="hint" style={{marginBottom:6,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <span>Click a cell and type. Edits are staged until you press Save; these columns are
        export-only, so saving never invalidates your XML.</span>
      {onGuide && <GuideButton onOpen={onGuide} section="bms"/>}
    </div>
    <div className="row" style={{margin:"6px 0", gap:6, flexWrap:"wrap", alignItems:"center"}}>
      <button className="btn" disabled={disabled||!dirtyCount} onClick={save}>
        {saving ? "Saving…" : `💾 Save${dirtyCount?` ${dirtyCount} change(s)`:""}`}</button>
      <button className="btn ghost" disabled={disabled||!dirtyCount} onClick={()=>{setDraft({});setMsg(null);}}>Revert</button>
      <button className="btn ghost" disabled={disabled} onClick={copyAll}>⧉ Copy all (TSV)</button>
      {hasXls && <a className="btn" href={`${API}/api/jobs/${jobId}/brand-model-size.xls`}>⬇ Download .xls</a>}
      <span style={{display:"inline-flex",gap:5,alignItems:"center"}}
            title="set one value on many rows at once — printer-style range, e.g. 1-40, 55 (or all)">
        <select className="t" style={{width:90,padding:"6px 8px",fontSize:12.5}} value={fill.field}
                onChange={e=>setFill({...fill,field:e.target.value})}>
          {BMS_COLS.map(c=><option key={c} value={c}>{BMS_HEAD[c]}</option>)}
        </select>
        <input className="t" style={{width:130,padding:"6px 8px",fontSize:12.5}} placeholder="value"
               value={fill.value} onChange={e=>setFill({...fill,value:e.target.value})}/>
        <input className="t" style={{width:110,padding:"6px 8px",fontSize:12.5}} placeholder="rows 1-40, 55"
               value={fill.range} onChange={e=>setFill({...fill,range:e.target.value})}
               onKeyDown={e=>{ if(e.key==="Enter"){e.preventDefault(); applyFill();} }}/>
        <button className="btn ghost" disabled={disabled} onClick={applyFill}>Fill</button>
      </span>
      <span className="tag">{rows.length} rows{dirtyCount?` · ${dirtyCount} unsaved`:""}</span>
    </div>
    {msg && <div className={"msg "+(msg.ok?"ok":"b")}>{maskEngine(msg.text)}</div>}
    <div tabIndex={0} onKeyDown={onKeyDown} onPaste={onPaste}
         style={{outline:"none", maxHeight:420, overflow:"auto", border:"1px solid #e2e8f0", borderRadius:6}}>
      <table className="dtable" style={{marginTop:0}}>
        <colgroup><col style={{width:"8%"}}/><col style={{width:"31%"}}/>
          <col style={{width:"31%"}}/><col style={{width:"30%"}}/></colgroup>
        <thead><tr><th className="num">#</th>
          {BMS_COLS.map(c=><th key={c}>{BMS_HEAD[c]}</th>)}</tr></thead>
        <tbody>{rows.map((row,ri)=>(
          <tr key={row.item_id||row.sn}>
            <td className="num">{row.sn}</td>
            {BMS_COLS.map((col,ci)=>{
              const on = sel.r===ri && sel.c===ci;
              const dirty = isDirty(row,col);
              return (<td key={col} onMouseDown={()=>{ setSel({r:ri,c:ci}); setEditing(false); }}
                          onDoubleClick={()=>{ setSel({r:ri,c:ci}); beginEdit(); }}
                          title={dirty ? "edited — not saved yet" : String(shown(row,col))}
                          style={{cursor:"cell", background: dirty?"#fef9c3":(on?"#e0f2fe":undefined),
                                  outline: on?"2px solid #0284c7":undefined, outlineOffset:"-2px",
                                  fontWeight: dirty?600:undefined}}>
                {on && editing
                  ? <input ref={inputRef} className="t"
                           style={{width:"100%",padding:"2px 4px",fontSize:11,height:20,border:"none"}}
                           value={buf} onChange={e=>setBuf(e.target.value)}
                           onBlur={()=>commitThen()}/>
                  : String(shown(row,col))}
              </td>);
            })}
          </tr>))}</tbody>
      </table>
    </div>
  </div>);
}

// ---------------------------------------------------------------------- //
// Controls shared by the Critical Review form and the Decision queue.
//
// These exist so a value has exactly ONE control, rendered in two places.
// Copying the Box-25 select into the queue would have been quicker and would
// have given the two surfaces separate bugs the first time either changed.
// ---------------------------------------------------------------------- //
function ModePick({modeRef, value, onChange, id}){
  if(!modeRef.length)
    return <input className="t" placeholder="01–09" value={value}
                  onChange={e=>onChange(e.target.value)}/>;
  return (
    <select className="t" value={value} onChange={e=>onChange(e.target.value)}
            aria-label={id}>
      <option value="">— select mode —</option>
      {modeRef.map(m=><option key={m.code} value={m.code}>{m.code} — {m.description}</option>)}
    </select>);
}
// A row of document-supplied candidates, one of them the engine's suggestion.
// Used for Field 40 and for the freight amount — the two places the backend
// already ships choices with a default.
function CandidatePick({items, value, onPick, disabled}){
  if(!items.length) return null;
  return (
    <div className="cands">
      {items.map((c,i)=>(
        <button key={i} type="button" className={"cand"+(c.value===value?" on":"")}
                disabled={disabled||c.disabled}
                title={c.title||""} onClick={()=>onPick(c)}>
          <span className="csrc">{c.source}</span>{c.label}{c.suggested?" ★":""}
        </button>))}
    </div>);
}
// ---------------------------------------------------------------------- //
// Decision queue — the front door.
//
// Every case below is a value this review ALREADY returned; nothing here is
// computed anew and nothing is decided client-side.  The queue's whole job is
// to gather the open decisions out of the four places they are scattered
// across today (review warnings, unresolved item rows, undecided documents,
// the blocking errors of the last finalize) and put them in one list, in the
// order they block the XML.
//
// A case has no stored "answered" flag: it is derived, so it disappears the
// moment the underlying condition is actually fixed.  A local answer map would
// drift out of step with the declaration — and after a re-extraction it would
// be exactly the blind carryover the review rules forbid.
// ---------------------------------------------------------------------- //
const DQ_TABS = [
  {id:"all",   label:"All cases"},
  {id:"block", label:"Blocking"},
  {id:"hs",    label:"HS & items"},
  {id:"totals",label:"Weights & totals"},
  {id:"docs",  label:"Documents"},
];
function dqMatch(c, tab){
  if(tab==="all") return true;
  if(tab==="block") return c.sev==="block";
  return c.group===tab;
}
// Group a case by its engine code, so a code nobody has seen before still
// lands somewhere sensible instead of vanishing from every filter.
// Codes the queue asks about ITSELF, from the live reviewed values.  The
// backend's warning for the same code describes the state at review time and
// goes stale the moment the reviewer answers — without this, answering "Box 25
// is not set" made the engine's own (now untrue) warning about Box 25 pop back
// into the queue as a fresh blocking case.  The live case is the only truthful
// one; the stale text disappears on the next recompute anyway.
const DQ_OWNED_CODES = new Set([
  "TRANSPORT_MODE_MISSING", "FIELD_40_UNCONFIRMED",
  "FREIGHT_CANDIDATE_CONFLICT",
]);
function dqGroup(code){
  const c = String(code||"").toUpperCase();
  if(/HS|COMMODITY|SUPPLEMENT|COO|ORIGIN/.test(c)) return "hs";
  if(/WEIGHT|PACK|CARTON|GROSS|NET|TOTAL|QUANT|FREIGHT|INSUR/.test(c)) return "totals";
  if(/DOC|ROLE|AWB|WAYBILL|BANK|CERTIF|MANIFEST/.test(c)) return "docs";
  return "other";
}

function DecisionQueue({cases, tab, onTab, focus, onFocus, resolved, onOpenValue,
                        onEvidence, onAnswer, onLeave, busy, blocking, onGuide}){
  const cardRef = React.useRef(null);
  const list = cases.filter(c=>dqMatch(c, tab));
  const cur = list.find(c=>c.id===focus) || list[0] || null;
  const counts = {};
  DQ_TABS.forEach(t=>{ counts[t.id] = cases.filter(c=>dqMatch(c, t.id)).length; });

  // Keyboard only while the queue is the step on screen — offsetParent is null
  // for a hidden card, which is true in BOTH the stepped and the scrolling
  // layout, so this needs no knowledge of which one is active.
  useEffect(()=>{
    const onKey = e=>{
      if(e.altKey||e.ctrlKey||e.metaKey) return;
      if(!cardRef.current || cardRef.current.offsetParent===null) return;
      const t = (e.target && e.target.tagName || "").toLowerCase();
      if(t==="input"||t==="textarea"||t==="select"||(e.target && e.target.isContentEditable)) return;
      if(!list.length) return;
      const i = Math.max(0, list.findIndex(c=>c.id===(cur&&cur.id)));
      const k = e.key.toLowerCase();
      if(k==="arrowdown"||k==="j"){ e.preventDefault(); onFocus(list[(i+1)%list.length].id); }
      else if(k==="arrowup"||k==="k"){ e.preventDefault(); onFocus(list[(i+list.length-1)%list.length].id); }
      else if(k==="e" && cur && cur.ev){ e.preventDefault(); onEvidence(cur); }
      // A choice case can be answered from the keyboard: Enter takes the
      // engine's suggestion, 1–5 take a specific one.  Cases answered by
      // typing (COO) bind nothing — the keys belong to the input.
      else if(cur && cur.choices && cur.choices.length && !busy){
        if(k==="enter"){ e.preventDefault();
          const s = cur.choices.findIndex(c=>c.star);
          onAnswer(cur, s===-1?0:s); }
        else if(k>="1" && k<="5"){
          const ix = +k - 1;
          if(cur.choices[ix]){ e.preventDefault(); onAnswer(cur, ix); } }
      }
    };
    window.addEventListener("keydown", onKey);
    return ()=>window.removeEventListener("keydown", onKey);
  });

  return (
    <div className="card" ref={cardRef}>
      <h2><span className="htxt">🎯 Decision queue</span>{cases.length>0 && <span className="pill no">{cases.length}</span>}
          <GuideButton onOpen={onGuide} section="critical" label="guide"/></h2>
      <p className="hint"><b>↑ ↓</b> move · <b>E</b> evidence</p>

      <div className="ifilter" style={{marginTop:0}}>
        <div className="ichips" role="group" aria-label="case filters">
          {DQ_TABS.map(t=>(
            <button key={t.id} type="button"
                    className={"ichip"+(t.id==="block"&&counts.block?" no":"")+(tab===t.id?" on":"")}
                    disabled={t.id!=="all" && !counts[t.id]}
                    aria-pressed={tab===t.id}
                    onClick={()=>onTab(t.id)}>{t.label}<b>{counts[t.id]}</b></button>))}
        </div>
        <span className="icount">{blocking
          ? <b>{blocking} of {cases.length} block the XML</b>
          : <span>{cases.length ? "nothing blocking — "+cases.length+" to confirm" : "queue clear"}</span>}</span>
      </div>

      {cases.length===0 &&
        <div className="msg ok" style={{marginTop:10}}>✔ Queue clear — nothing on this declaration is waiting on you.</div>}

      <div className="dq">
        {list.map((c,i)=>{
          const on = cur && c.id===cur.id;
          return (
            <div key={c.id} className={"dqcase "+(c.sev==="block"?"blk":"wrn")+(on?" on":"")}
                 onClick={e=>{ if(e.target.closest && e.target.closest("button")) return; onFocus(c.id); }}>
              <div className="dqhead">
                <span className="dqnum">{i+1}</span>
                <span className="dqtitle">{c.title}</span>
                <code className="dqcode">{c.code}</code>
                <span className={"pill "+(c.sev==="block"?"no":"")}
                      style={c.sev==="block"?undefined:{background:"#fef3c7",color:"#78350f"}}>
                  {c.sev==="block"?"BLOCKING":"CONFIRM"}</span>
              </div>
              {on && <div className="dqbody">
                {/* the explanation is kept, not shown — the title asks the
                    question and the controls answer it */}
                {c.body && <details><summary>details</summary><p>{c.body}</p></details>}
                {/* Answered here.  These render the SAME controls the form does,
                    bound to the same values — the queue is a second view of one
                    declaration, never a second copy of it. */}
                {c.choices && c.choices.length>0 && <div className="dqchoice">
                  {c.choices.map((ch,ci)=>(
                    <button key={ci} type="button" className={"cbtn"+(ch.star?" star":"")}
                            disabled={!!busy} title={ch.title||""}
                            onClick={()=>onAnswer(c, ci)}>
                      <span className="ckey">{ci+1}</span>{ch.label}{ch.star?" ★":""}</button>))}
                </div>}
                {c.answer && <div className="dqanswer">{c.answer}</div>}
                <div className="dqacts">
                  {/* the jump stays available, but it is now the way out of the
                      exceptions rather than the way every case is worked */}
                  {c.step && <button type="button"
                          className={(c.choices||c.answer) ? "ichip" : "btn"}
                          data-ec-goto={c.step}
                          onClick={()=>{ onLeave && onLeave(); c.act && c.act(); }}>{c.go} →</button>}
                  {c.ev && <button type="button" className="ichip"
                          onClick={()=>onEvidence(c)}>📄 evidence <b>E</b></button>}
                </div>
              </div>}
            </div>);
        })}
      </div>

      {/* What the engine DID decide — quiet by design, but never hidden: each
          value names the document it was taken from and opens it. */}
      {resolved.length>0 && <div className="rbox">
        <div className="rhead">
          <span>Resolved by the rule engine</span>
          <span className="pill ok">{resolved.length}</span>
        </div>
        <div className="rvals">
          {resolved.map((r,i)=>(
            <button key={i} type="button" className="rval" disabled={!r.docId}
                    title={r.docId ? `open ${r.src}` : "no document page recorded for this value"}
                    onClick={()=>r.docId && onOpenValue(r)}>
              <span className="rk">{r.k}</span>
              <span className="rv">{r.v}</span>
              <span className="rs">{r.src}</span>
            </button>))}
        </div>
      </div>}
    </div>
  );
}

// Critical Review is one long form — seven sections.  These are its sections
// in render order so the reviewer can jump straight to the one being
// questioned instead of scroll-hunting for it.
const CR_SECTIONS = [
  {id:"cr-regime",    label:"Office & regime"},
  {id:"cr-totals",    label:"Shipment totals"},
  {id:"cr-manifest",  label:"Manifest & transport"},
  {id:"cr-invoice",   label:"Invoices & Field 9"},
  {id:"cr-parties",   label:"Exporter & importer"},
  {id:"cr-bank",      label:"Bank & payment"},
  {id:"cr-freight",   label:"Freight & insurance"},
];
// Scroll a section under the sticky card heading and flash it, so the eye
// lands on the right box instead of somewhere near it.  The class is dropped
// again a moment later (and by any React re-render) — nothing depends on it.
function jumpToSection(id){
  const el = document.getElementById(id);
  if(!el) return;
  const scroll = behavior => {
    const y = el.getBoundingClientRect().top + window.scrollY - 96;   // clear the sticky heading
    window.scrollTo({top: Math.max(0, y), behavior});
  };
  scroll("smooth");
  // A smooth scroll is a request, not a promise: browsers drop it under
  // reduce-motion settings, and the step being switched to may still be
  // settling its layout underneath it.  A jump that quietly lands nowhere is
  // worse than no jump at all, so check and land it for certain.
  setTimeout(()=>{
    const r = el.getBoundingClientRect();
    if(r.top < 56 || r.top > window.innerHeight - 56) scroll("auto");
  }, 380);
  el.classList.add("jumped");
  setTimeout(()=>{ el.classList.remove("jumped"); }, 1400);
}

  async function newJob(){

        transport_doc_type: r.transport_doc_type || "AWB",

        field_21_transport_identity: r.field_21_transport_identity || "",
        field_40_previous_document: r.field_40_previous_document || "",
        field_40_confirmed: false,   // the reviewer is re-asked after every recompute

        field_9_override: (prev && prev.field_9_override) || false,

        exporter_name: r.exporter.name, exporter_address: r.exporter.address,

        incoterm: r.incoterm || "", delivery_place: r.delivery_place || "",
        invoice_values_exclude_freight_insurance: false,
        // regime & transport (2026-08-01): server seeds = stored job selection
        // (else deployment default); un-saved in-form edits survive a recompute
        // via prev.  border_office_code "" means "same as clearance office".
        declaration_type: (prev && prev.declaration_type!==undefined) ? prev.declaration_type : (r.declaration_type || "IM"),
        gen_procedure_code: (prev && prev.gen_procedure_code!==undefined) ? prev.gen_procedure_code : (r.gen_procedure_code || "4"),
        customs_office_code: (prev && prev.customs_office_code!==undefined) ? prev.customs_office_code : (r.customs_office_code || ""),
        customs_office_name: (prev && prev.customs_office_name!==undefined) ? prev.customs_office_name : (r.customs_office_name || ""),
        border_office_code: (prev && prev.border_office_code!==undefined) ? prev.border_office_code
          : ((r.border_office_code && r.border_office_code!==r.customs_office_code) ? r.border_office_code : ""),
        extended_customs_procedure: (prev && prev.extended_customs_procedure!==undefined) ? prev.extended_customs_procedure : (r.extended_customs_procedure || "4000"),
        national_customs_procedure: (prev && prev.national_customs_procedure!==undefined) ? prev.national_customs_procedure : (r.national_customs_procedure || "000"),
        border_mode: (prev && prev.border_mode!==undefined) ? prev.border_mode : (r.border_mode || ""),
        inland_mode_of_transport: (prev && prev.inland_mode_of_transport!==undefined) ? prev.inland_mode_of_transport : (r.inland_mode_of_transport || ""),
        border_nationality: (prev && prev.border_nationality!==undefined) ? prev.border_nationality : (r.border_nationality || "NP"),
        place_of_loading_code: (prev && prev.place_of_loading_code!==undefined) ? prev.place_of_loading_code : (r.place_of_loading_code || ""),
        location_of_goods: (prev && prev.location_of_goods!==undefined) ? prev.location_of_goods : (r.location_of_goods || ""),
        container_flag: (prev && prev.container_flag!==undefined) ? prev.container_flag : !!r.container_flag,
        bank_code: r.bank_code || "", bank_name: r.bank_name || "", swift_code: r.swift_code || "",
        payment_term_code: r.payment_term_code || "", mode_of_payment: r.mode_of_payment || "CASH",
        bank_reference: r.bank_reference || "", bank_amount: r.bank_amount || "",
        bank_currency: r.bank_currency || "", bank_date: r.bank_date || "",
        manual_freight_amount: r.manual_freight_amount || "",
        manual_insurance_amount: (prev && prev.manual_insurance_amount) || "",
        review_fingerprint: r.review_fingerprint,
      }));
  }
  async function finalize(){
    setErr(""); setBusy("finalize");
    try{
      const body = {...rv, exchange_rate:rate,
                    hs_overrides:Object.fromEntries(Object.entries(hsFix).filter(([,v])=>v && v.trim()))};
      const d = await api(`/api/jobs/${job.job_id}/finalize`,{method:"POST",
        headers:{"content-type":"application/json"}, body:JSON.stringify(body)});
      if(d && d.status==="REVIEW_STALE"){
        setErr("Evidence changed since this review was computed — the review below has been refreshed; verify and finalize again.");
        if(d.critical_review){ setReview(d.critical_review); seedRv(d.critical_review); }
        return;
      }
      if(d && d.blocking_errors && !d.valuation){   // structured 409, not a declaration
        setErr(d.blocking_errors.map(m=>`${m.code}: ${m.message}`).join(" · "));
        return;
      }
      setDecl(d); await refresh(job.job_id);
      // warn-mode: the XML exists despite blocking cases — pop up the list
      if(d && d.xml_built_with_blockers && d.blocking_errors && d.blocking_errors.length)
        setXmlWarn(d.blocking_errors);
    }catch(e){ setErr(errText(e));} finally{ setBusy(""); }
  }
  // ---- Detailed Review item mutations (server is authoritative) ----------
  function applyMutationResult(r, text){
    // Rerender everything from the server result: rows, warnings, packing
    // view, totals, readiness. Reviewer entries in rv survive (item mutations
    // never change shipment/bank defaults) — only the fingerprint refreshes
    // and the manual shipment confirmation is cleared by design. SN-keyed HS
    // entries and any built declaration/XML are stale after a mutation.
    setReview(r.critical_review);
    setRv(v=>v?{...v, review_fingerprint:r.critical_review.review_fingerprint,
                manual_shipment_authority_confirmed:false}:v);
                // a manual Field 9 override survives via the spread; the
                // non-override box is derived live, so nothing to refresh here
    setHsFix({});
    setDecl(null);
    setMutMsg({ok:true, text});
    refresh(job.job_id).catch(()=>{});
  }
  const numOrNull = v => { if(v===""||v===null||v===undefined) return 0;
    const x = Number(v); return isFinite(x)&&x>=0 ? x : null; };
  async function submitAdd(){
    const d = addDlg, n = review.item_details.length;
    const sn = parseInt(d.sn,10);
    const qty = numOrNull(d.qty), price = numOrNull(d.price);
    if(!(sn>=1&&sn<=n+1)) return setAddDlg({...d,err:`Insertion SN must be between 1 and ${n+1}.`});
    if(qty===null||price===null) return setAddDlg({...d,err:"Quantity and total price must be finite non-negative numbers."});
    if(!d.invoice && !d.manual) return setAddDlg({...d,err:"Select an authoritative invoice or tick the reviewed-manual-addition confirmation."});
    setBusy("item"); setMutMsg(null);
    try{
      const r = await api(`/api/jobs/${job.job_id}/items`,{method:"POST",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({insertion_sn:sn, invoice_id:d.invoice,
          manual_review_addition:d.manual,
          // blank UOM stays blank — the backend leaves the field empty and asks
          // for it (ITEM_UOM_MISSING) rather than assuming pieces
          item:{description:d.desc, quantity:qty, uom:d.uom, total_price:price,
                country_of_origin:d.coo, final_hs_code:d.hs}})});
      if(r && r.status==="ok"){
        setAddDlg(null); setNewItemId(r.added_item_id);
        applyMutationResult(r, `✔ Item added at SN ${r.inserted_sn}. Complete its required fields (description, quantity, official HS) before XML generation.`);
      } else setAddDlg({...d, err:(r&&(r.message||JSON.stringify(r.detail||r)))||"Add rejected."});
    }catch(e){ setAddDlg({...d, err:""+e}); }
    finally{ setBusy(""); }
  }
  async function confirmDelete(){
    const d = delDlg;
    if(d.typed.trim()!==String(d.sn)) return setDelDlg({...d,err:`Type the exact current SN (${d.sn}) to confirm.`});
    setBusy("item"); setMutMsg(null);
    try{
      // Re-check the row's CURRENT SN against a fresh server recompute; if the
      // order changed since the dialog opened, cancel and require re-confirmation.
      const fresh = await api(`/api/jobs/${job.job_id}/critical-review`);
      const cur = (fresh.item_details||[]).find(x=>x.item_id===d.item_id);
      if(!cur || cur.sn!==d.sn){
        setReview(fresh);
        setRv(v=>v?{...v, review_fingerprint:fresh.review_fingerprint}:v);
        setDelDlg(null);
        setMutMsg({ok:false, text: !cur ? "✖ That row no longer exists — the item list has been refreshed."
          : `✖ Row order changed — that item is now SN ${cur.sn}. Re-confirm the deletion.`});
        return;
      }
      const r = await api(`/api/jobs/${job.job_id}/items/${encodeURIComponent(d.item_id)}`,
        {method:"DELETE", headers:{"content-type":"application/json"},
         body:JSON.stringify({confirmation_sn:d.typed.trim()})});
      if(r && r.status==="ok"){
        setDelDlg(null); setNewItemId(null);
        applyMutationResult(r, `✔ Item SN ${r.deleted_sn} deleted — totals, allocation and readiness recomputed.`);
      } else setDelDlg({...d, err:(r&&r.message)||"Delete rejected."});
    }catch(e){ setDelDlg({...d, err:""+e}); }
    finally{ setBusy(""); }
  }

  // Reviewer-corrected shipment totals become the durable server-side
  // authority: the review summary, the Detailed-Review allocation preview,
  // finalize and XML all reconcile item sums EXACTLY to these values, and the
  // correction survives recomputes (it no longer lives only in this form).
  // Called from the Step 2 form with no arguments, and from PinConflictBanner
  // with explicit values (a click event is never a total — only strings and
  // numbers are honoured, so `onClick={applyShipmentTotals}` stays correct).
  //
  // `unit` matters and is not cosmetic. The Step 2 form's figure is typed in
  // the SHIPMENT's own unit, but the banner's is always kilograms — the engine
  // formats every remediation in kg and the item Gross column is kg. Posting a
  // kg figure under a shipment unit of LB stores 130.002 LB = 58.97 kg, i.e.
  // LESS than the authority it was meant to raise, so the block never clears
  // and the button becomes an infinite no-op; under T it stores 1000x the real
  // weight and does NOT block, which reaches Field 35 of the declaration.
  async function applyShipmentTotals(gross, packages, unit){
    const ok = v => typeof v === "string" || typeof v === "number";
    const gv = ok(gross) ? gross : rv.confirmed_gross_weight;
    const pv = ok(packages) ? packages : rv.confirmed_total_packages;
    const uv = typeof unit === "string" && unit ? unit : rv.reviewed_packing_weight_unit;
    const g = Number(gv), p = Number(pv);
    if(!isFinite(g)||g<=0||!isFinite(p)||p<=0){
      setMutMsg({ok:false, text:"Enter a gross weight and total packages greater than zero first."});
      return;
    }
    setBusy("item"); setMutMsg(null);
    try{
      const r = await api(`/api/jobs/${job.job_id}/shipment-totals`,{method:"POST",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({gross_weight:gv, weight_unit:uv, total_packages:pv})});
      if(r && r.status==="ok"){
        applyMutationResult(r, `✔ Shipment totals ${r.gross_weight} ${r.weight_unit} / ${r.total_packages} pkgs are now the FINAL authority — item weights and cartons reconcile exactly to them (see Detailed Review).`);
        setRv(v=>v?{...v, confirmed_gross_weight:r.critical_review.gross_weight,
                    confirmed_total_packages:r.critical_review.total_packages}:v);
      } else setMutMsg({ok:false, text:(r&&r.message)||"Shipment totals rejected."});
    }catch(e){ setMutMsg({ok:false, text:""+e}); }
    finally{ setBusy(""); }
  }

  // Regime & transport selections become the durable per-job authority
  // (POST /regime): they survive reloads, seed every review recompute and
  // stale any in-flight fingerprint.  Finalize still accepts the form values
  // one-shot, so saving is optional — it is the "don't lose this on reload"
  // button.  Empty values are not sent (the modes deliberately have no
  // default); an empty border office is sent as null = "same as clearance".
  async function saveRegimeDefaults(){
    const vals = {};
    const put = (k,v)=>{ if(v!==undefined && v!==null && String(v).trim()!=="") vals[k]=v; };
    put("declaration_type", rv.declaration_type);
    put("gen_procedure_code", rv.gen_procedure_code);
    put("customs_office_code", rv.customs_office_code);
    vals.border_office_code = rv.border_office_code ? rv.border_office_code : null;
    put("extended_customs_procedure", rv.extended_customs_procedure);
    put("national_customs_procedure", rv.national_customs_procedure);
    put("border_mode", rv.border_mode);
    put("inland_mode_of_transport", rv.inland_mode_of_transport);
    put("place_of_loading_code", rv.place_of_loading_code);
    put("location_of_goods", rv.location_of_goods);
    vals.container_flag = !!rv.container_flag;
    setBusy("item"); setMutMsg(null);
    try{
      const r = await api(`/api/jobs/${job.job_id}/regime`,{method:"POST",
        headers:{"content-type":"application/json"}, body:JSON.stringify(vals)});
      if(r && r.status==="ok" && Object.keys(r.changed||{}).length){
        applyMutationResult(r, `✔ Regime & transport saved as this job's defaults (${Object.keys(r.changed).join(", ")}) — they now survive reloads and recomputes; any generated XML is invalidated.`);
      } else if(r && r.status==="ok"){
        setMutMsg({ok:true, text:"✔ Regime & transport selections already match the saved job defaults — nothing changed."});
      } else setMutMsg({ok:false, text:(r&&r.message)||"Regime selection rejected."});
    }catch(e){ setMutMsg({ok:false, text:""+e}); }
    finally{ setBusy(""); }
  }

  // Bulk-apply one COO to every item (DB-validated server-side). Any prior
  // per-item COO edit is cleared so the value shows on all rows.
  // ---- answering a case in place ---------------------------------------
  // The compact list of ONLY the rows a case is about, with the same HS search
  // the item table uses.  Capped: past a handful this stops being a queue and
  // becomes the table, which already exists one click away.
  function rowAnswerList(rows, kind){
    if(!rows.length) return null;
    const shown = rows.slice(0, 8);
    return (
      <div className="qrows">
        {shown.map(r=>(
          <div className="qrow" key={r.item_id||r.sn}>
            <span className="qsn">SN {r.sn}</span>
            <span className="qdesc" title={r.description}>{r.description}</span>
            {kind==="low"
              ? <React.Fragment>
                  <code className="qhs" title={`matched ${r.final_hs} · source ${r.hs_source} · confidence ${r.hs_confidence}`}>{r.final_hs}</code>
                  <button type="button" className="cbtn" disabled={!!busy}
                          title={`confirm ${r.final_hs} for SN ${r.sn}`}
                          onClick={()=>pickHs(r.item_id, r.final_hs, "detailed_review")}>✓ keep</button>
                </React.Fragment>
              : <code className="qhs bad" title={r.invoice_hs?`printed on the invoice: ${r.invoice_hs}`:"nothing printed"}>{r.invoice_hs||"—"}</code>}
            <span className="qsearch">
              {/* keyed apart from the table's own search so the two never open together */}
              <HsSearch itemId={"q:"+r.item_id} disabled={!!busy}
                        isOpen={hsOpen==="q:"+r.item_id}
                        onOpen={()=>setHsOpen("q:"+r.item_id)}
                        onClose={()=>setHsOpen(v=>v==="q:"+r.item_id?null:v)}
                        onPick={code=>pickHs(r.item_id, code, "detailed_review_hs_search")}/>
            </span>
          </div>))}
        {rows.length>shown.length &&
          <div className="qmore">+{rows.length-shown.length} more — the item table takes the rest</div>}
      </div>);
  }
  // One call per row: each row carries its OWN matched code, so there is no
  // single request that says "confirm these six".  Sequential and not atomic —
  // which is why the outcome reports how many actually went through rather
  // than claiming the whole set.
  async function confirmAllLowHs(rows){
    if(!job || !rows.length) return;
    setBusy("item"); setMutMsg(null);
    let done = 0, last = null, failed = null;
    try{
      for(const r of rows){
        if(!/^\d{11}$/.test(r.final_hs||"")){
          failed = `SN ${r.sn} — ${r.final_hs||"no code"} is not an 11-digit official code`; break; }
        const res = await api(`/api/jobs/${job.job_id}/items/hs-review`,{method:"POST",
          headers:{"content-type":"application/json"},
          body:JSON.stringify({item_id:r.item_id, final_hs_code:r.final_hs,
                               hs_review_source:"detailed_review"})});
        if(!res || res.status!=="ok"){ failed = `SN ${r.sn} — ${(res&&res.message)||"rejected"}`; break; }
        last = res; done++;
      }
      if(last) applyMutationResult(last, failed
        ? `⚠ ${done} of ${rows.length} row(s) confirmed, then stopped: ${failed}`
        : `✔ ${done} low-confidence row(s) confirmed — each keeps the code the engine matched.`);
      else if(failed) setMutMsg({ok:false, text:failed});
    }catch(e){ setMutMsg({ok:false,
      text:`${done} of ${rows.length} confirmed, then failed — ${errText(e)}`}); }
    finally{ setBusy(""); }
  }
  // ONLY the rows with no origin.  The form's coo-all endpoint would also
  // overwrite every row that already resolved one — a different decision, and
  // usually the wrong one.
  async function applyCooToRows(code, rows){
    const c = String(code||"").trim().toUpperCase();
    if(!job || !c || !rows.length) return;
    setBusy("item"); setMutMsg(null);
    let done = 0, last = null, failed = null;
    try{
      for(const r of rows){
        const fields = {description:r.description, quantity:Number(r.quantity), uom:r.uom,
                        total_price:Number(r.total_price), country_of_origin:c};
        const res = await api(`/api/jobs/${job.job_id}/items/${encodeURIComponent(r.item_id)}`,
          {method:"PATCH", headers:{"content-type":"application/json"},
           body:JSON.stringify({fields})});
        if(!res || res.status!=="ok"){ failed = `SN ${r.sn} — ${(res&&res.message)||"rejected"}`; break; }
        last = res; done++;
      }
      if(last){ setCooFix("");
        applyMutationResult(last, failed
          ? `⚠ COO ${c} set on ${done} of ${rows.length} row(s), then stopped: ${failed}`
          : `✔ COO ${c} set on the ${done} row(s) that had none — rows that already carried an origin are untouched.`); }
      else if(failed) setMutMsg({ok:false, text:failed});
    }catch(e){ setMutMsg({ok:false,
      text:`${done} of ${rows.length} updated, then failed — ${errText(e)}`}); }
    finally{ setBusy(""); }
  }

  async function applyAllCoo(){

      } else setMutMsg({ok:false, text:(r&&r.message)||"COO apply rejected."});

  // Bulk HS apply (additional to the per-row HS selection): one DB-validated
  // HS code stamped on a printer-style SN range ("1-15, 19, 80" or "all").
  // The server validates the code and range, recomputes everything derived
  // and invalidates any generated XML — same path as a per-row pick.
  async function applyHsRange(){
    const d = hsRangeDlg; if(!d) return;

        setHsRangeDlg(null); setNewItemId(null);
        applyMutationResult(r, `✔ HS ${r.final_hs_code} applied to ${r.applied_count} item(s) (SN ${spec}) — official unit, supplementary and readiness recomputed from the database; any generated XML invalidated.`);
      } else setHsRangeDlg({...d, err:(r&&r.message)||"Bulk HS apply rejected."});
    }catch(e){ setHsRangeDlg({...d, err:""+e}); }
    finally{ setBusy(""); }
  }

  // Item field edits (description / COO / qty / UOM / total price / pinned
  // gross+net weight and cartons) — sent by immutable item_id; the server
  // re-derives HS/COO resolution, allocation, supplementary, totals and
  // readiness from the edited content.
  //
  // The three PIN fields have three states, and all three have to survive the
  // trip: untouched (omitted entirely — an unchanged computed value must never
  // become a pin), changed (sent as a number), and CLEARED (sent as "" — the
  // server drops the pin and the computed value comes back).  Without the
  // third, a pin could be changed but never taken back.
  function pinValue(current, original){
    const c = String(current==null?"":current).trim();
    const o = String(original==null?"":original).trim();
    return c === o ? undefined : c;                 // "" clears, undefined = untouched
  }
  async function submitEdit(){
    const d = editDlg;
    const qty = numOrNull(d.qty), price = numOrNull(d.price);
    if(!d.desc.trim()) return setEditDlg({...d, err:"Description cannot be empty."});
    if(qty===null||qty<=0) return setEditDlg({...d, err:"Quantity must be a finite number greater than zero."});
    if(price===null) return setEditDlg({...d, err:"Total price must be a finite non-negative number."});
    const gw = pinValue(d.gross, d.g0), nw = pinValue(d.net, d.n0), cw = pinValue(d.ctn, d.c0);
    const sq = pinValue(d.sup, d.s0);
    if(sq){
      const v = numOrNull(sq);
      if(v===null||v<=0) return setEditDlg({...d, err:"Supplementary quantity must be a finite number greater than zero."});
    }
    if(gw){
      const v = numOrNull(gw);
      if(v===null||v<=0) return setEditDlg({...d, err:"Gross weight must be a finite number greater than zero (kg)."});
    }
    if(nw){
      const v = numOrNull(nw);
      if(v===null||v<=0) return setEditDlg({...d, err:"Net weight must be a finite number greater than zero (kg)."});
    }
    if(cw){
      const v = numOrNull(cw);
      if(v===null||v<0.01) return setEditDlg({...d, err:"Cartons must be a finite number of at least 0.01 CTN."});
      // the MUST rule, checked here too so the reviewer is told before the round trip
      if(Math.abs(Math.round(v*100) - v*100) > 1e-9)
        return setEditDlg({...d, err:"Cartons must be a whole multiple of 0.01 CTN — enter at most two decimals (e.g. 3, 3.5 or 3.33)."});
    }
    if(gw || nw){
      const effG = numOrNull(gw!==undefined?gw:d.gross), effN = numOrNull(nw!==undefined?nw:d.net);
      if(effG!==null && effN!==null && effN>=effG)
        return setEditDlg({...d, err:"Net weight must be less than gross weight (kg)."});
    }
    // blank UOM stays blank (see the add dialog) — never silently coerced
    const fields = {description:d.desc, quantity:qty, uom:d.uom,
                    total_price:price, country_of_origin:d.coo};
    if(gw!==undefined) fields.gross_weight = gw;
    if(nw!==undefined) fields.net_weight = nw;
    if(cw!==undefined) fields.carton_count = cw;
    if(sq!==undefined) fields.supplementary_quantity = sq;
    setBusy("item"); setMutMsg(null);
    try{
      const r = await api(`/api/jobs/${job.job_id}/items/${encodeURIComponent(d.item_id)}`,
        {method:"PATCH", headers:{"content-type":"application/json"},
         body:JSON.stringify({fields})});
      if(r && r.status==="ok"){
        setEditDlg(null); setNewItemId(d.item_id);
        applyMutationResult(r, `✔ Item SN ${d.sn} updated (${Object.keys(r.edited).join(", ")}) — allocation, supplementary and totals recomputed; any generated XML invalidated.`);
      } else setEditDlg({...d, err:(r&&r.message)||"Edit rejected."});
    }catch(e){ setEditDlg({...d, err:""+e}); }
    finally{ setBusy(""); }
  }

  // HS selection / low-confidence confirmation. Only {item_id, code, source}
  // is sent — the server re-derives unit, description, supplementary and
  // readiness from its own database (client values are never authoritative).
  async function pickHs(itemId, code, source){
    if(!/^\d{11}$/.test(code||"")){
      setMutMsg({ok:false, text:"Only an exact 11-digit official HS code can be selected."});
      return;
    }
    setHsOpen(null); setBusy("item"); setMutMsg(null);
    try{
      const r = await api(`/api/jobs/${job.job_id}/items/hs-review`,{method:"POST",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({item_id:itemId, final_hs_code:code, hs_review_source:source})});
      if(r && r.status==="ok"){
        setNewItemId(null);
        applyMutationResult(r, `✔ HS ${r.final_hs_code} applied to the item — official unit, supplementary quantity and readiness recomputed from the database; any generated XML is invalidated.`);
      } else setMutMsg({ok:false, text:(r&&r.message)||"HS selection rejected."});
    }catch(e){ setMutMsg({ok:false, text:""+e}); }
    finally{ setBusy(""); }
  }

  const set = k => e => setRv(v=>({...v, [k]: e && e.target ? (e.target.type==="checkbox"?e.target.checked:e.target.value) : e}));

  // ---- regime helpers: Box 1 is picked as ONE line; Box 37's extended code
  // must start with the Box-1 general-procedure digit (ASYCUDA convention),
  // so the dropdown is filtered and a type change re-bases an incompatible
  // code onto the first compatible ANNEX-1 row (IM 4 → 4000, EX 1 → 1000, …).
  const declLine = rv ? `${rv.declaration_type||""} ${rv.gen_procedure_code||""}`.trim() : "";
  const extFiltered = rv ? extProcRef.filter(p=>!rv.gen_procedure_code || p.code[0]===rv.gen_procedure_code) : [];
  function onDeclLine(e){
    const [typ, code] = String(e.target.value||"").split(" ");
    setRv(v=>{
      let ext = v.extended_customs_procedure;
      if(code && ext && ext[0]!==code){
        const first = extProcRef.find(p=>p.code[0]===code);
        if(first) ext = first.code;
      }
      return {...v, declaration_type:(typ||"").toUpperCase(), gen_procedure_code:code||"",
              extended_customs_procedure:ext};
    });
  }

  const anyUploading = Object.keys(uploading).length > 0;
  // EXTRACTING is the server's own record of a claimed, in-flight extraction.
  // Trusting only the local `extracting` state made a reload during extraction
  // look like the document had gone back to "uploaded — pending", which is
  // exactly the moment a reviewer is most tempted to start a second one.
  const runningDocs = docs.filter(d=>d.status==="EXTRACTING");
  const anyExtracting = Object.keys(extracting).length > 0 || runningDocs.length > 0;
  // Count both sources, deduplicated by role: counting only the local one
  // reported "Extracting 0 document(s)" for work this tab did not start.
  const extractingCount = new Set([...Object.keys(extracting),
                                   ...runningDocs.map(d=>d.role)]).size;
  const DEAD = ["FAILED","ROLE_REJECTED"];        // contributes nothing to the declaration
  // ---- evidence viewer targeting -------------------------------------- //
  function openDoc(docId, page, label){ setViewer({docId, page:page||null, label:label||""}); }
  // A detail row knows the file name + page it was printed on (src_file /
  // src_page).  Prefer the live document in the row's own role; fall back to
  // any document with that name so even a rejected upload stays inspectable.
  function openRowSource(row){
    const named = docs.filter(d=>d.file===row.src_file);
    const d = named.find(x=>x.role==="INVOICE" && !DEAD.includes(x.status))
           || named.find(x=>!DEAD.includes(x.status)) || named[0];
    if(d) openDoc(d.document_id, row.src_page, `item ${row.sn}`);
  }
  // Critical-review KPIs name their authority in prose ("AIR_WAYBILL",
  // "packing list", …) — map that text to the document it came from.
  function sourceDocFor(srcText){
    const s = (srcText||"").toUpperCase();
    const role = (s.includes("AIR")||s.includes("AWB")||s.includes("WAYBILL")||s.includes("BL")) ? "AIR_WAYBILL"
      : s.includes("PACK") ? "PACKING_LIST"
      : s.includes("INVOICE") ? "INVOICE"
      : s.includes("BANK") ? "BANKING" : null;
    if(!role) return null;
    return docs.find(d=>d.role===role && !DEAD.includes(d.status)) || null;
  }
  const present = new Set(docs.filter(d=>!DEAD.includes(d.status)).map(d=>d.role));                    // uploaded or extracted
  const filled = new Set(docs.filter(d=>!DEAD.includes(d.status)&&d.status!=="UPLOADED"
                                        &&d.status!=="EXTRACTING").map(d=>d.role));                    // extracted only
  // FAILED belongs here: Continue retries it (reusing the stored OCR), which
  // is what its own failure message promises.  Without it a job whose only
  // unfinished document had failed showed no Continue button at all.
  const pendingDocs = docs.filter(d=>d.status==="UPLOADED"||d.status==="FAILED");
  // A role-mismatch verdict is a question, not a badge: the backend refuses
  // the review until every one is answered, so the button must agree.
  const undecidedDocs = docs.filter(d=>d.status==="ROLE_REVIEW_REQUIRED");
  const canReview = REQUIRED.every(r=>filled.has(r)) && undecidedDocs.length===0;
  // Item-anchored review notes, keyed by SN.  Step 2 collapses them into one
  // line; the row that has to be looked at carries its own ⚠ down here.
  const itemNotes = itemNotesBySn(review && review.warnings);

  // ---- Detailed Review row filters -------------------------------------
  // A 200-row declaration is an ordinary day on this desk, and the reviewer's
  // real question is never "show me everything" — it is "which rows still
  // need me".  The buckets are exactly the states that block or weaken the
  // XML, so each one is a queue that can be worked to zero.  Filtering is
  // presentation only: allocation, totals and the XML always read every row.
  const itemRows = (review && review.item_details) || [];
  const rowFlags = row => ({
    nohs:    !row.final_hs,
    low:     !!row.hs_low_confidence,
    nocoo:   !String(row.coo||"").trim(),
    flagged: itemNotes.has(String(row.sn)),
    touched: !!(row.edited || row.origin==="manual" || row.gross_pinned || row.net_pinned
                || row.ctn_pinned || row.sup_qty_pinned),
  });
  const ITEM_FILTERS = [
    {id:"all",     label:"All rows",     hit:()=>true,      tone:""},
    {id:"nohs",    label:"Needs HS",     hit:f=>f.nohs,     tone:"no"},
    {id:"low",     label:"Low-confidence HS", hit:f=>f.low, tone:"w"},
    {id:"nocoo",   label:"No COO",       hit:f=>f.nocoo,    tone:"w"},
    {id:"flagged", label:"Flagged",      hit:f=>f.flagged,  tone:"w"},
    {id:"touched", label:"Reviewer-set", hit:f=>f.touched,  tone:""},
  ];
  const itemQn = itemQ.trim().toLowerCase();
  const matchesQ = row => !itemQn || [row.sn,row.description,row.coo,row.invoice_hs,
                                      row.final_hs,row.uom,row.sup_unit]
    .some(v => String(v==null?"":v).toLowerCase().includes(itemQn));
  const itemCounts = {};
  ITEM_FILTERS.forEach(f=>{ itemCounts[f.id] = 0; });
  itemRows.forEach(r=>{ const f = rowFlags(r);
                        ITEM_FILTERS.forEach(x=>{ if(x.hit(f)) itemCounts[x.id]++; }); });
  // a bucket that empties out (the reviewer just fixed the last row in it)
  // must not leave the table showing nothing — fall back to every row
  const activeItemFilter = ITEM_FILTERS.find(f=>f.id===itemFilter && itemCounts[f.id]>0)
                        || ITEM_FILTERS[0];
  const visibleRows = itemRows.filter(r=>activeItemFilter.hit(rowFlags(r)) && matchesQ(r));
  const rowsHidden = itemRows.length - visibleRows.length;

  // ---- Decision queue: gather, never invent -----------------------------
  const docByFile = f => docs.find(d=>d.file===f && !DEAD.includes(d.status))
                      || docs.find(d=>d.file===f) || null;
  const invoiceDoc = docs.find(d=>d.role==="INVOICE" && !DEAD.includes(d.status)) || null;
  const dqCases = [];
  // 1 · a document whose role the backend refuses to assume for you.  OUTSIDE
  //     the review guard on purpose: this is the case that stops the review
  //     from being computed at all, so gating it on a review would hide the
  //     one decision standing between the reviewer and everything else.
  undecidedDocs.forEach(d=>{
    const lbl = (ROLES.find(r=>r.id===d.role)||{}).label || d.role;
    dqCases.push({id:"role:"+d.document_id, sev:"block", group:"docs",
      code:"ROLE_REVIEW_REQUIRED", step:"1", go:"Open the upload box",
      title:`${d.file} may not belong in the ${lbl} box`,
      body:"The extractor read this document's own header and it disagrees with the box it was dropped into. Declared under the wrong role its parties and totals go onto the SAD. Confirm the role or exclude the document — the critical review stays refused until every one of these is answered.",
      hint:"neither is starred — open it in the viewer first",
      // no ★: the engine has said the header disagrees, but which of the two is
      // right is exactly what it cannot know
      choices:[
        {label:"Wrong box — exclude it", run:()=>decideRole(d.document_id, false)},
        {label:`It is a ${lbl} — use it`, run:()=>decideRole(d.document_id, true)}],
      ev:{docId:d.document_id, page:1, label:"role check"}});
  });
  if(review && rv){
    // 2 · Box 25 / Box 26 — required, deliberately unseeded.  These used to
    //      surface only if the backend happened to word a warning about them.
    if(!rv.border_mode) dqCases.push({id:"mode25", sev:"block", group:"docs",
      code:"TRANSPORT_MODE_MISSING", step:"2", go:"Open the form",
      act:()=>setTimeout(()=>jumpToSection("cr-manifest"), 260),
      title:"Mode of transport at the border (Box 25) is not set",
      body:"Box 25 is a reviewer selection — the engine will not guess a mode from the documents. Box 26 is asked separately because cargo often continues by road after an air leg.",
      hint:"no default is applied",
      note:"held for finalize",
      // suggestions only, and never for air when the shipment travelled on a
      // bill of lading (Nepal is landlocked: sea cargo crosses the border by
      // truck or train, so a B/L job is offered those instead of 01)
      choices:transportDocType(rv, review)==="BL"
        ? [{label:"02 — By Truck", star:true, title:"a bill of lading shipment reaches the border by road",
            run:()=>setRv(v=>({...v, border_mode:"02"}))},
           {label:"04 — By Containerised Truck", title:"containerised cargo on a bill of lading",
            run:()=>setRv(v=>({...v, border_mode:"04", container_flag:true}))},
           {label:"03 — By Train", title:"rail leg from the port to the border",
            run:()=>setRv(v=>({...v, border_mode:"03"}))}]
        : (rv.hawb_no||rv.mawb_no)
        ? [{label:"01 — By Air", star:true, title:"an AWB number is present on this shipment",
            run:()=>setRv(v=>({...v, border_mode:"01"}))}] : null,
      answer:<div style={{maxWidth:330}}>
               <ModePick modeRef={modeRef} value={rv.border_mode} id="Box 25"
                         onChange={v=>setRv(s=>({...s, border_mode:v}))}/></div>});
    if(!rv.inland_mode_of_transport) dqCases.push({id:"mode26", sev:"block", group:"docs",
      code:"TRANSPORT_MODE_MISSING", step:"2", go:"Open the form",
      act:()=>setTimeout(()=>jumpToSection("cr-manifest"), 260),
      title:"Inland mode of transport (Box 26) is not set",
      body:"Box 26 describes the leg from the border to the clearance office. When the border office and the clearance office are the same, the goods do not travel inland under customs control and the border mode matches.",
      hint:"no default is applied",
      note:"held for finalize",
      choices:rv.border_mode
        ? [{label:`Same as Box 25 — ${rv.border_mode}`, star:!rv.border_office_code,
            title:"border office equals the clearance office on this job",
            run:()=>setRv(v=>({...v, inland_mode_of_transport:v.border_mode}))}] : null,
      answer:<div style={{maxWidth:330}}>
               <ModePick modeRef={modeRef} value={rv.inland_mode_of_transport} id="Box 26"
                         onChange={v=>setRv(s=>({...s, inland_mode_of_transport:v}))}/></div>});
    // 2c · Field 40 — the reviewer is ALWAYS asked, and the backend already
    //      ships the candidates and which one it suggests
    if(!rv.field_40_confirmed) dqCases.push({id:"field40", sev:"warn", group:"docs",
      code:"FIELD_40_UNCONFIRMED", step:"2", go:"Open the form",
      act:()=>setTimeout(()=>jumpToSection("cr-manifest"), 260),
      title:"Field 40 — previous document is not confirmed",
      body:"Field 40 is stamped on every item of the declaration, so it is confirmed explicitly rather than defaulted. "+maskEngine(review.field_40_reason||""),
      hint:"stamped on every item",
      note:"held for finalize",
      choices:(review.field_40_candidates||[]).length ? review.field_40_candidates.map(c=>({
        label:`${c.source}: ${c.value}`, star:!!c.suggested,
        title:c.suggested?`system suggestion — ${review.field_40_reason}`:`use the ${c.source} number`,
        run:()=>setRv(v=>({...v, field_40_previous_document:c.value, field_40_confirmed:true}))})) : null,
      answer:(review.field_40_candidates||[]).length ? null :
        <div className="fpair" style={{maxWidth:420}}>
          <input className="t" value={rv.field_40_previous_document}
                 onChange={set("field_40_previous_document")}/>
          <button type="button" className="cbtn star"
                  onClick={()=>setRv(v=>({...v, field_40_confirmed:true}))}>Confirm</button>
        </div>});
    // 2d · freight: the documents printed more than one amount
    if((review.freight_candidates||[]).length>1) dqCases.push({id:"freight", sev:"warn",
      group:"totals", code:"FREIGHT_CANDIDATE_CONFLICT", step:"2", go:"Open the form",
      act:()=>setTimeout(()=>jumpToSection("cr-freight"), 260),
      title:`${review.freight_candidates.length} documents print a freight amount`,
      body:"The reviewed amount carries the highest authority and is apportioned across every item by value share, so the source chosen here moves every statistical value on the declaration. An explicit 0.00 is allowed.",
      hint:`current: ${review.manual_freight_currency} ${rv.manual_freight_amount||"—"}`,
      note:"held for finalize",
      choices:review.freight_candidates.map(c=>({
        label:`${c.source}: ${c.currency} ${c.amount}`,
        star:c.amount===review.manual_freight_amount, disabled:c.comparable===false,
        title:c.comparable===false
          ? `printed in ${c.currency}, not ${review.manual_freight_currency} — convert it in the form`
          : c.detail,
        run:()=>setRv(v=>({...v, manual_freight_amount:c.amount}))}))});
    // 3 · items the official HS database would not resolve
    if(itemCounts.nohs) dqCases.push({id:"hs-none", sev:"block", group:"hs",
      code:"HS_DB_GATE", step:"3", go:"Open the item table",
      act:()=>setItemFilter("nohs"),
      title:`${itemCounts.nohs} of ${itemRows.length} items have no official HS code`,
      body:"What the invoice printed is not a record in the official Nepal HS database. Manual entry never bypasses that gate — an 8-digit prefix that does resolve is completed by the database, which also supplies the national suffix and the supplementary unit.",
      hint:`${itemCounts.nohs} row(s) · blocks the XML`,
      answer:rowAnswerList(itemRows.filter(r=>!r.final_hs), "nohs"),
      ev:invoiceDoc?{docId:invoiceDoc.document_id, page:null, label:"invoice rows"}:null});
    // 4 · resolved, but below the confidence floor
    if(itemCounts.low) dqCases.push({id:"hs-low", sev:"warn", group:"hs",
      code:"HS_LOW_CONFIDENCE", step:"3", go:"Open the item table",
      act:()=>setItemFilter("low"),
      title:`${itemCounts.low} item(s) matched their HS with low confidence`,
      body:"These rows resolved to a valid database record but below the confidence floor — usually a short invoice description. Confirming keeps the engine's choice and stamps the row as reviewer-approved. Low confidence never blocks the XML, but a wrong heading changes the duty treatment.",
      hint:"already valid — this is a confirmation, not a fix",
      choices:[{label:`Confirm all ${itemCounts.low}`, star:true,
                title:"applies each row's own matched code, one call per row",
                run:()=>confirmAllLowHs(itemRows.filter(r=>r.hs_low_confidence))}],
      answer:rowAnswerList(itemRows.filter(r=>r.hs_low_confidence), "low"),
      ev:invoiceDoc?{docId:invoiceDoc.document_id, page:null, label:"invoice rows"}:null});
    // 5 · rows carrying no country of origin
    if(itemCounts.nocoo) dqCases.push({id:"coo-none", sev:"warn", group:"hs",
      code:"COO_MISSING", step:"3", go:"Open the item table",
      act:()=>setItemFilter("nocoo"),
      title:`${itemCounts.nocoo} item(s) carry no country of origin`,
      body:"No origin was resolved for these rows from the invoice or the certificate of origin. Setting it here touches ONLY these rows — the form's “apply to all” would also overwrite the rows that already resolved.",
      hint:"exporter country is the usual fallback",
      choices:String(rv.exporter_country_code||"").trim()
        ? [{label:`Use the exporter country — ${rv.exporter_country_code}`, star:true,
            run:()=>applyCooToRows(rv.exporter_country_code,
                                   itemRows.filter(r=>!String(r.coo||"").trim()))}] : null,
      answer:<div className="fpair" style={{maxWidth:340}}>
          <input className="t" placeholder="alpha-2, e.g. CN" value={cooFix}
                 onChange={e=>setCooFix(e.target.value)}/>
          <button type="button" className="cbtn" disabled={!cooFix.trim()||!!busy}
                  onClick={()=>applyCooToRows(cooFix, itemRows.filter(r=>!String(r.coo||"").trim()))}>
            Apply to the {itemCounts.nocoo} row(s)</button>
        </div>});
    // 6 · the engine's own item-anchored notes, as ONE case (the rows carry ⚠)
    if(itemCounts.flagged) dqCases.push({id:"row-notes", sev:"warn", group:"totals",
      code:"ITEM_REVIEW_NOTES", step:"3", go:"Read the flagged rows",
      act:()=>setItemFilter("flagged"),
      title:`${itemCounts.flagged} item(s) carry a review note from the engine`,
      body:"Each of these rows has a note naming what the engine had to assume or could not match — an unmatched packing row, a derived weight, an inferred unit. They do not block the XML; they are the values most worth a second look before it is built.",
      hint:"a read, not a decision — nothing to answer here",
      // Deliberately no choices: there is no answer to give, only a judgement
      // to make against the row.  Offering a button would be theatre.
      answer:<div className="qnotelist">
        {[...itemNotes.entries()].slice(0,6).map(([sn,ms],i)=>(
          <div key={i} className="qnoteline"><b>SN {sn}</b> {maskEngine(ms[0].message||ms[0].code)}</div>))}
        {itemNotes.size>6 && <div className="qmore">+{itemNotes.size-6} more rows carry a note</div>}
      </div>});
    // 7 · declaration-level warnings the review raised loudly (the quiet
    //     assumption notes stay where they are — they are not decisions)
    const covered = new Set(dqCases.map(c=>c.code));
    (review.warnings||[]).forEach((m,i)=>{
      if(m.severity!=="BLOCKING" && ASSUMPTION_CODES.has(m.code)) return;
      if(m.item_sequence || _SN_GROUP_RE.test(m.message||"")) return;   // already case 6
      if(covered.has(m.code) || DQ_OWNED_CODES.has(m.code)) return;   // the queue asks this itself, from live values
      const d = sourceDocFor(m.message) || sourceDocFor(m.code);
      dqCases.push({id:"w:"+i, sev:m.severity==="BLOCKING"?"block":"warn",
        group:dqGroup(m.code), code:m.code, step:"2", go:"Open the critical review",
        title:maskEngine(String(m.message||"").split(". ")[0]).slice(0,110),
        body:maskEngine(m.message||""),
        hint:m.severity==="BLOCKING"?"blocks the XML":"confirm the reviewed value",
        ev:d?{docId:d.document_id, page:null, label:m.code}:null});
    });
    // 8 · what the last finalize actually refused (skip codes already listed)
    const seenCodes = new Set(dqCases.map(c=>c.code));
    ((decl && decl.blocking_errors)||[]).forEach((m,i)=>{
      // same staleness: these are from the LAST finalize, so a value answered
      // since then would otherwise be reported as still refused
      if(seenCodes.has(m.code) || DQ_OWNED_CODES.has(m.code)) return;
      seenCodes.add(m.code);
      dqCases.push({id:"d:"+i, sev:"block", group:dqGroup(m.code), code:m.code,
        step:m.item_sequence?"3":"2", go:m.item_sequence?"Open the item table":"Open the critical review",
        title:maskEngine(String(m.message||"").split(". ")[0]).slice(0,110),
        body:maskEngine(m.message||""), hint:"refused by the last finalize"});
    });
  }
  dqCases.sort((a,b)=>(a.sev==="block"?0:1)-(b.sev==="block"?0:1));
  const dqBlocking = dqCases.filter(c=>c.sev==="block").length;
  // Answering moves on by itself — deciding where to look next is the tedium
  // the queue exists to remove.  The next case is read from the list as it
  // stands BEFORE the answer lands, because the answered one is about to
  // vanish from it.
  function advanceFrom(id){
    const i = dqCases.findIndex(c=>c.id===id);
    const next = dqCases[i+1] || dqCases[i-1] || null;
    setQFocus(next ? next.id : null);
  }
  function answerCase(c, i){
    const ch = c.choices && c.choices[i];
    if(!ch || ch.disabled) return;
    Promise.resolve(ch.run()).catch(()=>{});
    advanceFrom(c.id);
  }
  // The engine's own answers, each still pointing at the page it came from.
  const dqResolved = ((review && review.evidence)||[]).map(ev=>{
    const d = docByFile(ev.source_file);
    return {k:String(ev.field||"").replace(/_/g," "), v:ev.normalized_value,
            src:[ev.source_file, ev.page_number?"p."+ev.page_number:""].filter(Boolean).join(" · "),
            docId:d?d.document_id:null, page:ev.page_number||null};
  });

  return (
  <div>
    <header>
      <div className="hdrtop">
        <div>
          <h1>Easy Customs · ASYCUDA World XML Generator</h1>
        </div>
        <div className="row" style={{gap:8}}>
          {anyExtracting && <span className="badge brand" style={{display:"inline-flex",alignItems:"center",gap:8}}>
            <Spin tone="on"/> {ENGINE_RUNNING}</span>}
          {view==="job" && <button type="button" className="gbtn hdr" onClick={goHome}>🗂 ALL JOBS</button>}
          {/* "none" = open the panel with every section collapsed; the
              contextual buttons open their own section expanded */}
          <button type="button" className="gbtn hdr" onClick={()=>setGuide("none")}>📖 GUIDE</button>
          {session && <span className="whoami">
            <span className="badge" title={`Signed in until ${new Date(session.expires_at*1000).toLocaleString()}`}>
              👤 {session.username}</span>
            <button type="button" className="gbtn hdr" onClick={onSignOut}>SIGN OUT</button>
          </span>}
        </div>
      </div>
      {cfg && <div className="badges">
        <span className="badge brand" style={{display:"inline-flex",alignItems:"center",gap:7}}>
          {(cfg.ocr_live||cfg.extraction_live) && <span className="livedot"/>}
          {ENGINE}
          <span style={{opacity:.8,fontWeight:500}}>{cfg.ocr_live && cfg.extraction_live ? "· live"
            : (cfg.ocr_live || cfg.extraction_live) ? "· partially live" : "· offline fallback"}</span></span>
      </div>}
    </header>
    <main className={view==="job" && viewer ? "with-viewer" : undefined}>
      {guide && <GuideModal initial={guide} onClose={()=>setGuide(null)}/>}
      {view==="job" && viewer && job &&
        <DocViewer job={job} docs={docs} viewer={viewer}
                   onSwitch={id=>setViewer({docId:id, page:null, label:""})}
                   onClose={()=>setViewer(null)}/>}
      {err && <div className="msg b">{maskEngine(err)}</div>}

      {view==="boot" && <div className="card">
        <div className="row" style={{gap:10}}><Spin size="lg"/>
          <span className="muted">Reopening your last job…</span></div>
      </div>}

      {view==="jobs" && <JobsDashboard onOpen={openJob} onNew={freshJob} onDemo={loadDemo} busy={busy}/>}

      {view==="job" && <React.Fragment>
      {/* Stays on screen for the whole job, not just at load: the reviewer who
          reaches finalize twenty minutes later is the one who has to know these
          numbers were never read off a document. */}
      {job && job.is_demo &&
        <div className="demobanner" role="note">
          <b>DEMO — sample shipment.</b> The facts on this job were seeded from the bundled
          sample data, not extracted from the attached PDFs. Every step after that is the real
          pipeline, so the XML this produces is a real file — use it to try ASYCUDA, never to
          file a declaration.
        </div>}
      {/* STEP 1 */}
      <div className="card">
        <h2><span className="htxt"><span className="step">1</span> Upload role-specific documents</span>
            <GuideButton onOpen={setGuide} section="upload"/></h2>
        {qReturn && <button type="button" className="qback" data-ec-goto="queue"
                onClick={()=>setQReturn(false)}>← Back to the Decision queue</button>}
        <div className="row" style={{marginBottom:14}}>
          <button className="btn" onClick={loadDemo} disabled={!!busy||anyUploading||anyExtracting}>{busy==="demo"?<span style={{display:"inline-flex",alignItems:"center",gap:8}}><Spin tone="on"/> Loading…</span>:"⚡ Load Sample Shipment (demo)"}</button>
          <button className="btn ghost" onClick={freshJob} disabled={!!busy||anyUploading||anyExtracting}>New empty job</button>
          {job && <span className="pill">job {job.job_id.slice(0,8)} · {job.status}</span>}
          {/* what the engine has actually finished, counted rather than inferred
              from six boxes the eye has to scan */}
          {job && present.size>0 &&
            <span className={"pill"+(filled.size===present.size?" ok":"")}>
              {filled.size} of {present.size} document{present.size>1?"s":""} extracted</span>}
        </div>
        {/* Hidden pickers behind every box's photo buttons (stageRoleRef aims
            them).  Two inputs because `capture` FORCES the camera on Android —
            the gallery picker must be its own input to keep the library
            reachable; on desktop the camera input degrades to a file dialog. */}
        <input ref={galleryRef} type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple
               style={{display:"none"}} aria-hidden="true" tabIndex={-1}
               onChange={e=>{ const fl=e.target.files, role=stageRoleRef.current;
                              if(fl && fl.length && role) stageAdd(role, fl); e.target.value=""; }} />
        <input ref={cameraRef} type="file" accept="image/*" capture="environment"
               style={{display:"none"}} aria-hidden="true" tabIndex={-1}
               onChange={e=>{ const fl=e.target.files, role=stageRoleRef.current;
