# Runs the backend suite on every push, and on every pull request into main.
#
# No secrets, deliberately. `app/extraction/service.py` falls back to the
# offline provider when a live key or library is missing, and `tests/conftest.py`
# supplies its own operator account plus a per-run temp SQLite database, so the
# suite is green on a runner that has never seen a key: this workflow's first
# run was 1991 passed, 9 skipped, 47 xfailed — the same counts a developer
# machine WITH both keys configured produces, because no test's outcome depends
# on having them. The nine skips are content-driven (`refusal case`,
# `parser stood down`), not key-driven. If a test ever does need a real key, it
# belongs behind a skip, not behind a secret in here.
name: CI

on:
  push:
  pull_request:
    branches: [main]

# The job only reads the repository. Nothing here comments, tags or publishes.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # The suite runs in ~2-3 minutes. This is a dead-man's switch for a hung
    # job, not a target to tune against.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 3.12 because backend/Dockerfile builds on python:3.12-slim, and CI
      # should test the interpreter production runs. requirements.txt is
      # range-pinned for 3.10-3.14 on purpose, so this is the chosen version
      # rather than the only workable one.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # From backend/, matching the documented `cd backend && pytest -q`:
      # conftest.py, the `app` package and reference_data/ are all resolved
      # relative to it.
      - name: Run tests
        working-directory: backend
        run: pytest -q
